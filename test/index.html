                        <div style={{ fontSize: 8, color: "#4a7a54", marginTop: 3 }}>{d.name}</div>
                        <div style={{ fontSize: 8, color: col, fontFamily: "monospace" }}>{d.cal === null ? "—" : d.cal}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ) : <div style={{ fontSize: 11, color: "#4a7a54" }}>אין נתוני אכילה מ-7 הימים האחרונים</div>}
          </Section>

          <Section id="personal" title="📊 פרטים אישיים">
            <div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 10 }}>
                {[
                  ["🎂 גיל", `${age}`, `עוד ${daysToNextBday} ימים ל-${age + 1}`],
                  ["📏 גובה", `${(HEIGHT_CM/100).toFixed(2)} מ׳`, ""],
                  ["📐 BMI", `${bmi}`, bmi < 18.5 ? "תת משקל" : bmi < 25 ? "תקין" : bmi < 30 ? "עודף קל" : "עודף"],
                ].map(([l, v, sub]) => (
                  <div key={l} style={{ background: "#0b1a0d", borderRadius: 8, border: "1px solid #1a3a1f", padding: "8px 10px" }}>
                    <div style={{ fontSize: 10, color: "#4a7a54", marginBottom: 2 }}>{l}</div>
                    <div style={{ fontSize: 15, fontWeight: 700, color: "#e0f0e0", fontFamily: "monospace" }}>{v}</div>
                    {sub ? <div style={{ fontSize: 9, color: "#4a7a54", marginTop: 2 }}>{sub}</div> : null}
                  </div>
                ))}
              </div>

              <div style={{ fontSize: 11, color: "#4ade80", fontWeight: 700, marginBottom: 6 }}>🔥 קלוריות</div>
              <div style={{ fontSize: 11, color: "#c8e8c8", lineHeight: 2 }}>
                BMR ({bodyFat !== null ? "Katch-McArdle" : "Mifflin-St Jeor"}): <span style={{ color: "#4ade80", fontWeight: 700 }}>{bmr.toLocaleString()} קל׳</span><br/>
                {ACT_TYPES.map(a => (
                  <span key={a.key}>{a.label}: <span style={{ color: "#60a5fa", fontWeight: 700 }}>{Math.round(bmr * a.mult).toLocaleString()} קל׳</span><br/></span>
                ))}
              </div>
              <div style={{ marginTop: 8, background: "#0b1a0d", borderRadius: 8, border: "1px solid #1e4a2e", padding: "8px 10px" }}>
                <div style={{ fontSize: 11, color: "#fbbf24", fontWeight: 700, marginBottom: 4 }}>⚡ גירעון בתפריט מלא ({PLAN_CAL.toLocaleString()} קל׳)</div>
                <div style={{ fontSize: 11, color: "#c8e8c8", lineHeight: 1.9 }}>
                  {ACT_TYPES.map(a => {
                    const def = Math.round(bmr * a.mult) - PLAN_CAL;
                    return <span key={a.key}>{a.label}: <span style={{ color: def > 900 ? "#fbbf24" : "#4ade80", fontWeight: 700 }}>{def > 0 ? "▼" : "▲"} {Math.abs(def)} קל׳</span><br/></span>;
                  })}
                </div>
              </div>
              <div style={{ fontSize: 10, color: "#4a7a54", marginTop: 8, lineHeight: 1.6 }}>
                חלבון בתפריט: {PLAN_PRO}g = {(PLAN_PRO/last).toFixed(2)} g/ק״ג משקל{leanMass ? ` · ${(PLAN_PRO/leanMass).toFixed(2)} g/ק״ג מסה רזה` : ""}. מומלץ בגירעון עם אימוני כוח: 1.6–2.2 g/ק״ג.
              </div>
            </div>
          </Section>

          <Section id="month" title="📅 יעד חודשי">
            {monthStat ? (
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, marginBottom: 10 }}>
                  <span style={{ color: "#4ade80", fontWeight: 700 }}>טווח החודש: {monthTargetMax > 0 ? `${monthTargetMin}–${monthTargetMax} ק״ג` : "ללא ירידה"}</span>
                  <span style={{ color: monthStat.statusColor, fontWeight: 700, fontSize: 11 }}>{monthStat.status}</span>
                </div>
                <div style={{ position: "relative", height: 10, background: "#1a3a1f", borderRadius: 5, marginBottom: 8 }}>
                  <div style={{ position: "absolute", top: 0, right: 0, height: "100%", width: monthStat.pctOfMax + "%", borderRadius: 5, background: "linear-gradient(90deg,#fbbf24,#4ade80)", transition: "width 0.5s" }} />
                  {monthTargetMax > 0 && [monthTargetMin, monthTargetMax].map(t => (
                    <div key={t} style={{ position: "absolute", top: -3, right: (t/monthTargetMax*100) + "%", width: 2, height: 16, background: "#4a7a54", borderRadius: 1 }} />
                  ))}
                </div>
                {cutFrac < 1 && (
                  <div style={{ fontSize: 10, color: "#a78bfa", marginBottom: 6 }}>מותאם לתקופות: {monthCutDays} ימי חיטוב מתוך {daysInMonth}</div>
                )}
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#4a7a54" }}>
                  <span>ירדת החודש: <span style={{ color: "#e0f0e0", fontWeight: 700 }}>{monthStat.monthLost} ק״ג</span></span>
                  <span>תחזית: <span style={{ color: "#60a5fa", fontWeight: 700 }}>{monthStat.projected} ק״ג</span></span>
                  <span>{monthStat.daysRemaining} ימים נותרו</span>
                </div>
              </div>
            ) : <div style={{ fontSize: 11, color: "#4a7a54" }}>צריך לפחות שתי שקילות כדי לחשב את החודש</div>}
          </Section>

          <Section id="history" title="📋 היסטוריה">
            <MeasurementCard part="history" entries={entries} valueField="kg" unit="ק״ג" historyLabel="⚖️ שקילות" />
            <MeasurementCard part="history" entries={waistEntries} valueField="cm" unit="ס״מ" historyLabel="📏 היקף בטן" />
            <MeasurementCard part="history" entries={neckEntries} valueField="cm" unit="ס״מ" historyLabel="📏 היקף צוואר" />
          </Section>
        </div>
      );
    }

    // ─── PlanTab ─────────────────────────────────────────────────────────────────
    let GEMINI_API_KEY = "";

    const getWeekDays = (offset = 0) => {
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i - offset * 7);
        days.push({ dateStr: toDateStr(d), dayName: DAY_NAMES[d.getDay()], display: d.toLocaleDateString("he-IL", { day: "2-digit", month: "2-digit" }) });
      }
      return days;
    };

    const getShiftWeekDates = (offset = 0) => {
      const today = new Date();
      const sunday = new Date(today);
      sunday.setDate(today.getDate() - today.getDay() + offset * 7);
      return Array.from({length: 7}, (_, i) => {
        const d = new Date(sunday);
        d.setDate(sunday.getDate() + i);
        return toDateStr(d);
      });
    };
    const SHIFT_ICONS  = { morning: "☀️", evening: "🌙", off: "🏠" };
    const SHIFT_COLORS = { morning: "#fbbf24", evening: "#818cf8", off: "#4a7a54" };

    function PlanTab({ geminiReady }) {
      const [now, setNow] = useState(new Date());
      useEffect(() => { const t = setInterval(() => setNow(new Date()), 60000); return () => clearInterval(t); }, []);

      const todayStr = toDateStr(now);
      const [weekOffset, setWeekOffset] = useState(0);
      const days = getWeekDays(weekOffset);
      const [activeDateStr, setActiveDateStr] = useState(todayStr);
      const [open, setOpen] = useState(null);
      const [checked, setChecked, checkedErr] = usePersist("plan_checked_v3", {});
      const [customMeals, setCustomMeals, customMealsErr] = usePersist("custom_meals_v1", {});
      const [altMeals, setAltMeals, altMealsErr] = usePersist("alt_meals_v1", {});
      const [eatTypes, setEatTypes, eatTypesErr] = usePersist("day_eat_type_v1", {});
      const [actTypes, setActTypes, actTypesErr] = usePersist("day_act_type_v1", {});
      const [menuOverrides, setMenuOverrides, menuOverridesErr] = usePersist("menu_override_v1", {});
      const MEALS = DEFAULT_MEALS.map(m => ({ ...m, ...(menuOverrides[m.id] || {}) }));
      const PLAN_CAL = MEALS.reduce((s, m) => s + m.cal, 0);
      const PLAN_PRO = MEALS.reduce((s, m) => s + m.pro, 0);
      const [permForm, setPermForm] = useState({ name: "", time: "", emoji: "", cal: "", pro: "", items: "", tip: "" });
      const [weightEntriesRaw, , weightEntriesErr] = usePersist("weight_entries", [{ week: 0, kg: START_W, label: "התחלה" }]);
      const [waistRaw, , waistErr] = usePersist("waist_entries", []);
      const [neckRaw, , neckErr] = usePersist("neck_entries", []);
      const [altForm, setAltForm] = useState({ name: "", cal: "", protein: "" });
      const [editingMeal, setEditingMeal] = useState(null);
      const [editScope, setEditScope] = useState("today");
      const [editInput, setEditInput] = useState("");
      const [editMode, setEditMode] = useState("auto");
      const [manualCal, setManualCal] = useState("");
      const [aiLoading, setAiLoading] = useState(false);
      const [aiError, setAiError] = useState("");
      const [aiBreakdown, setAiBreakdown] = useState(null);
      const [aiQuestions, setAiQuestions] = useState(null);
      const [aiAnswers, setAiAnswers] = useState("");
      const [itemChecks, setItemChecks] = useState({});
      const [itemAmounts, setItemAmounts] = useState({});
      const [extraItems, setExtraItems] = useState([]);
      const [newExtraItem, setNewExtraItem] = useState("");
      const [itemsCal, setItemsCal] = useState("");

      const wEntries = asArray(weightEntriesRaw);
      const curKg = wEntries[wEntries.length - 1].kg;
      const wa = asArray(waistRaw), ne = asArray(neckRaw);
      const bodyFat = calcBodyFat(wa.length ? wa[wa.length-1].cm : null, ne.length ? ne[ne.length-1].cm : null);
      const bmr = calcBMR(curKg, bodyFat, now);

      const isViewingToday = activeDateStr === todayStr;
      const activeMealId = isViewingToday ? getActiveMealId(now) : null;

      const getCustom = (mealId) => customMeals[activeDateStr]?.[mealId] || null;
      const getActualCal = (meal) => getCustom(meal.id)?.calories ?? meal.cal;

      const totalCal = MEALS.reduce((s, m) => s + getActualCal(m), 0);
      const doneMeals = MEALS.filter(m => checked[activeDateStr + "-" + m.id] || getCustom(m.id));
      const doneCal  = doneMeals.reduce((s, m) => s + getActualCal(m), 0);
      const doneCount = doneMeals.length;
      const pct = Math.min((doneCal / totalCal) * 100, 100);
      const toggle = id => setChecked(p => ({ ...p, [activeDateStr + "-" + id]: !p[activeDateStr + "-" + id] }));

      // התג משמש רק אם לא נרשמו ארוחות בפועל
      const eatTag = eatTypes[activeDateStr] || "plan";
      const actTag = actTypes[activeDateStr] || "rest";
      const eatObj = EAT_TYPES.find(e => e.key === eatTag) || EAT_TYPES[0];
      const actObj = ACT_TYPES.find(a => a.key === actTag) || ACT_TYPES[0];
      const estimatedCal = doneCount > 0 ? doneCal : (eatObj.cal ?? PLAN_CAL);
      const estimatedTDEE = Math.round(bmr * actObj.mult);
      const balance = estimatedTDEE - estimatedCal;

      const setEat = k => setEatTypes(p => ({ ...p, [activeDateStr]: k }));
      const setAct = k => setActTypes(p => ({ ...p, [activeDateStr]: k }));

      const callGemini = async (prompt) => {
        if (!GEMINI_API_KEY) throw new Error(geminiReady ? "תכונת ה-AI לא מוגדרת (חסר מפתח)" : "מפתח ה-AI עדיין נטען, נסה שוב בעוד רגע");
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
        const errMsg = data?.error?.message || "";
        if (!text && errMsg) throw new Error(errMsg);
        const jsonMatch = text.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error("תגובה לא תקינה מה-AI");
        return JSON.parse(jsonMatch[0]);
      };

      const analyzeNutrition = async (mealId) => {
        if (!editInput.trim()) return;
        setAiLoading(true); setAiError(""); setAiBreakdown(null); setAiQuestions(null);
        try {
          const prompt = `You are a nutrition expert. The user described a meal: "${editInput.trim()}"

If the description is vague and asking 1-2 short clarifying questions would significantly improve accuracy (e.g. drink size, side dish, sauce), return:
{"questions":["question in the same language as the input"]}

Otherwise, estimate calories per item and return:
{"items":[{"name":"item name in the original language","calories":123}],"total":456}

Return ONLY valid JSON, no markdown, no extra text.`;
          const parsed = await callGemini(prompt);
          if (parsed.questions && parsed.questions.length > 0) setAiQuestions({ questions: parsed.questions, mealId });
          else if (parsed.total) setAiBreakdown({ items: parsed.items || [], total: parsed.total, mealId });
          else setAiError("לא הצלחתי לחשב. נסה לתאר בצורה יותר ברורה.");
        } catch(e) { setAiError(`שגיאה: ${e.message}`); }
        setAiLoading(false);
      };

      const submitAnswers = async () => {
        if (!aiQuestions) return;
        setAiLoading(true); setAiError(""); setAiQuestions(null);
        try {
          const prompt = `You are a nutrition expert. Estimate calories for this meal.
Original description: "${editInput.trim()}"
Additional details from user: "${aiAnswers}"

Return ONLY valid JSON, no markdown:
{"items":[{"name":"item name in the original language","calories":123}],"total":456}`;
          const parsed = await callGemini(prompt);
          if (parsed.total) setAiBreakdown({ items: parsed.items || [], total: parsed.total, mealId: aiQuestions.mealId });
          else setAiError("לא הצלחתי לחשב. נסה שוב.");
        } catch(e) { setAiError(`שגיאה: ${e.message}`); }
        setAiAnswers(""); setAiLoading(false);
      };

      const confirmBreakdown = () => {
        if (!aiBreakdown) return;
        const desc = editInput.trim();
        setCustomMeals(prev => ({ ...prev, [activeDateStr]: { ...(prev[activeDateStr] || {}), [aiBreakdown.mealId]: { description: desc, calories: aiBreakdown.total } } }));
        rememberAltMeal(aiBreakdown.mealId, desc, aiBreakdown.total);
        setEditingMeal(null); setEditInput(""); setAiBreakdown(null); setAiError(""); setAiQuestions(null); setAiAnswers("");
      };

      const saveManual = (mealId) => {
        const calories = parseInt(manualCal);
        if (!calories || calories < 1) return;
        const desc = editInput.trim() || "ארוחה מותאמת";
        setCustomMeals(prev => ({ ...prev, [activeDateStr]: { ...(prev[activeDateStr] || {}), [mealId]: { description: desc, calories } } }));
        rememberAltMeal(mealId, desc, calories);
        setEditingMeal(null); setEditInput(""); setManualCal(""); setAiError("");
      };

      const saveItemsLog = (mealId) => {
        const calories = parseInt(itemsCal);
        if (!calories || calories < 1) return;
        const kept = (MEALS.find(m => m.id === mealId)?.items || [])
          .map((_, i) => (itemChecks[i] ? (itemAmounts[i] || "").trim() : null))
          .filter(Boolean);
        const desc = [...kept, ...extraItems].join(", ") || "ארוחה מותאמת";
        setCustomMeals(prev => ({ ...prev, [activeDateStr]: { ...(prev[activeDateStr] || {}), [mealId]: { description: desc, calories } } }));
        rememberAltMeal(mealId, desc, calories);
        setEditingMeal(null); setItemsCal("");
      };

      const parseCalRange = (str) => {
        const nums = (str.match(/\d+(\.\d+)?/g) || []).map(Number);
        if (nums.length === 0) return null;
        return { calMin: Math.min(...nums), calMax: Math.max(...nums) };
      };

      const addAltMeal = (mealId) => {
        const name = altForm.name.trim();
        const range = parseCalRange(altForm.cal);
        if (!name || !range) return;
        setAltMeals(prev => ({ ...prev, [mealId]: [...(prev[mealId] || []), { name, calMin: range.calMin, calMax: range.calMax, protein: altForm.protein.trim() }] }));
        setAltForm({ name: "", cal: "", protein: "" });
      };

      const rememberAltMeal = (mealId, description, calories) => {
        const name = description.trim();
        if (!name) return;
        setAltMeals(prev => {
          const list = prev[mealId] || [];
          if (list.some(a => a.name.trim().toLowerCase() === name.toLowerCase())) return prev;
          return { ...prev, [mealId]: [...list, { name, calMin: calories, calMax: calories, protein: "" }] };
        });
      };

      const deleteAltMeal = (mealId, idx, alt) => {
        setAltMeals(prev => ({ ...prev, [mealId]: (prev[mealId] || []).filter((_, i) => i !== idx) }));
        const custom = getCustom(mealId);
        if (custom && alt && custom.description === alt.name) clearCustom(mealId);
      };

      const pickAltMeal = (mealId, alt) => {
        const calories = Math.round((alt.calMin + alt.calMax) / 2);
        setCustomMeals(prev => ({ ...prev, [activeDateStr]: { ...(prev[activeDateStr] || {}), [mealId]: { description: alt.name, calories } } }));
        setEditingMeal(null); setEditInput(""); setManualCal(""); setAiError("");
      };

      const clearCustom = (mealId) => {
        setCustomMeals(prev => {
          const d = { ...(prev[activeDateStr] || {}) };
          delete d[mealId];
          return { ...prev, [activeDateStr]: d };
        });
      };

      const savePermanent = (mealId) => {
        const cal = parseInt(permForm.cal), pro = parseInt(permForm.pro);
        const items = permForm.items.split("\n").map(s => s.trim()).filter(Boolean);
        if (!permForm.name.trim() || !cal || cal < 1 || !pro || pro < 0 || items.length === 0) return;
        setMenuOverrides(prev => ({ ...prev, [mealId]: {
          name: permForm.name.trim(), time: permForm.time.trim(), emoji: permForm.emoji.trim() || "🍽️",
          cal, pro, items, tip: permForm.tip.trim()
        } }));
        setEditingMeal(null);
      };

      const resetPermanent = (mealId) => {
        setMenuOverrides(prev => {
          const n = { ...prev };
          delete n[mealId];
          return n;
        });
      };

      const activeDay = days.find(d => d.dateStr === activeDateStr) || { dayName: "", display: activeDateStr };

      const dataError = checkedErr || customMealsErr || altMealsErr || eatTypesErr || actTypesErr || menuOverridesErr || weightEntriesErr || waistErr || neckErr;
      if (dataError) return <DataError message={dataError} />;

      return (
        <>
          <div style={{ padding: "10px 14px 0" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
              <button onClick={() => { setWeekOffset(w => w + 1); setOpen(null); }} style={{ background: "#0d1f10", border: "1px solid #1a3a1f", borderRadius: 6, color: "#4a7a54", fontSize: 14, cursor: "pointer", padding: "2px 8px", fontFamily: "inherit" }}>‹</button>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 3, flex: 1 }}>
                {days.map(day => {
                  const dayDone = MEALS.filter(m => checked[day.dateStr + "-" + m.id] || customMeals[day.dateStr]?.[m.id]).length;
                  const isActive = day.dateStr === activeDateStr;
                  const isToday = day.dateStr === todayStr;
                  const tag = eatTypes[day.dateStr];
                  const tagObj = tag ? EAT_TYPES.find(e => e.key === tag) : null;
                  return (
                    <button key={day.dateStr} onClick={() => { setActiveDateStr(day.dateStr); setOpen(null); }} style={{
                      background: isActive ? "#166534" : "#0d1f10", border: isToday ? "1px solid #4ade80" : "1px solid #1a3a1f",
                      borderRadius: 8, padding: "6px 2px", cursor: "pointer", textAlign: "center", transition: "all 0.2s",
                    }}>
                      <div style={{ fontSize: 9, color: isActive ? "#4ade80" : "#4a7a54", fontWeight: isToday ? 700 : 400 }}>{day.dayName.slice(0,3)}</div>
                      <div style={{ fontSize: 9, color: isActive ? "#a8d8a8" : "#3a5a3a", marginTop: 1 }}>{day.display}</div>
                      <div style={{ fontSize: 11, fontWeight: 700, color: dayDone === MEALS.length ? "#4ade80" : isActive ? "#e0f0e0" : "#4a7a54", marginTop: 2 }}>
                        {dayDone === MEALS.length ? "✓" : dayDone > 0 ? dayDone + "/" + MEALS.length : "—"}
                      </div>
                      <div style={{ fontSize: 7, marginTop: 1, minHeight: 9, color: tagObj ? tagObj.color : "transparent" }}>{tagObj && tagObj.key !== "plan" ? "●" : ""}</div>
                    </button>
                  );
                })}
              </div>
              {weekOffset > 0 && <button onClick={() => { setWeekOffset(w => w - 1); setOpen(null); }} style={{ background: "#0d1f10", border: "1px solid #1a3a1f", borderRadius: 6, color: "#4a7a54", fontSize: 14, cursor: "pointer", padding: "2px 8px", fontFamily: "inherit" }}>›</button>}
              {weekOffset === 0 && <div style={{ width: 28 }} />}
            </div>

            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6, marginTop: 8 }}>
              <span style={{ fontSize: 13, fontWeight: 700, color: "#4ade80" }}>🍽️ {activeDay.dayName} {activeDay.display}</span>
              <span style={{ fontSize: 11, color: "#4a7a54" }}>{doneCount}/{MEALS.length} · {doneCal} קל׳</span>
            </div>
            <div style={{ height: 5, background: "#1a3a1f", borderRadius: 3, overflow: "hidden", marginBottom: 10 }}>
              <div style={{ height: "100%", width: pct + "%", borderRadius: 3, background: "linear-gradient(90deg,#166534,#4ade80)", transition: "width 0.4s" }} />
            </div>

            {/* ── תיוג יום ── */}
            <div style={{ background: "#0d1f10", borderRadius: 12, border: "1px solid #1a3a1f", padding: 12, marginBottom: 10 }}>
              <div style={{ fontSize: 10, color: "#4a7a54", marginBottom: 6 }}>איך אכלת היום?</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 5, marginBottom: 10 }}>
                {EAT_TYPES.map(e => {
                  const on = e.key === eatTag;
                  return (
                    <button key={e.key} onClick={() => setEat(e.key)} style={{
                      padding: "9px 3px", borderRadius: 8, border: `1px solid ${on ? e.color : "#1a3a1f"}`,
                      background: on ? e.color + "22" : "#0b1a0d", color: on ? e.color : "#4a7a54",
                      fontSize: 11, fontWeight: 700, fontFamily: "inherit", cursor: "pointer", transition: "all 0.15s",
                    }}>{e.label}</button>
                  );
                })}
              </div>
              <div style={{ fontSize: 10, color: "#4a7a54", marginBottom: 6 }}>מה עשית היום?</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 5, marginBottom: 10 }}>
                {ACT_TYPES.map(a => {
                  const on = a.key === actTag;
                  return (
                    <button key={a.key} onClick={() => setAct(a.key)} style={{
                      padding: "9px 2px", borderRadius: 8, border: `1px solid ${on ? a.color : "#1a3a1f"}`,
                      background: on ? a.color + "22" : "#0b1a0d", color: on ? a.color : "#4a7a54",
                      fontSize: 10, fontWeight: 700, fontFamily: "inherit", cursor: "pointer", transition: "all 0.15s",
                    }}>{a.label}</button>
                  );
                })}
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#0b1a0d", borderRadius: 8, padding: "9px 12px", marginBottom: 5 }}>
                <span style={{ fontSize: 11, color: "#4a7a54" }}>{doneCount > 0 ? `נאכל בפועל (${doneCount}/${MEALS.length})` : "הערכת אכילה"}</span>
                <span style={{ fontSize: 13, fontWeight: 700, color: "#e0f0e0", fontFamily: "monospace" }}>{estimatedCal.toLocaleString()} קל׳</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#0b1a0d", borderRadius: 8, padding: "9px 12px", marginBottom: 5 }}>
                <span style={{ fontSize: 11, color: "#4a7a54" }}>הוצאה משוערת</span>
                <span style={{ fontSize: 13, fontWeight: 700, color: "#60a5fa", fontFamily: "monospace" }}>{estimatedTDEE.toLocaleString()} קל׳</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: balance > 0 ? "#0d2e18" : "#2e0d0d", border: `1px solid ${balance > 0 ? "#1e4a2e" : "#4a1e1e"}`, borderRadius: 8, padding: "10px 12px" }}>
                <span style={{ fontSize: 12, color: balance > 0 ? "#4ade80" : "#f87171", fontWeight: 700 }}>{balance > 0 ? "גירעון" : "עודף"}</span>
                <span style={{ fontSize: 15, fontWeight: 700, color: balance > 0 ? "#4ade80" : "#f87171", fontFamily: "monospace" }}>{balance > 0 ? "▼" : "▲"} {Math.abs(balance).toLocaleString()} קל׳</span>
              </div>
              {balance > 900 && <div style={{ fontSize: 10, color: "#fbbf24", marginTop: 7 }}>⚠️ גירעון מעל 900 קל׳ — שים לב לשמירת מסת שריר</div>}
              {balance < 0 && <div style={{ fontSize: 10, color: "#fbbf24", marginTop: 7 }}>⚠️ יום בעודף — מאזן מול שאר השבוע</div>}
              {doneCount > 0 && <div style={{ fontSize: 9, color: "#2d5a3a", marginTop: 7 }}>הרישום בפועל גובר על התג</div>}
            </div>
          </div>

          <div style={{ padding: "0 14px 0" }}>
            {MEALS.map(meal => {
              const isOpen = open === activeDateStr + "-" + meal.id;
              const isDone = !!checked[activeDateStr + "-" + meal.id];
              const custom = getCustom(meal.id);
              const isEditing = editingMeal === meal.id;
              const isCurrent = meal.id === activeMealId && !isDone && !custom;
              const isPermCustom = !!menuOverrides[meal.id];
              const ac = EC[meal.emoji] || "#4ade80";
              const actualCal = getActualCal(meal);
              const borderColor = isOpen ? ac + "66" : isCurrent ? ac : (isDone || custom) ? "#1a5a2e" : "#1a3a1f";
              return (
                <div key={meal.id} style={{ marginBottom: 8, borderRadius: 12, border: "1px solid " + borderColor, overflow: "hidden", opacity: (isDone && !custom) ? 0.65 : 1, transition: "all 0.2s", boxShadow: isCurrent ? "0 0 10px " + ac + "44" : "none" }}>
                  <div style={{ background: isOpen ? ac + "14" : isCurrent ? ac + "18" : (isDone || custom) ? "#0a2010" : "#0d1f10", padding: "12px 14px", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between" }}
                    onClick={() => setOpen(isOpen ? null : activeDateStr + "-" + meal.id)}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <div onClick={e => { e.stopPropagation(); toggle(meal.id); }}
                        style={{ width: 22, height: 22, borderRadius: 6, flexShrink: 0, border: "2px solid " + ((isDone || custom) ? ac : "#2d5a3a"), background: (isDone || custom) ? ac + "33" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", fontSize: 13, color: ac, fontWeight: 700 }}>
                        {(isDone || custom) ? "✓" : ""}
                      </div>
                      <span style={{ fontSize: 20 }}>{meal.emoji}</span>
                      <div>
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                          <span style={{ fontSize: 14, fontWeight: 600, color: (isDone && !custom) ? "#4a7a54" : "#e0f0e0" }}>{custom ? custom.description : meal.name}</span>
                          {isCurrent && <span style={{ fontSize: 9, background: ac + "33", color: ac, borderRadius: 4, padding: "1px 5px", fontWeight: 700 }}>עכשיו</span>}
                          {custom && <span style={{ fontSize: 9, background: "#1e4a2e", color: "#4ade80", borderRadius: 4, padding: "1px 5px", fontWeight: 700 }}>מותאם</span>}
                          {!custom && isPermCustom && <span style={{ fontSize: 9, background: "#1e3a5a", color: "#60a5fa", borderRadius: 4, padding: "1px 5px", fontWeight: 700 }}>מותאם קבוע</span>}
                        </div>
                        <div style={{ fontSize: 11, color: "#4a7a54" }}>{meal.time}</div>
                      </div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <button onClick={e => { e.stopPropagation(); setEditingMeal(isEditing ? null : meal.id); setEditScope("today"); setEditInput(custom?.description || ""); setManualCal(""); setEditMode("auto"); setAiError(""); setAiBreakdown(null); setAiQuestions(null); setAiAnswers(""); }}
                        style={{ background: "transparent", border: "none", cursor: "pointer", fontSize: 14, color: custom ? "#4ade80" : isPermCustom ? "#60a5fa" : "#2d5a3a", padding: "2px 4px" }}>✏️</button>
                      <div style={{ textAlign: "center" }}>
                        <div style={{ fontSize: 16, fontWeight: 700, color: custom ? "#4ade80" : ac, fontFamily: "monospace" }}>{actualCal}</div>
                        <div style={{ fontSize: 9, color: "#4a7a54" }}>קל׳</div>
                      </div>

      const todayIdx = new Date().getDay();
      const [activeDay, setActiveDay] = useState(todayIdx < 7 ? todayIdx : 0);

      const activeDateStr = shiftWeekDates[activeDay];
      const activeShift = shifts[activeDateStr] || null;
      const dow = new Date(activeDateStr + "T12:00:00").getDay();

      const dayPlan = WEEK_PLAN[activeDay];
      const doneTasks = dayPlan.tasks.filter(t => checked[activeDateStr + "-" + t.id]).length;
      const totalTasks = dayPlan.tasks.length;
      const pctTasks = Math.round((doneTasks / totalTasks) * 100);
      const toggleTask = (id) => setChecked(p => {
        const key = activeDateStr + "-" + id;
        if (p[key]) return { ...p, [key]: null };
        const now = new Date();
        const ts = now.toLocaleDateString("he-IL", { day: "2-digit", month: "2-digit" }) + " " +
          now.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
        return { ...p, [key]: ts };
      });

      const walkDays = [0, 2, 4];
      const weekLabel = shiftOffset === 0 ? "שבוע זה" : shiftOffset === 1 ? "שבוע הבא" : shiftOffset === -1 ? "שבוע שעבר" : (shiftOffset > 0 ? "+" : "") + shiftOffset + " שבועות";

      const [imgLoading, setImgLoading] = useState(false);
      const [imgMsg, setImgMsg] = useState("");

      const readShiftImage = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setImgLoading(true); setImgMsg("");
        try {
          if (!GEMINI_API_KEY) throw new Error(geminiReady ? "תכונת ה-AI לא מוגדרת (חסר מפתח)" : "מפתח ה-AI עדיין נטען, נסה שוב בעוד רגע");
          const base64 = await new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(r.result.split(",")[1]);
            r.onerror = rej;
            r.readAsDataURL(file);
          });
          const prompt = `This is a Hebrew work schedule table. Columns are days with dates in DD.MM format at the top (e.g. "21.06"). Rows split into בוקר (morning) and ערב (evening) sections. Each cell has worker names.
Find every date where "מתן" appears and which section.
Return ONLY valid JSON, no extra text:
{"21.06":"morning","22.06":"evening"}
Use exact DD.MM keys from the image. Skip dates where מתן doesn't appear.`;
          const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [
              { inlineData: { mimeType: file.type || "image/jpeg", data: base64 } },
              { text: prompt }
            ]}]})
          });
          const data = await resp.json();
          const text = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
          const errMsg = data?.error?.message || "";
          if (!text && errMsg) throw new Error(errMsg);
          const match = text.match(/\{[\s\S]*\}/);
          if (!match) throw new Error("לא זיהיתי סידור בתמונה");
          const parsed = JSON.parse(match[0]);
          const yr = new Date().getFullYear();
          const newShifts = {};
          for (const [k, v] of Object.entries(parsed)) {
            const parts = k.split(".");
            if (parts.length === 2 && (v === "morning" || v === "evening")) {
              newShifts[`${yr}-${parts[1].padStart(2,"0")}-${parts[0].padStart(2,"0")}`] = v;
            }
          }
          if (!Object.keys(newShifts).length) throw new Error("לא נמצאו משמרות למתן");
          setShifts(p => ({ ...p, ...newShifts }));
          setImgMsg(`✅ זוהו ${Object.keys(newShifts).length} משמרות`);
        } catch(err) { setImgMsg("❌ " + err.message); }
        setImgLoading(false);
        e.target.value = "";
      };

      const selectedTypes = dayTypes[activeDateStr] || [];
      const toggleType = (key) => setDayTypes(p => {
        const cur = p[activeDateStr] || [];

      const allExercises = activeExSections.flatMap(s => s.exercises);
      const doneEx = allExercises.filter(e => !!exChecked[activeDateStr + "-" + e.id]).length;
      const totalEx = allExercises.length;

              return (

              <div style={{ fontSize: 11, color: "#4a7a54", fontWeight: 700 }}>
                {dayPlan.day} — {activeDateStr.slice(8,10)}/{activeDateStr.slice(5,7)}
                {walkDays.includes(activeDay) && <span style={{ color: "#60a5fa", marginRight: 8 }}>🚶 יום הליכה</span>}
                {activeDay === 5 && <span style={{ color: "#fbbf24", marginRight: 8 }}>🍕 יום חופשי</span>}

    // ─── AdminPanel ───────────────────────────────────────────────────────────────
    function AdminPanel({ onBack }) {
      const [users, setUsers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [newMatanPin, setNewMatanPin] = useState("");
      const [newAdminPin, setNewAdminPin] = useState("");
      const [newGeminiKey, setNewGeminiKey] = useState("");
      const [saved, setSaved] = useState("");
      const [newUsername, setNewUsername] = useState("");
      const [newUserPin, setNewUserPin] = useState("");
      const [managedUsers, setManagedUsers] = useState(null);
      const [confirmAction, setConfirmAction] = useState(null);
      const [copyFrom, setCopyFrom] = useState("");
      const [copyTo, setCopyTo] = useState("");
      const [exportUser, setExportUser] = useState("");
      const [importUser, setImportUser] = useState("");
      const [error, setError] = useState(null);
      const importFileRef = React.useRef(null);

      useEffect(() => {
        db.ref(`${DB_ROOT}/_admin/users`).once("value", snap => {
          setManagedUsers(snap.exists() ? snap.val() : { matan: { pin: null }, guest: { pin: null } });
        }, err => {
          console.error("[Firebase] read failed for _admin/users:", err);
          setError(err.message);
        });
      }, []);

      useEffect(() => {
        if (!managedUsers) return;
        db.ref(DB_ROOT).once("value", snap => {
          const data = snap.val() || {};
          const userList = Object.keys(managedUsers).map(username => {
            const udata = data[username] || {};
            const weightEntries = udata.weight_entries ? asArray(udata.weight_entries) : [];
            const lastEntry = weightEntries.length > 0 ? weightEntries[weightEntries.length - 1] : null;
            return { username, weightCount: weightEntries.length, lastWeight: lastEntry ? lastEntry.kg + " ק״ג" : "—", lastDate: lastEntry ? (lastEntry.date || lastEntry.label || "—") : "—" };
          });
          setUsers(userList);
          setLoading(false);
        }, err => {
          console.error(`[Firebase] read failed for ${DB_ROOT}:`, err);
          setError(err.message);
        });
      }, [managedUsers]);

      const savePin = async (type) => {
        const val = type === "matan" ? newMatanPin : newAdminPin;
        if (val.length !== 4 || isNaN(val)) return;
        try {
          await db.ref(type === "matan" ? `${DB_ROOT}/_admin/matanPin` : `${DB_ROOT}/_admin/adminPin`).set(val);
          setSaved(type === "matan" ? "PIN של מתן עודכן ✓" : "PIN מנהל עודכן ✓");
          setTimeout(() => setSaved(""), 2500);
          if (type === "matan") setNewMatanPin(""); else setNewAdminPin("");
        } catch (err) {
          console.error("[Firebase] savePin failed:", err);
          alert("שמירת ה-PIN נכשלה: " + err.message);
        }
      };

      const requireAdminPin = (label, action) => setConfirmAction({ label, onConfirm: () => { setConfirmAction(null); action(); } });

      const addUser = async () => {
        const uname = newUsername.trim().toLowerCase().replace(/\s+/g,"_");
        if (!uname) return;
        const entry = { createdAt: Date.now() };
        if (newUserPin.length === 4) entry.pin = newUserPin;
        const updated = { ...(managedUsers || {}), [uname]: entry };
        try {
          await db.ref(`${DB_ROOT}/_admin/users`).set(updated);
          setManagedUsers(updated);
          setNewUsername(""); setNewUserPin("");
          setSaved(`משתמש "${uname}" נוסף ✓`);
          setTimeout(() => setSaved(""), 2500);
        } catch (err) {
          console.error("[Firebase] addUser failed:", err);
          alert("הוספת המשתמש נכשלה: " + err.message);
        }
      };

      const deleteUser = async (uname) => {
        const updated = { ...(managedUsers || {}) };
        delete updated[uname];
        try {
          await db.ref(`${DB_ROOT}/_admin/users`).set(updated);
          setManagedUsers(updated);
          setSaved(`משתמש "${uname}" נמחק ✓`);
          setTimeout(() => setSaved(""), 2500);
        } catch (err) {
          console.error("[Firebase] deleteUser failed:", err);
          alert("מחיקת המשתמש נכשלה: " + err.message);
        }
      };

      const exportBackup = async () => {
        const path = exportUser ? DB_ROOT + "/" + exportUser : DB_ROOT;
        try {
          const snap = await db.ref(path).once("value");
          const blob = new Blob([JSON.stringify(snap.val() || {}, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `nutrition-backup-${exportUser || "all"}-${toDateStr(new Date())}.json`;
          a.click();
          URL.revokeObjectURL(url);
        } catch (err) {
          console.error("[Firebase] exportBackup failed:", err);
          alert("ייצוא הגיבוי נכשל: " + err.message);
        }
      };

      const handleImportFile = (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          let parsed;
          try { parsed = JSON.parse(reader.result); }
          catch (err) { setSaved("קובץ לא תקין ✗"); setTimeout(() => setSaved(""), 2500); return; }
          const path = importUser ? DB_ROOT + "/" + importUser : DB_ROOT;
          const whoLabel = importUser ? `של "${importUser}"` : "של כל המשתמשים";
          requireAdminPin(`לשחזר גיבוי ${whoLabel}? זה ידרוס את הנתונים הקיימים ${whoLabel}!`, async () => {
            try {
              await db.ref(path).set(parsed);
              setSaved("הגיבוי שוחזר ✓");
              setTimeout(() => setSaved(""), 2500);
            } catch (err) {
              console.error("[Firebase] restore backup failed:", err);
              alert("שחזור הגיבוי נכשל: " + err.message);
            }
          });
        };
        reader.readAsText(file);
      };

      const copyUserData = () => {
        if (!copyFrom || !copyTo || copyFrom === copyTo) return;
        requireAdminPin(`להעתיק את נתוני "${copyFrom}" אל "${copyTo}"? זה ידרוס את הנתונים הקיימים של "${copyTo}"!`, async () => {
          try {
            const snap = await db.ref(DB_ROOT + "/" + copyFrom).once("value");
            await db.ref(DB_ROOT + "/" + copyTo).set(snap.val() || {});
            setSaved(`נתוני "${copyFrom}" הועתקו אל "${copyTo}" ✓`);
            setTimeout(() => setSaved(""), 2500);
            setCopyFrom(""); setCopyTo("");
          } catch (err) {
            console.error("[Firebase] copyUserData failed:", err);
            alert("העתקת הנתונים נכשלה: " + err.message);
          }
        });
      };

      // ניקוי שרידים מגרסאות ישנות: plan_checked (בלי v3), workout_type_v1,
      // ורשומות checklist עם מפתח מספרי במקום תאריך.
      const cleanLegacy = () => {
        requireAdminPin("למחוק נתוני שאריות מגרסאות ישנות? (plan_checked, workout_type_v1, מפתחות ישנים בצ׳קליסט)", async () => {
          try {
            const targets = users.map(u => u.username);
            let removed = 0;
            for (const u of targets) {
              const base = DB_ROOT + "/" + u;
              for (const k of ["plan_checked", "workout_type_v1"]) {
                const s = await db.ref(base + "/" + k).once("value");
                if (s.exists()) { await db.ref(base + "/" + k).remove(); removed++; }
              }
              const cs = await db.ref(base + "/checklist_checked").once("value");
              if (cs.exists()) {
                const obj = cs.val() || {};
                const cleaned = {};
                for (const [k, v] of Object.entries(obj)) {
                  if (/^\d{4}-\d{2}-\d{2}-/.test(k)) cleaned[k] = v; else removed++;
                }
                await db.ref(base + "/checklist_checked").set(cleaned);
              }
            }
            setSaved(`ניקוי הושלם — ${removed} רשומות הוסרו ✓`);
            setTimeout(() => setSaved(""), 3000);
          } catch (err) {
            console.error("[Firebase] cleanLegacy failed:", err);
            alert("ניקוי הנתונים נכשל: " + err.message);
          }
        });
      };

      const G = { bg: "#080f0a", card: "#0b1a0d", border: "#1a3a1f", text: "#e0f0e0", mid: "#4a7a54", green: "#4ade80", red: "#f87171" };

      if (error) return <DataError message={error} />;

      return (
        <div style={{ minHeight: "100vh", background: G.bg, fontFamily: "'Segoe UI',Tahoma,sans-serif", direction: "rtl", color: G.text, paddingBottom: 40 }}>
          {confirmAction && <AdminConfirmPin label={confirmAction.label} onConfirm={confirmAction.onConfirm} onCancel={() => setConfirmAction(null)} />}
          <div style={{ background: G.card, padding: "14px 18px", borderBottom: `1px solid ${G.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>

            <button onClick={onBack} style={{ background: "#1a3a1f", border: "none", borderRadius: 8, padding: "6px 14px", color: G.mid, fontSize: 13, cursor: "pointer", fontFamily: "inherit" }}>← יציאה</button>

            <div style={{ background: G.card, borderRadius: 14, padding: 16, marginBottom: 12, border: `1px solid ${G.border}` }}>

                <div key={u.username} style={{ background: G.bg, borderRadius: 10, padding: "12px 14px", marginBottom: 8, border: `1px solid ${G.border}` }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                    <div style={{ fontSize: 14, fontWeight: 700, color: G.green }}>👤 {u.username}</div>
                    <div style={{ fontSize: 11, color: G.mid }}>שקילה אחרונה: {u.lastDate}</div>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                    {[["שקילות", u.weightCount, G.green], ["משקל נוכחי", u.lastWeight, "#60a5fa"]].map(([l,v,c]) => (

                        <div style={{ fontSize: 10, color: G.mid }}>{l}</div>

                    ))}

                </div>
              ))}
            </div>

            <div style={{ background: G.card, borderRadius: 14, padding: 16, marginBottom: 12, border: `1px solid ${G.border}` }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: G.mid, marginBottom: 14 }}>➕ ניהול משתמשים</div>
              {managedUsers && Object.keys(managedUsers).map(uname => (
                <div key={uname} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: G.bg, borderRadius: 8, padding: "8px 12px", marginBottom: 6, border: `1px solid ${G.border}` }}>
                  <div style={{ fontSize: 13, color: G.green }}>👤 {uname}</div>
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <div style={{ fontSize: 11, color: G.mid }}>{managedUsers[uname].pin ? "🔒 PIN" : "🔓 ללא PIN"}</div>
                    {uname !== "matan" && (
                      <button onClick={() => requireAdminPin(`למחוק את המשתמש "${uname}"?`, () => deleteUser(uname))}

              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <input value={newUsername} onChange={e => setNewUsername(e.target.value)} placeholder="שם משתמש"

                <input value={newUserPin} onChange={e => setNewUserPin(e.target.value.replace(/\D/g,"").slice(0,4))} placeholder="PIN (אופציונלי)" maxLength={4} inputMode="numeric"
                  style={{ width: 110, background: G.bg, border: `1px solid ${G.border}`, borderRadius: 8, padding: "9px 12px", color: G.text, fontSize: 13, outline: "none", direction: "ltr", fontFamily: "inherit" }} />
              </div>
              <button onClick={addUser} disabled={!newUsername.trim()} style={{ background: newUsername.trim() ? "#166534" : "#1a3a1f", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fff", fontWeight: 700, fontSize: 13, cursor: newUsername.trim() ? "pointer" : "default", fontFamily: "inherit", width: "100%" }}>➕ הוסף משתמש</button>
            </div>

            <div style={{ background: G.card, borderRadius: 14, padding: 16, marginBottom: 12, border: `1px solid ${G.border}` }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: G.mid, marginBottom: 14 }}>💾 גיבוי וייבוא נתונים</div>

              <div style={{ fontSize: 10, color: G.mid, marginBottom: 4 }}>משתמש לייצוא</div>
              <select value={exportUser} onChange={e => setExportUser(e.target.value)}
                style={{ width: "100%", background: G.bg, border: `1px solid ${G.border}`, borderRadius: 8, padding: "9px 8px", color: G.text, fontSize: 12, outline: "none", fontFamily: "inherit", marginBottom: 8 }}>
                <option value="">כל המשתמשים</option>
                {managedUsers && Object.keys(managedUsers).map(u => <option key={u} value={u}>{u}</option>)}
              </select>
              <button onClick={exportBackup} style={{ background: "#166534", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fff", fontWeight: 700, fontSize: 13, cursor: "pointer", fontFamily: "inherit", width: "100%", marginBottom: 16 }}>📥 ייצוא {exportUser ? `נתוני "${exportUser}"` : "כל הנתונים"} (גיבוי)</button>

              <div style={{ fontSize: 10, color: G.mid, marginBottom: 4 }}>משתמש לייבוא</div>
              <select value={importUser} onChange={e => setImportUser(e.target.value)}

                <option value="">כל המשתמשים (שחזור מלא)</option>

              <input ref={importFileRef} type="file" accept=".json,application/json" onChange={handleImportFile} style={{ display: "none" }} />
              <button onClick={() => importFileRef.current?.click()} style={{ background: "#7f1d1d", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fca5a5", fontWeight: 700, fontSize: 13, cursor: "pointer", fontFamily: "inherit", width: "100%" }}>📤 שחזור {importUser ? `לתוך "${importUser}"` : "(ידרוס הכל)"}</button>
              <div style={{ fontSize: 11, color: G.mid, marginTop: 8, marginBottom: 16 }}>ייצוא של משתמש בודד מוריד רק את הנתונים שלו; ייבוא לתוך משתמש בודד דורש קובץ שיוצא לאותו משתמש. השחזור תמיד דורש אישור PIN מנהל ומחליף נתונים קיימים</div>

              <div style={{ borderTop: `1px solid ${G.border}`, paddingTop: 14 }}>
                <div style={{ fontSize: 12, color: G.mid, marginBottom: 8 }}>העתקת נתונים בין משתמשים:</div>
                <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 10, color: G.mid, marginBottom: 4 }}>מקור (העתק מ)</div>
                    <select value={copyFrom} onChange={e => setCopyFrom(e.target.value)}
                      style={{ width: "100%", background: G.bg, border: `1px solid ${G.border}`, borderRadius: 8, padding: "9px 8px", color: G.text, fontSize: 12, outline: "none", fontFamily: "inherit" }}>
                      <option value="">בחר...</option>
                      {managedUsers && Object.keys(managedUsers).map(u => <option key={u} value={u}>{u}</option>)}
                    </select>
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 10, color: G.mid, marginBottom: 4 }}>יעד (העתק אל)</div>
                    <select value={copyTo} onChange={e => setCopyTo(e.target.value)}
                      style={{ width: "100%", background: G.bg, border: `1px solid ${G.border}`, borderRadius: 8, padding: "9px 8px", color: G.text, fontSize: 12, outline: "none", fontFamily: "inherit" }}>
                      <option value="">בחר...</option>
                      {managedUsers && Object.keys(managedUsers).map(u => <option key={u} value={u}>{u}</option>)}
                    </select>
                  </div>
                </div>
                <button onClick={copyUserData} disabled={!copyFrom || !copyTo || copyFrom === copyTo}
                  style={{ background: (copyFrom && copyTo && copyFrom !== copyTo) ? "#166534" : "#1a3a1f", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fff", fontWeight: 700, fontSize: 13, cursor: (copyFrom && copyTo && copyFrom !== copyTo) ? "pointer" : "default", fontFamily: "inherit", width: "100%" }}>📋 העתק נתונים</button>
              </div>

              <div style={{ borderTop: `1px solid ${G.border}`, paddingTop: 14, marginTop: 14 }}>
                <button onClick={cleanLegacy} style={{ background: "#3a2a0a", border: "1px solid #5a4a1a", borderRadius: 8, padding: "9px 16px", color: "#fbbf24", fontWeight: 700, fontSize: 13, cursor: "pointer", fontFamily: "inherit", width: "100%" }}>🧹 נקה שאריות מגרסאות ישנות</button>
                <div style={{ fontSize: 11, color: G.mid, marginTop: 8 }}>מוחק את plan_checked הישן, workout_type_v1, ורשומות צ׳קליסט עם מפתח מספרי (לפני המעבר לתאריכים). לא נוגע בנתונים פעילים.</div>
              </div>
            </div>

            <div style={{ background: G.card, borderRadius: 14, padding: 16, marginBottom: 12, border: `1px solid ${G.border}` }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: G.mid, marginBottom: 12 }}>🔑 שנה PIN של Matan</div>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={newMatanPin} onChange={e => setNewMatanPin(e.target.value.replace(/\D/g,"").slice(0,4))}
                  placeholder="4 ספרות חדשות" maxLength={4} inputMode="numeric"
                  style={{ flex: 1, background: G.bg, border: `1px solid ${G.border}`, borderRadius: 8, padding: "9px 12px", color: G.text, fontSize: 14, outline: "none", direction: "ltr", fontFamily: "inherit" }} />
                <button onClick={() => savePin("matan")} disabled={newMatanPin.length !== 4} style={{ background: newMatanPin.length === 4 ? "#166534" : "#1a3a1f", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fff", fontWeight: 700, fontSize: 13, cursor: newMatanPin.length === 4 ? "pointer" : "default", fontFamily: "inherit" }}>שמור</button>
              </div>
            </div>

            <div style={{ background: G.card, borderRadius: 14, padding: 16, marginBottom: 12, border: `1px solid ${G.border}` }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: G.mid, marginBottom: 12 }}>🔧 שנה PIN מנהל</div>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={newAdminPin} onChange={e => setNewAdminPin(e.target.value.replace(/\D/g,"").slice(0,4))}
                  placeholder="4 ספרות חדשות" maxLength={4} inputMode="numeric"
                  style={{ flex: 1, background: G.bg, border: `1px solid ${G.border}`, borderRadius: 8, padding: "9px 12px", color: G.text, fontSize: 14, outline: "none", direction: "ltr", fontFamily: "inherit" }} />
                <button onClick={() => savePin("admin")} disabled={newAdminPin.length !== 4} style={{ background: newAdminPin.length === 4 ? "#166534" : "#1a3a1f", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fff", fontWeight: 700, fontSize: 13, cursor: newAdminPin.length === 4 ? "pointer" : "default", fontFamily: "inherit" }}>שמור</button>
              </div>
              <div style={{ fontSize: 11, color: G.mid, marginTop: 8 }}>PIN ברירת מחדל: 0000</div>
            </div>

            <div style={{ background: G.card, borderRadius: 14, padding: 16, border: `1px solid ${G.border}` }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: G.mid, marginBottom: 12 }}>🤖 מפתח Gemini AI</div>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={newGeminiKey} onChange={e => setNewGeminiKey(e.target.value.trim())}
                  placeholder="הדבק מפתח API חדש מ-Google AI Studio"
                  style={{ flex: 1, background: G.bg, border: `1px solid ${G.border}`, borderRadius: 8, padding: "9px 12px", color: G.text, fontSize: 12, outline: "none", direction: "ltr", fontFamily: "monospace" }} />
                <button onClick={async () => { if (!newGeminiKey) return; await db.ref(`${DB_ROOT}/_admin/geminiKey`).set(newGeminiKey); GEMINI_API_KEY = newGeminiKey; setSaved("gemini"); setNewGeminiKey(""); setTimeout(() => setSaved(""), 2000); }}
                  disabled={!newGeminiKey}
                  style={{ background: newGeminiKey ? "#166534" : "#1a3a1f", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fff", fontWeight: 700, fontSize: 13, cursor: newGeminiKey ? "pointer" : "default", fontFamily: "inherit" }}>
                  {saved === "gemini" ? "✓" : "שמור"}
                </button>
              </div>
              <div style={{ fontSize: 11, color: G.mid, marginTop: 8 }}>המפתח נשמר ב-Firebase ולא בקוד</div>
            </div>
          </div>
        </div>
      );
    }

    // ─── App ──────────────────────────────────────────────────────────────────────
    function NutritionApp() {
      const [tab, setTab] = useState("plan");
      const [activeUser, setActiveUser] = useState(localStorage.getItem("active_user") || null);
      const [adminMode, setAdminMode] = useState(false);
      const [adminAuthed, setAdminAuthed] = useState(false);
      const [liveVersion, setLiveVersion] = useState(null);
      const [authUser, setAuthUser] = useState(undefined);
      const [geminiReady, setGeminiReady] = useState(false);
      const [userChecked, setUserChecked] = useState(false);

      useEffect(() => {
        const unsubscribe = firebase.auth().onAuthStateChanged(u => setAuthUser(u));
        return unsubscribe;
      }, []);

      // The saved profile lives in localStorage with no link to the signed-in
      // account, so it can go stale (a leftover "guest" once loaded an empty
      // profile after sign-in and looked like data loss). Check it against
      // _admin/users before rendering; fall back to the first valid user.
      useEffect(() => {
        if (!authUser) { setUserChecked(false); return; }
        const stored = localStorage.getItem("active_user");
        if (!stored) { setUserChecked(true); return; }
        db.ref(`${DB_ROOT}/_admin/users`).once("value", snap => {
          // Same fallback list UserSelect shows when _admin/users is missing.
          const valid = snap.exists() ? Object.keys(snap.val()) : ["matan", "guest"];
          if (!valid.includes(stored)) {
            console.warn(`[Profile] saved active_user "${stored}" is not in _admin/users; switching to "${valid[0]}"`);
            localStorage.setItem("active_user", valid[0]);
            setActiveUser(valid[0]);
          }
          setUserChecked(true);
        }, err => {
          console.error("[Firebase] read failed for _admin/users:", err);
          localStorage.removeItem("active_user");
          setActiveUser(null);
          setUserChecked(true);
        });
      }, [authUser]);

      useEffect(() => {
        if (!authUser) return;
        db.ref(`${DB_ROOT}/_admin/geminiKey`).once("value", snap => {
          if (snap.val()) GEMINI_API_KEY = snap.val();
          setGeminiReady(true);
        }, err => {
          console.error("[Firebase] read failed for _admin/geminiKey:", err);
          setGeminiReady(true);
        });
      }, [authUser]);

      // Confirms a deploy actually landed: shows APP_VERSION alone only when
      // the latest commit touching THIS file is tagged (a blessed release);
      // otherwise appends the short SHA + date. Tracks test/index.html, not
      // index.html, so the test label reflects test commits, not prod ones.
      useEffect(() => {
        const REPO = "https://api.github.com/repos/Matankashi/nutrition-plan-";
        Promise.all([
          fetch(`${REPO}/commits?path=test/index.html&sha=main&per_page=1`).then(r => r.ok ? r.json() : null),
          fetch(`${REPO}/tags?per_page=30`).then(r => r.ok ? r.json() : null),
        ]).then(([commits, tags]) => {
          const commit = Array.isArray(commits) && commits[0];
          if (!commit) return;
          const sha = commit.sha;
          const date = new Date(commit.commit.author.date).toLocaleDateString("he-IL", { day: "2-digit", month: "2-digit" });
          const tagged = (Array.isArray(tags) ? tags : []).some(t => t.commit && t.commit.sha === sha);
          setLiveVersion(tagged ? APP_VERSION : `${APP_VERSION} · ${sha.slice(0, 7)} · ${date}`);
        }).catch(() => {});
      }, []);

      const selectUser = (u) => { localStorage.setItem("active_user", u); setActiveUser(u); };
      const logout = () => {
        localStorage.removeItem("active_user");
        setActiveUser(null);
      };

      const versionLabel = (
        <div style={{ position: "fixed", bottom: 8, left: 10, zIndex: 9999, fontSize: 14, fontWeight: 700, color: "#4a7a54", fontFamily: "monospace", direction: "ltr", pointerEvents: "none" }}>{liveVersion || APP_VERSION}</div>
      );

      if (authUser === undefined) return null;
      if (!authUser) return <LoginScreen />;
      if (!userChecked) return null;
      if (adminMode && !adminAuthed) return <>{versionLabel}<AdminPinScreen onSuccess={() => setAdminAuthed(true)} onBack={() => setAdminMode(false)} /></>;
      if (adminMode && adminAuthed) return <>{versionLabel}<AdminPanel onBack={() => { setAdminMode(false); setAdminAuthed(false); }} /></>;
      if (!activeUser) return <>{versionLabel}<UserSelect onSelect={selectUser} onAdmin={() => setAdminMode(true)} /></>;
      CURRENT_USER = activeUser;
      const todayStr = new Date().toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "long" });
      return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(180deg,#060d07 0%,#08130a 100%)", fontFamily: "'Segoe UI',Tahoma,sans-serif", direction: "rtl", color: "#f0fdf4", paddingBottom: "calc(80px + env(safe-area-inset-bottom, 8px))" }}>

          <div style={{ background: "#3a2a0a", color: "#fbbf24", fontSize: 11,
            textAlign: "center", padding: "5px", borderBottom: "1px solid #5a4a1a",
            position: "sticky", top: 0, zIndex: 25 }}>
            🧪 TEST — separate data ({DB_ROOT})
          </div>
          <div style={{ padding: "16px 18px 14px", background: "rgba(6,13,7,0.88)", backdropFilter: "blur(20px)", borderBottom: "1px solid rgba(34,197,94,0.1)", position: "sticky", top: 0, zIndex: 20 }}>
            <div style={{ maxWidth: 520, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style={{ fontSize: 17, fontWeight: 800, color: "#f0fdf4", letterSpacing: -0.3 }}>
                  {activeUser === "matan" ? "שלום מתן 👋" : "שלום אורח"}
                </div>
                <div style={{ fontSize: 11, color: "#4ade80", marginTop: 2, opacity: 0.75 }}>{todayStr}</div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={logout} style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 10, color: "#4a7a54", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", padding: "7px 13px" }}>החלף משתמש</button>
                <button onClick={() => firebase.auth().signOut()} style={{ background: "rgba(248,113,113,0.08)", border: "1px solid rgba(248,113,113,0.18)", borderRadius: 10, color: "#f87171", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", padding: "7px 13px" }}>יציאה</button>
              </div>
            </div>
          </div>

          <div style={{ maxWidth: 520, margin: "0 auto" }}>
            {tab === "plan" ? <PlanTab geminiReady={geminiReady} /> : tab === "routine" ? <RoutineTab geminiReady={geminiReady} /> : <WeightTab />}
            <div style={{ textAlign: "center", padding: "6px 14px 10px", fontSize: 10, color: "#1a3320" }}>⚠️ יש להתייעץ עם דיאטנית/רופא לפני שינויים תזונתיים משמעותיים</div>
          </div>

          <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 30, background: "rgba(6,13,7,0.97)", backdropFilter: "blur(24px)", borderTop: "1px solid rgba(34,197,94,0.1)" }}>
            <div style={{ maxWidth: 520, margin: "0 auto", display: "grid", gridTemplateColumns: "1fr 1fr 1fr", padding: "6px 6px 8px" }} className="safe-bottom">
              {[["plan","תפריט","🍽️"],["routine","שגרה","🗓️"],["weight","משקל","⚖️"]].map(([k,l,e]) => {
                const on = tab === k;
                return (
                  <button key={k} onClick={() => setTab(k)} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "7px 4px", borderRadius: 12, fontFamily: "inherit", transition: "all 0.15s" }}>
                    <div style={{ fontSize: 22, opacity: on ? 1 : 0.3, transform: on ? "scale(1.08)" : "scale(1)", transition: "all 0.2s" }}>{e}</div>
                    <div style={{ fontSize: 10, fontWeight: on ? 700 : 400, color: on ? "#22c55e" : "#3a5a3a", transition: "color 0.2s" }}>{l}</div>
                    <div style={{ width: on ? 16 : 0, height: 2, borderRadius: 1, background: "#22c55e", transition: "width 0.25s", marginTop: 1 }} />
                  </button>
                );
              })}
            </div>
          </div>

          {versionLabel}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<NutritionApp />);
  </script>
</body>
</html>
