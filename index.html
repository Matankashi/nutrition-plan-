              {[7,8,9,4,5,6,1,2,3,"",0,"⌫"].map((d, i) => (
                <button key={i} onClick={() => { if (d === "⌫") setPin(p => p.slice(0,-1)); else if (d !== "") press(String(d)); }}
                  style={{ height: 58, borderRadius: 12, border: "1px solid #1a3a1f", background: d === "" ? "transparent" : "#0d1f10", color: d === "⌫" ? "#f87171" : "#e0f0e0", fontSize: d === "⌫" ? 18 : 20, fontWeight: 600, cursor: d === "" ? "default" : "pointer", fontFamily: "inherit" }}>
                  {d}
                </button>
              ))}
            </div>
            <button onClick={onCancel} style={{ background: "transparent", border: "none", color: "#2d5a3a", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>ביטול</button>
          </div>
        </div>
      );
    }

    function LoginScreen() {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [loading, setLoading] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!email || !password || loading) return;
        setError("");
        setLoading(true);
        firebase.auth().signInWithEmailAndPassword(email, password)
          .catch(() => setError("אימייל או סיסמה שגויים"))
          .finally(() => setLoading(false));
      };

      const inputStyle = { background: "#0b1a0d", border: "1px solid #1a3a1f", borderRadius: 10, padding: "13px 14px", color: "#e0f0e0", fontSize: 14, outline: "none", fontFamily: "inherit", direction: "ltr", textAlign: "right" };

      return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(160deg,#060d07 0%,#09151f 55%,#060d07 100%)", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 28, fontFamily: "'Segoe UI',Tahoma,sans-serif", direction: "rtl", padding: "40px 32px" }}>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 48, marginBottom: 10 }}>🥗</div>
            <div style={{ fontSize: 24, fontWeight: 800, color: "#f0fdf4", letterSpacing: -0.5 }}>תכנית תזונה</div>
            <div style={{ fontSize: 13, color: "#4ade80", marginTop: 6, opacity: 0.6 }}>התחבר כדי להמשיך</div>
          </div>
          <form onSubmit={handleSubmit} style={{ width: "100%", maxWidth: 300, display: "flex", flexDirection: "column", gap: 10 }}>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="אימייל" autoComplete="username" style={inputStyle} />
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="סיסמה" autoComplete="current-password" style={inputStyle} />
            {error && <div style={{ color: "#f87171", fontSize: 13, fontWeight: 600, textAlign: "center" }}>{error}</div>}
            <button type="submit" disabled={loading || !email || !password}
              style={{ background: (loading || !email || !password) ? "#1a3a1f" : "#166534", border: "none", borderRadius: 10, padding: "13px 16px", color: "#fff", fontWeight: 700, fontSize: 14, cursor: (loading || !email || !password) ? "default" : "pointer", fontFamily: "inherit", marginTop: 4 }}>
              {loading ? "מתחבר..." : "התחבר"}
            </button>
          </form>
        </div>
      );
    }

    // ─── AdminPanel ───────────────────────────────────────────────────────────────
    function AdminPanel({ onBack }) {
      const [users, setUsers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [newMatanPin, setNewMatanPin] = useState("");
      const [newAdminPin, setNewAdminPin] = useState("");
      const [newGeminiKey, setNewGeminiKey] = useState("");
      const [saved, setSaved] = useState("");
      const [newUsername, setNewUsername] = useState("");
      const [newUserPin, setNewUserPin] = useState("");
      const [managedUsers, setManagedUsers] = useState(null);
      const [confirmAction, setConfirmAction] = useState(null);
      const [copyFrom, setCopyFrom] = useState("");
      const [copyTo, setCopyTo] = useState("");
      const [exportUser, setExportUser] = useState("");
      const [importUser, setImportUser] = useState("");
      const [error, setError] = useState(null);
      const importFileRef = React.useRef(null);

      useEffect(() => {
        db.ref(`${DB_ROOT}/_admin/users`).once("value", snap => {
          setManagedUsers(snap.exists() ? snap.val() : { matan: { pin: null }, guest: { pin: null } });
        }, err => {
          console.error("[Firebase] read failed for _admin/users:", err);
          setError(err.message);
        });
      }, []);

      useEffect(() => {
        if (!managedUsers) return;
        db.ref(DB_ROOT).once("value", snap => {
          const data = snap.val() || {};
          const userList = Object.keys(managedUsers).map(username => {
            const udata = data[username] || {};
            const weightEntries = udata.weight_entries ? asArray(udata.weight_entries) : [];
            const lastEntry = weightEntries.length > 0 ? weightEntries[weightEntries.length - 1] : null;
            return { username, weightCount: weightEntries.length, lastWeight: lastEntry ? lastEntry.kg + " ק״ג" : "—", lastDate: lastEntry ? (lastEntry.date || lastEntry.label || "—") : "—" };
          });
          setUsers(userList);
          setLoading(false);
        }, err => {
          console.error(`[Firebase] read failed for ${DB_ROOT}:`, err);
          setError(err.message);
        });
      }, [managedUsers]);

      const savePin = async (type) => {
        const val = type === "matan" ? newMatanPin : newAdminPin;
        if (val.length !== 4 || isNaN(val)) return;
        try {
          await db.ref(type === "matan" ? `${DB_ROOT}/_admin/matanPin` : `${DB_ROOT}/_admin/adminPin`).set(val);
          setSaved(type === "matan" ? "PIN של מתן עודכן ✓" : "PIN מנהל עודכן ✓");
          setTimeout(() => setSaved(""), 2500);
          if (type === "matan") setNewMatanPin(""); else setNewAdminPin("");
        } catch (err) {
          console.error("[Firebase] savePin failed:", err);
          alert("שמירת ה-PIN נכשלה: " + err.message);
        }
      };

      const requireAdminPin = (label, action) => setConfirmAction({ label, onConfirm: () => { setConfirmAction(null); action(); } });

      const addUser = async () => {
        const uname = newUsername.trim().toLowerCase().replace(/\s+/g,"_");
        if (!uname) return;
        const entry = { createdAt: Date.now() };
        if (newUserPin.length === 4) entry.pin = newUserPin;
        const updated = { ...(managedUsers || {}), [uname]: entry };
        try {
          await db.ref(`${DB_ROOT}/_admin/users`).set(updated);
          setManagedUsers(updated);
          setNewUsername(""); setNewUserPin("");
          setSaved(`משתמש "${uname}" נוסף ✓`);
          setTimeout(() => setSaved(""), 2500);
        } catch (err) {
          console.error("[Firebase] addUser failed:", err);
          alert("הוספת המשתמש נכשלה: " + err.message);
        }
      };

      const deleteUser = async (uname) => {
        const updated = { ...(managedUsers || {}) };
        delete updated[uname];
        try {
          await db.ref(`${DB_ROOT}/_admin/users`).set(updated);
          setManagedUsers(updated);
          setSaved(`משתמש "${uname}" נמחק ✓`);
          setTimeout(() => setSaved(""), 2500);
        } catch (err) {
          console.error("[Firebase] deleteUser failed:", err);
          alert("מחיקת המשתמש נכשלה: " + err.message);
        }
      };

      const exportBackup = async () => {
        const path = exportUser ? DB_ROOT + "/" + exportUser : DB_ROOT;
        try {
          const snap = await db.ref(path).once("value");
          const blob = new Blob([JSON.stringify(snap.val() || {}, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `nutrition-backup-${exportUser || "all"}-${toDateStr(new Date())}.json`;
          a.click();
          URL.revokeObjectURL(url);
        } catch (err) {
          console.error("[Firebase] exportBackup failed:", err);
          alert("ייצוא הגיבוי נכשל: " + err.message);
        }
      };

      const handleImportFile = (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          let parsed;
          try { parsed = JSON.parse(reader.result); }
          catch (err) { setSaved("קובץ לא תקין ✗"); setTimeout(() => setSaved(""), 2500); return; }
          const path = importUser ? DB_ROOT + "/" + importUser : DB_ROOT;
          const whoLabel = importUser ? `של "${importUser}"` : "של כל המשתמשים";
          requireAdminPin(`לשחזר גיבוי ${whoLabel}? זה ידרוס את הנתונים הקיימים ${whoLabel}!`, async () => {
            try {
              await db.ref(path).set(parsed);
              setSaved("הגיבוי שוחזר ✓");
              setTimeout(() => setSaved(""), 2500);
            } catch (err) {
              console.error("[Firebase] restore backup failed:", err);
              alert("שחזור הגיבוי נכשל: " + err.message);
            }
          });
        };
        reader.readAsText(file);
      };

      const copyUserData = () => {
        if (!copyFrom || !copyTo || copyFrom === copyTo) return;
        requireAdminPin(`להעתיק את נתוני "${copyFrom}" אל "${copyTo}"? זה ידרוס את הנתונים הקיימים של "${copyTo}"!`, async () => {
          try {
            const snap = await db.ref(DB_ROOT + "/" + copyFrom).once("value");
            await db.ref(DB_ROOT + "/" + copyTo).set(snap.val() || {});
            setSaved(`נתוני "${copyFrom}" הועתקו אל "${copyTo}" ✓`);
            setTimeout(() => setSaved(""), 2500);
            setCopyFrom(""); setCopyTo("");
          } catch (err) {
            console.error("[Firebase] copyUserData failed:", err);
            alert("העתקת הנתונים נכשלה: " + err.message);
          }
        });
      };

      // ניקוי שרידים מגרסאות ישנות: plan_checked (בלי v3), workout_type_v1,
      // ורשומות checklist עם מפתח מספרי במקום תאריך.
      const cleanLegacy = () => {
        requireAdminPin("למחוק נתוני שאריות מגרסאות ישנות? (plan_checked, workout_type_v1, מפתחות ישנים בצ׳קליסט)", async () => {
          try {
            const targets = users.map(u => u.username);
            let removed = 0;
            for (const u of targets) {
              const base = DB_ROOT + "/" + u;
              for (const k of ["plan_checked", "workout_type_v1"]) {
                const s = await db.ref(base + "/" + k).once("value");
                if (s.exists()) { await db.ref(base + "/" + k).remove(); removed++; }
              }
              const cs = await db.ref(base + "/checklist_checked").once("value");
              if (cs.exists()) {
                const obj = cs.val() || {};
                const cleaned = {};
                for (const [k, v] of Object.entries(obj)) {
                  if (/^\d{4}-\d{2}-\d{2}-/.test(k)) cleaned[k] = v; else removed++;
                }
                await db.ref(base + "/checklist_checked").set(cleaned);
              }
            }
            setSaved(`ניקוי הושלם — ${removed} רשומות הוסרו ✓`);
            setTimeout(() => setSaved(""), 3000);
          } catch (err) {
            console.error("[Firebase] cleanLegacy failed:", err);
            alert("ניקוי הנתונים נכשל: " + err.message);
          }
        });
      };

      const G = { bg: "#080f0a", card: "#0b1a0d", border: "#1a3a1f", text: "#e0f0e0", mid: "#4a7a54", green: "#4ade80", red: "#f87171" };

      if (error) return <DataError message={error} />;

      return (
        <div style={{ minHeight: "100vh", background: G.bg, fontFamily: "'Segoe UI',Tahoma,sans-serif", direction: "rtl", color: G.text, paddingBottom: 40 }}>
          {confirmAction && <AdminConfirmPin label={confirmAction.label} onConfirm={confirmAction.onConfirm} onCancel={() => setConfirmAction(null)} />}
          <div style={{ background: G.card, padding: "14px 18px", borderBottom: `1px solid ${G.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ fontSize: 16, fontWeight: 700, color: G.mid }}>🔧 פאנל ניהול</div>
            <button onClick={onBack} style={{ background: "#1a3a1f", border: "none", borderRadius: 8, padding: "6px 14px", color: G.mid, fontSize: 13, cursor: "pointer", fontFamily: "inherit" }}>← יציאה</button>
          </div>
          <div style={{ padding: 16, maxWidth: 500, margin: "0 auto" }}>
            {saved && <div style={{ background: "#166534", borderRadius: 10, padding: "10px 14px", marginBottom: 12, fontSize: 13, color: G.green }}>{saved}</div>}

            <div style={{ background: G.card, borderRadius: 14, padding: 16, marginBottom: 12, border: `1px solid ${G.border}` }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: G.mid, marginBottom: 14 }}>👥 סטטיסטיקות משתמשים</div>
              {loading ? <div style={{ color: G.mid, fontSize: 13 }}>טוען...</div> : users.length === 0 ? <div style={{ color: G.mid, fontSize: 13 }}>אין נתונים עדיין</div> : users.map(u => (
                <div key={u.username} style={{ background: G.bg, borderRadius: 10, padding: "12px 14px", marginBottom: 8, border: `1px solid ${G.border}` }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                    <div style={{ fontSize: 14, fontWeight: 700, color: G.green }}>👤 {u.username}</div>
                    <div style={{ fontSize: 11, color: G.mid }}>שקילה אחרונה: {u.lastDate}</div>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                    {[["שקילות", u.weightCount, G.green], ["משקל נוכחי", u.lastWeight, "#60a5fa"]].map(([l,v,c]) => (
                      <div key={l} style={{ textAlign: "center", background: G.card, borderRadius: 8, padding: "6px 4px" }}>
                        <div style={{ fontSize: 16, fontWeight: 700, color: c }}>{v}</div>
                        <div style={{ fontSize: 10, color: G.mid }}>{l}</div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>

            <div style={{ background: G.card, borderRadius: 14, padding: 16, marginBottom: 12, border: `1px solid ${G.border}` }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: G.mid, marginBottom: 14 }}>➕ ניהול משתמשים</div>
              {managedUsers && Object.keys(managedUsers).map(uname => (
                <div key={uname} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: G.bg, borderRadius: 8, padding: "8px 12px", marginBottom: 6, border: `1px solid ${G.border}` }}>
                  <div style={{ fontSize: 13, color: G.green }}>👤 {uname}</div>
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <div style={{ fontSize: 11, color: G.mid }}>{managedUsers[uname].pin ? "🔒 PIN" : "🔓 ללא PIN"}</div>
                    {uname !== "matan" && (
                      <button onClick={() => requireAdminPin(`למחוק את המשתמש "${uname}"?`, () => deleteUser(uname))}
                        style={{ background: "#7f1d1d", border: "none", borderRadius: 6, padding: "4px 10px", color: "#fca5a5", fontSize: 11, cursor: "pointer", fontFamily: "inherit" }}>מחק</button>
                    )}
                  </div>
                </div>
              ))}
              <div style={{ marginTop: 12, fontSize: 12, color: G.mid, marginBottom: 8 }}>הוסף משתמש חדש:</div>
              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <input value={newUsername} onChange={e => setNewUsername(e.target.value)} placeholder="שם משתמש"
                  style={{ flex: 1, background: G.bg, border: `1px solid ${G.border}`, borderRadius: 8, padding: "9px 12px", color: G.text, fontSize: 13, outline: "none", fontFamily: "inherit" }} />
                <input value={newUserPin} onChange={e => setNewUserPin(e.target.value.replace(/\D/g,"").slice(0,4))} placeholder="PIN (אופציונלי)" maxLength={4} inputMode="numeric"
                  style={{ width: 110, background: G.bg, border: `1px solid ${G.border}`, borderRadius: 8, padding: "9px 12px", color: G.text, fontSize: 13, outline: "none", direction: "ltr", fontFamily: "inherit" }} />
              </div>
              <button onClick={addUser} disabled={!newUsername.trim()} style={{ background: newUsername.trim() ? "#166534" : "#1a3a1f", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fff", fontWeight: 700, fontSize: 13, cursor: newUsername.trim() ? "pointer" : "default", fontFamily: "inherit", width: "100%" }}>➕ הוסף משתמש</button>
            </div>

            <div style={{ background: G.card, borderRadius: 14, padding: 16, marginBottom: 12, border: `1px solid ${G.border}` }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: G.mid, marginBottom: 14 }}>💾 גיבוי וייבוא נתונים</div>

              <div style={{ fontSize: 10, color: G.mid, marginBottom: 4 }}>משתמש לייצוא</div>
              <select value={exportUser} onChange={e => setExportUser(e.target.value)}
                style={{ width: "100%", background: G.bg, border: `1px solid ${G.border}`, borderRadius: 8, padding: "9px 8px", color: G.text, fontSize: 12, outline: "none", fontFamily: "inherit", marginBottom: 8 }}>
                <option value="">כל המשתמשים</option>
                {managedUsers && Object.keys(managedUsers).map(u => <option key={u} value={u}>{u}</option>)}
              </select>
              <button onClick={exportBackup} style={{ background: "#166534", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fff", fontWeight: 700, fontSize: 13, cursor: "pointer", fontFamily: "inherit", width: "100%", marginBottom: 16 }}>📥 ייצוא {exportUser ? `נתוני "${exportUser}"` : "כל הנתונים"} (גיבוי)</button>

              <div style={{ fontSize: 10, color: G.mid, marginBottom: 4 }}>משתמש לייבוא</div>
              <select value={importUser} onChange={e => setImportUser(e.target.value)}
                style={{ width: "100%", background: G.bg, border: `1px solid ${G.border}`, borderRadius: 8, padding: "9px 8px", color: G.text, fontSize: 12, outline: "none", fontFamily: "inherit", marginBottom: 8 }}>
                <option value="">כל המשתמשים (שחזור מלא)</option>
                {managedUsers && Object.keys(managedUsers).map(u => <option key={u} value={u}>{u}</option>)}
              </select>
              <input ref={importFileRef} type="file" accept=".json,application/json" onChange={handleImportFile} style={{ display: "none" }} />
              <button onClick={() => importFileRef.current?.click()} style={{ background: "#7f1d1d", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fca5a5", fontWeight: 700, fontSize: 13, cursor: "pointer", fontFamily: "inherit", width: "100%" }}>📤 שחזור {importUser ? `לתוך "${importUser}"` : "(ידרוס הכל)"}</button>
              <div style={{ fontSize: 11, color: G.mid, marginTop: 8, marginBottom: 16 }}>ייצוא של משתמש בודד מוריד רק את הנתונים שלו; ייבוא לתוך משתמש בודד דורש קובץ שיוצא לאותו משתמש. השחזור תמיד דורש אישור PIN מנהל ומחליף נתונים קיימים</div>

              <div style={{ borderTop: `1px solid ${G.border}`, paddingTop: 14 }}>
                <div style={{ fontSize: 12, color: G.mid, marginBottom: 8 }}>העתקת נתונים בין משתמשים:</div>
                <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 10, color: G.mid, marginBottom: 4 }}>מקור (העתק מ)</div>
                    <select value={copyFrom} onChange={e => setCopyFrom(e.target.value)}
                      style={{ width: "100%", background: G.bg, border: `1px solid ${G.border}`, borderRadius: 8, padding: "9px 8px", color: G.text, fontSize: 12, outline: "none", fontFamily: "inherit" }}>
                      <option value="">בחר...</option>
                      {managedUsers && Object.keys(managedUsers).map(u => <option key={u} value={u}>{u}</option>)}
                    </select>
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 10, color: G.mid, marginBottom: 4 }}>יעד (העתק אל)</div>
                    <select value={copyTo} onChange={e => setCopyTo(e.target.value)}
                      style={{ width: "100%", background: G.bg, border: `1px solid ${G.border}`, borderRadius: 8, padding: "9px 8px", color: G.text, fontSize: 12, outline: "none", fontFamily: "inherit" }}>
                      <option value="">בחר...</option>
                      {managedUsers && Object.keys(managedUsers).map(u => <option key={u} value={u}>{u}</option>)}
                    </select>
                  </div>
                </div>
                <button onClick={copyUserData} disabled={!copyFrom || !copyTo || copyFrom === copyTo}
                  style={{ background: (copyFrom && copyTo && copyFrom !== copyTo) ? "#166534" : "#1a3a1f", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fff", fontWeight: 700, fontSize: 13, cursor: (copyFrom && copyTo && copyFrom !== copyTo) ? "pointer" : "default", fontFamily: "inherit", width: "100%" }}>📋 העתק נתונים</button>
              </div>

              <div style={{ borderTop: `1px solid ${G.border}`, paddingTop: 14, marginTop: 14 }}>
                <button onClick={cleanLegacy} style={{ background: "#3a2a0a", border: "1px solid #5a4a1a", borderRadius: 8, padding: "9px 16px", color: "#fbbf24", fontWeight: 700, fontSize: 13, cursor: "pointer", fontFamily: "inherit", width: "100%" }}>🧹 נקה שאריות מגרסאות ישנות</button>
                <div style={{ fontSize: 11, color: G.mid, marginTop: 8 }}>מוחק את plan_checked הישן, workout_type_v1, ורשומות צ׳קליסט עם מפתח מספרי (לפני המעבר לתאריכים). לא נוגע בנתונים פעילים.</div>
              </div>
            </div>

            <div style={{ background: G.card, borderRadius: 14, padding: 16, marginBottom: 12, border: `1px solid ${G.border}` }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: G.mid, marginBottom: 12 }}>🔑 שנה PIN של Matan</div>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={newMatanPin} onChange={e => setNewMatanPin(e.target.value.replace(/\D/g,"").slice(0,4))}
                  placeholder="4 ספרות חדשות" maxLength={4} inputMode="numeric"
                  style={{ flex: 1, background: G.bg, border: `1px solid ${G.border}`, borderRadius: 8, padding: "9px 12px", color: G.text, fontSize: 14, outline: "none", direction: "ltr", fontFamily: "inherit" }} />
                <button onClick={() => savePin("matan")} disabled={newMatanPin.length !== 4} style={{ background: newMatanPin.length === 4 ? "#166534" : "#1a3a1f", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fff", fontWeight: 700, fontSize: 13, cursor: newMatanPin.length === 4 ? "pointer" : "default", fontFamily: "inherit" }}>שמור</button>
              </div>
            </div>

            <div style={{ background: G.card, borderRadius: 14, padding: 16, marginBottom: 12, border: `1px solid ${G.border}` }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: G.mid, marginBottom: 12 }}>🔧 שנה PIN מנהל</div>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={newAdminPin} onChange={e => setNewAdminPin(e.target.value.replace(/\D/g,"").slice(0,4))}
                  placeholder="4 ספרות חדשות" maxLength={4} inputMode="numeric"
                  style={{ flex: 1, background: G.bg, border: `1px solid ${G.border}`, borderRadius: 8, padding: "9px 12px", color: G.text, fontSize: 14, outline: "none", direction: "ltr", fontFamily: "inherit" }} />
                <button onClick={() => savePin("admin")} disabled={newAdminPin.length !== 4} style={{ background: newAdminPin.length === 4 ? "#166534" : "#1a3a1f", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fff", fontWeight: 700, fontSize: 13, cursor: newAdminPin.length === 4 ? "pointer" : "default", fontFamily: "inherit" }}>שמור</button>
              </div>
              <div style={{ fontSize: 11, color: G.mid, marginTop: 8 }}>PIN ברירת מחדל: 0000</div>
            </div>

            <div style={{ background: G.card, borderRadius: 14, padding: 16, border: `1px solid ${G.border}` }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: G.mid, marginBottom: 12 }}>🤖 מפתח Gemini AI</div>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={newGeminiKey} onChange={e => setNewGeminiKey(e.target.value.trim())}
                  placeholder="הדבק מפתח API חדש מ-Google AI Studio"
                  style={{ flex: 1, background: G.bg, border: `1px solid ${G.border}`, borderRadius: 8, padding: "9px 12px", color: G.text, fontSize: 12, outline: "none", direction: "ltr", fontFamily: "monospace" }} />
                <button onClick={async () => { if (!newGeminiKey) return; await db.ref(`${DB_ROOT}/_admin/geminiKey`).set(newGeminiKey); GEMINI_API_KEY = newGeminiKey; setSaved("gemini"); setNewGeminiKey(""); setTimeout(() => setSaved(""), 2000); }}
                  disabled={!newGeminiKey}
                  style={{ background: newGeminiKey ? "#166534" : "#1a3a1f", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fff", fontWeight: 700, fontSize: 13, cursor: newGeminiKey ? "pointer" : "default", fontFamily: "inherit" }}>
                  {saved === "gemini" ? "✓" : "שמור"}
                </button>
              </div>
              <div style={{ fontSize: 11, color: G.mid, marginTop: 8 }}>המפתח נשמר ב-Firebase ולא בקוד</div>
            </div>
          </div>
        </div>
      );
    }

    // ─── App ──────────────────────────────────────────────────────────────────────
    function NutritionApp() {
      const [tab, setTab] = useState("plan");
      const [activeUser, setActiveUser] = useState(localStorage.getItem("active_user") || null);
      const [adminMode, setAdminMode] = useState(false);
      const [adminAuthed, setAdminAuthed] = useState(false);
      const [liveVersion, setLiveVersion] = useState(null);
      const [authUser, setAuthUser] = useState(undefined);
      const [geminiReady, setGeminiReady] = useState(false);

      useEffect(() => {
        const unsubscribe = firebase.auth().onAuthStateChanged(u => setAuthUser(u));
        return unsubscribe;
      }, []);

      useEffect(() => {
        if (!authUser) return;
        db.ref(`${DB_ROOT}/_admin/geminiKey`).once("value", snap => {
          if (snap.val()) GEMINI_API_KEY = snap.val();
          setGeminiReady(true);
        }, err => {
          console.error("[Firebase] read failed for _admin/geminiKey:", err);
          setGeminiReady(true);
        });
      }, [authUser]);

      useEffect(() => {
        const REPO = "https://api.github.com/repos/Matankashi/nutrition-plan-";
        Promise.all([
          fetch(`${REPO}/commits?path=index.html&sha=main&per_page=1`).then(r => r.ok ? r.json() : null),
          fetch(`${REPO}/tags?per_page=30`).then(r => r.ok ? r.json() : null),
        ]).then(([commits, tags]) => {
          const commit = Array.isArray(commits) && commits[0];
          if (!commit) return;
          const sha = commit.sha;
          const date = new Date(commit.commit.author.date).toLocaleDateString("he-IL", { day: "2-digit", month: "2-digit" });
          const matches = (Array.isArray(tags) ? tags : []).filter(t => t.commit && t.commit.sha === sha);
          const betaTag = matches.find(t => /^beta-/i.test(t.name));
          const chosen = betaTag || matches[0];
          if (chosen) setLiveVersion(/^beta-/i.test(chosen.name) ? chosen.name.replace(/^beta-/i, "Beta ") : chosen.name);
          else setLiveVersion(`${sha.slice(0, 7)} · ${date}`);
        }).catch(() => {});
      }, []);

      const selectUser = (u) => { localStorage.setItem("active_user", u); setActiveUser(u); };
      const logout = () => {
        localStorage.removeItem("active_user");
        setActiveUser(null);
      };

      const versionLabel = (
        <div style={{ position: "fixed", bottom: 8, left: 10, zIndex: 9999, fontSize: 14, fontWeight: 700, color: "#4a7a54", fontFamily: "monospace", direction: "ltr", pointerEvents: "none" }}>{liveVersion || APP_VERSION}</div>
      );

      if (authUser === undefined) return null;
      if (!authUser) return <LoginScreen />;
      if (adminMode && !adminAuthed) return <>{versionLabel}<AdminPinScreen onSuccess={() => setAdminAuthed(true)} onBack={() => setAdminMode(false)} /></>;
      if (adminMode && adminAuthed) return <>{versionLabel}<AdminPanel onBack={() => { setAdminMode(false); setAdminAuthed(false); }} /></>;
      if (!activeUser) return <>{versionLabel}<UserSelect onSelect={selectUser} onAdmin={() => setAdminMode(true)} /></>;
      CURRENT_USER = activeUser;
      const todayStr = new Date().toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "long" });
      return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(180deg,#060d07 0%,#08130a 100%)", fontFamily: "'Segoe UI',Tahoma,sans-serif", direction: "rtl", color: "#f0fdf4", paddingBottom: "calc(80px + env(safe-area-inset-bottom, 8px))" }}>

          <div style={{ padding: "16px 18px 14px", background: "rgba(6,13,7,0.88)", backdropFilter: "blur(20px)", borderBottom: "1px solid rgba(34,197,94,0.1)", position: "sticky", top: 0, zIndex: 20 }}>
            <div style={{ maxWidth: 520, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style={{ fontSize: 17, fontWeight: 800, color: "#f0fdf4", letterSpacing: -0.3 }}>
                  {activeUser === "matan" ? "שלום מתן 👋" : "שלום אורח"}
                </div>
                <div style={{ fontSize: 11, color: "#4ade80", marginTop: 2, opacity: 0.75 }}>{todayStr}</div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={logout} style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 10, color: "#4a7a54", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", padding: "7px 13px" }}>החלף משתמש</button>
                <button onClick={() => firebase.auth().signOut()} style={{ background: "rgba(248,113,113,0.08)", border: "1px solid rgba(248,113,113,0.18)", borderRadius: 10, color: "#f87171", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", padding: "7px 13px" }}>יציאה</button>
              </div>
            </div>
          </div>

          <div style={{ maxWidth: 520, margin: "0 auto" }}>
            {tab === "plan" ? <PlanTab geminiReady={geminiReady} /> : tab === "routine" ? <RoutineTab geminiReady={geminiReady} /> : <WeightTab />}
            <div style={{ textAlign: "center", padding: "6px 14px 10px", fontSize: 10, color: "#1a3320" }}>⚠️ יש להתייעץ עם דיאטנית/רופא לפני שינויים תזונתיים משמעותיים</div>
          </div>

          <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 30, background: "rgba(6,13,7,0.97)", backdropFilter: "blur(24px)", borderTop: "1px solid rgba(34,197,94,0.1)" }}>
            <div style={{ maxWidth: 520, margin: "0 auto", display: "grid", gridTemplateColumns: "1fr 1fr 1fr", padding: "6px 6px 8px" }} className="safe-bottom">
              {[["plan","תפריט","🍽️"],["routine","שגרה","🗓️"],["weight","משקל","⚖️"]].map(([k,l,e]) => {
                const on = tab === k;
                return (
                  <button key={k} onClick={() => setTab(k)} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "7px 4px", borderRadius: 12, fontFamily: "inherit", transition: "all 0.15s" }}>
                    <div style={{ fontSize: 22, opacity: on ? 1 : 0.3, transform: on ? "scale(1.08)" : "scale(1)", transition: "all 0.2s" }}>{e}</div>
                    <div style={{ fontSize: 10, fontWeight: on ? 700 : 400, color: on ? "#22c55e" : "#3a5a3a", transition: "color 0.2s" }}>{l}</div>
                    <div style={{ width: on ? 16 : 0, height: 2, borderRadius: 1, background: "#22c55e", transition: "width 0.25s", marginTop: 1 }} />
                  </button>
                );
              })}
            </div>
          </div>

          {versionLabel}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<NutritionApp />);
  </script>
</body>
</html>
