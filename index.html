<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ─── helpers ────────────────────────────────────────────────────────────────
    const db = firebase.database();
    let CURRENT_USER = "guest";

    function usePersist(key, initial) {
      const [val, setVal] = useState(initial);

      useEffect(() => {
        const path = 'nutrition/' + CURRENT_USER + '/' + key;
        db.ref(path).on('value', snap => {
          if (snap.exists()) setVal(snap.val());
        });
        return () => db.ref(path).off();
      }, [key]);

      const update = (newVal) => {
        setVal(prev => {
          const resolved = typeof newVal === 'function' ? newVal(prev) : newVal;
          db.ref('nutrition/' + CURRENT_USER + '/' + key).set(resolved);
          return resolved;
        });
      };

      return [val, update];
    }

    // ─── data ────────────────────────────────────────────────────────────────────
    const DAY_NAMES = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];

    const MEALS = [
      { id: 1, time: "08:00–09:00", name: "ארוחת בוקר", emoji: "🌅", cal: 538, pro: 30,
        items: ["2 פרוסות לחם שיפון", "2 ביצים", "גבינה לבנה 5% — 80–85 גרם", "ירקות חתוכים", "כפית טחינה"],
        tip: "טווח קלורי 485–590 קק״ל. מים לפני הארוחה — הביצים והגבינה נותנות בסיס חלבון טוב לבוקר." },
      { id: 2, time: "12:00", name: "ביניים", emoji: "🥗", cal: 215, pro: 27,
        items: ["סלט ירקות בינוני", "כפית שטוחה שמן", "קופסת טונה במים (שלמה)", "תיבול לפי טעם"],
        tip: "טווח קלורי 175–255 קק״ל. קופסה שלמה של טונה — לא חצי. מחזיק עד הצהריים." },
      { id: 3, time: "14:00", name: "ארוחת צהריים", emoji: "🍽️", cal: 535, pro: 50,
        items: ["150 גרם חזה עוף אחרי בישול", "100 גרם קינואה מבושלת", "חצי בטטה", "ירקות מבושלים (קישוא/סלק)", "כפית טחינה"],
        tip: "טווח קלורי 470–600 קק״ל. קינואה במקום אורז — יותר חלבון וסיבים." },
      { id: 4, time: "17:00–18:00", name: "שייק חלבון", emoji: "🥤", cal: 468, pro: 31,
        items: ["30 גרם אבקת חלבון אפונה", "בננה", "30 גרם שיבולת שועל", "5 גרם צ׳יה", "5 גרם שיפון", "3 אגוזי מלך שלמים או כף חמאת בוטנים", "קינמון"],
        tip: "טווח קלורי 430–505 קק״ל. ביום הליכה — חמאת בוטנים. ביום רגיל — אגוזי מלך." },
      { id: 5, time: "20:00–21:00", name: "ארוחת ערב", emoji: "🌙", cal: 305, pro: 19,
        items: ["ביצה אחת", "גבינה לבנה 5% — 80 גרם", "ירקות חתוכים", "פרוסת לחם שיפון אחת"],
        tip: "טווח קלורי 270–340 קק״ל. אם רעב אחרי — יוגורט יווני בלבד, לא מתוק." },
    ];

    const EC = { "⚡":"#fbbf24","🌅":"#fb923c","🥗":"#4ade80","🍽️":"#60a5fa","🥤":"#a78bfa","🍫":"#d4a857","🌙":"#818cf8","🍌":"#facc15","🌃":"#c084fc" };
    const START_W = 86, GOAL_W = 75;
    const APP_VERSION = "Test";

    // minutes from midnight for each meal's active window
    const MEAL_WINDOWS = { 1: [8*60, 11*60+59], 2: [12*60, 13*60+59], 3: [14*60, 16*60+59], 4: [17*60, 19*60+59], 5: [20*60, 23*60+59] };

    const toDateStr = (d) => d.toISOString().split("T")[0];

    const getLast7Days = () => {
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        days.push({
          dateStr: toDateStr(d),
          dayName: DAY_NAMES[d.getDay()],
          display: d.toLocaleDateString("he-IL", { day: "2-digit", month: "2-digit" }),
        });
      }
      return days;
    };

    const getActiveMealId = (now) => {
      const mins = now.getHours() * 60 + now.getMinutes();
      for (const [id, [start, end]] of Object.entries(MEAL_WINDOWS)) {
        if (mins >= start && mins <= end) return Number(id);
      }
      // next upcoming meal
      for (const [id, [start]] of Object.entries(MEAL_WINDOWS)) {
        if (mins < start) return Number(id);
      }
      return null;
    };

    // ─── WeightTab ───────────────────────────────────────────────────────────────
    const asArray = (v) => Array.isArray(v) ? v : Object.values(v || {});
    const HE_MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
    const EN_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    const parseDMYDate = (e) => {
      if (!e.date) return null;
      const parts = e.date.split(".");
      if (parts.length < 3) return null;
      return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
    };

    // Reusable add-entry + grouped-history widget (year → month → week → entry),
    // shared by weight, waist and neck tracking — years other than the current
    // one collapse to a single row to keep the history short as it grows.
    function MeasurementCard({ entries, onAdd, valueField, unit, min, max, addLabel, addPlaceholder, addHint, historyLabel, sectionTitle }) {
      const [input, setInput] = useState("");
      const [expandedKeys, setExpandedKeys] = useState({});
      const toggleKey = key => setExpandedKeys(p => ({ ...p, [key]: !p[key] }));
      const [historyOpen, setHistoryOpen] = useState(false);

      const handleAdd = () => {
        const val = parseFloat(input.replace(",", "."));
        if (isNaN(val) || val < min || val > max) return;
        const now = new Date();
        const date = now.toLocaleDateString("he-IL", { day: "2-digit", month: "2-digit", year: "numeric" });
        onAdd(val, date);
        setInput("");
      };

      const today = new Date();
      const curMonth = today.getMonth(), curYear = today.getFullYear();

      const monthGroups = [];
      entries.forEach((e, i) => {
        const d = parseDMYDate(e);
        const key = d ? `${d.getFullYear()}-${d.getMonth()}` : `x-${i}`;
        const isCur = d ? (d.getMonth() === curMonth && d.getFullYear() === curYear) : false;
        const mLabel = d ? `${HE_MONTHS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}` : "";
        let g = monthGroups.find(g => g.key === key);
        if (!g) { g = { key, year: d ? d.getFullYear() : null, label: mLabel, isCurrent: isCur, entries: [], weekGroups: [] }; monthGroups.push(g); }
        g.entries.push({ ...e, origIdx: i });
        if (d) {
          const weekNum = Math.ceil(d.getDate() / 7);
          const wKey = `${key}-w${weekNum}`;
          const wLabel = `${EN_MONTHS[d.getMonth()]} ${String(d.getFullYear()).slice(2)} Week ${weekNum}`;
          let wg = g.weekGroups.find(w => w.key === wKey);
          if (!wg) { wg = { key: wKey, label: wLabel, weekNum, entries: [] }; g.weekGroups.push(wg); }
          wg.entries.push({ ...e, origIdx: i });
        }
      });
      monthGroups.forEach(g => {
        g.weekGroups.forEach(wg => {
          wg.avg = +(wg.entries.reduce((s, e) => s + e[valueField], 0) / wg.entries.length).toFixed(2);
        });
        g.monthAvg = g.weekGroups.length > 0
          ? +(g.weekGroups.reduce((s, wg) => s + wg.avg, 0) / g.weekGroups.length).toFixed(2)
          : (g.entries.length > 0 ? g.entries[g.entries.length - 1][valueField] : null);
      });

      const yearGroups = [];
      monthGroups.forEach(g => {
        const yKey = g.year !== null ? String(g.year) : `x-${g.key}`;
        let yg = yearGroups.find(y => y.key === yKey);
        if (!yg) { yg = { key: yKey, label: g.year !== null ? String(g.year) : "", isCurrent: g.year === curYear, monthGroups: [] }; yearGroups.push(yg); }
        yg.monthGroups.push(g);
      });
      yearGroups.forEach(yg => {
        const avgs = yg.monthGroups.map(g => g.monthAvg).filter(v => v !== null);
        yg.yearAvg = avgs.length > 0 ? +(avgs.reduce((s, v) => s + v, 0) / avgs.length).toFixed(2) : null;
      });

      const trendColor = t => (t < 0 ? "#4ade80" : t > 0 ? "#f87171" : "#4a7a54");
      const trendArrow = t => (t < 0 ? "▼" : t > 0 ? "▲" : "=");

      return (
        <>
          {sectionTitle && <div style={{ fontSize: 13, color: "#4ade80", fontWeight: 700, margin: "4px 2px 8px" }}>{sectionTitle}</div>}

          <div style={{ background: "#0d1f10", borderRadius: 12, border: "1px solid #1a3a1f", padding: 14, marginBottom: 12 }}>
            <div style={{ fontSize: 12, color: "#4ade80", fontWeight: 700, marginBottom: 10 }}>{addLabel}</div>
            <div style={{ display: "flex", gap: 8 }}>
              <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && handleAdd()}
                placeholder={addPlaceholder} inputMode="decimal"
                style={{ flex: 1, background: "#0b1a0d", border: "1px solid #2d5a3a", borderRadius: 8, padding: "9px 12px", color: "#e0f0e0", fontSize: 14, fontFamily: "inherit", direction: "ltr", outline: "none" }} />
              <button onClick={handleAdd} style={{ background: "#166534", border: "none", borderRadius: 8, padding: "9px 18px", color: "#fff", fontWeight: 700, cursor: "pointer", fontSize: 13, fontFamily: "inherit" }}>שמור</button>
            </div>
            <div style={{ fontSize: 11, color: "#4a7a54", marginTop: 8 }}>{addHint}</div>
          </div>

          {entries.length > 0 && (
            <div style={{ background: "#0d1f10", borderRadius: 12, border: "1px solid #1a3a1f", padding: 14, marginBottom: 20 }}>
              <div onClick={() => setHistoryOpen(o => !o)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", marginBottom: historyOpen ? 10 : 0 }}>
                <div style={{ fontSize: 12, color: "#4ade80", fontWeight: 700 }}>{historyLabel}</div>
                <span style={{ fontSize: 10, color: "#4a7a54" }}>{historyOpen ? "▲" : "▼"}</span>
              </div>
              {historyOpen && (() => {
                let prevWeekAvg = null;

                const renderWeekRow = (wg, diff) => {
                  const expanded = !!expandedKeys[wg.key];
                  const first = wg.entries[0];
                  const last = wg.entries[wg.entries.length - 1];
                  const trend = diff !== null ? diff : +(last[valueField] - first[valueField]).toFixed(2);
                  return (
                    <div key={wg.key} style={{ marginBottom: 4 }}>
                      {expanded
                        ? wg.entries.map((e, ei) => {
                            const d = ei === 0 ? null : +(e[valueField] - wg.entries[ei - 1][valueField]).toFixed(1);
                            return (
                              <div key={e.origIdx} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: "1px solid #0f2a12" }}>
                                <div style={{ fontSize: 12, color: "#c8e8c8" }}>{e.date}</div>
                                <span style={{ fontSize: 14, fontWeight: 700, fontFamily: "monospace", color: "#e0f0e0" }}>{e[valueField]} {unit}</span>
                                {d !== null
                                  ? <span style={{ fontSize: 12, fontFamily: "monospace", minWidth: 48, textAlign: "left", color: trendColor(d) }}>{trendArrow(d)} {Math.abs(d)}</span>
                                  : <span style={{ minWidth: 48 }} />}
                              </div>
                            );
                          })
                        : (
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: "1px solid #0f2a12" }}>
                            <div style={{ fontSize: 12, color: "#c8e8c8" }}>{first.date}</div>
                            <span style={{ fontSize: 14, fontWeight: 700, fontFamily: "monospace", color: "#e0f0e0" }}>{first[valueField]} {unit}</span>
                            <span style={{ minWidth: 48 }} />
                          </div>
                        )}
                      <div onClick={() => toggleKey(wg.key)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 8px", background: "#0b1a0d", borderRadius: 7, marginBottom: 2, cursor: "pointer" }}>
                        <div style={{ fontSize: 12, color: "#4ade80", fontWeight: 700 }}>{wg.label} <span style={{ fontSize: 10, color: "#4a7a54" }}>{expanded ? "▲" : "▼"}</span></div>
                        <span style={{ fontSize: 14, fontWeight: 700, fontFamily: "monospace", color: "#e0f0e0" }}>{wg.avg} {unit}</span>
                        <span style={{ fontSize: 12, fontFamily: "monospace", minWidth: 48, textAlign: "left", color: trendColor(trend) }}>{trendArrow(trend)} {Math.abs(trend)}</span>
                      </div>
                    </div>
                  );
                };

                const renderMonthGroup = (g, isLastInParent) => {
                  if (g.isCurrent) {
                    return g.weekGroups.map(wg => {
                      const diff = prevWeekAvg !== null ? +(wg.avg - prevWeekAvg).toFixed(2) : null;
                      prevWeekAvg = wg.avg;
                      return renderWeekRow(wg, diff);
                    });
                  }
                  const lastWeekAvg = g.weekGroups.length > 0 ? g.weekGroups[g.weekGroups.length - 1].avg : null;
                  const monthDiff = prevWeekAvg !== null && g.monthAvg !== null ? +(g.monthAvg - prevWeekAvg).toFixed(2) : null;
                  prevWeekAvg = lastWeekAvg;
                  const expanded = !!expandedKeys[g.key];
                  const firstEntry = g.entries[0];
                  const trend = monthDiff !== null ? monthDiff : +(g.monthAvg - firstEntry[valueField]).toFixed(2);
                  return (
                    <div key={g.key} style={{ marginBottom: 6 }}>
                      {expanded
                        ? g.weekGroups.map((wg, wi) => {
                            const d = wi === 0 ? null : +(wg.avg - g.weekGroups[wi - 1].avg).toFixed(2);
                            return renderWeekRow(wg, d);
                          })
                        : (
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: "1px solid #0f2a12" }}>
                            <div style={{ fontSize: 12, color: "#c8e8c8" }}>{firstEntry.date}</div>
                            <span style={{ fontSize: 14, fontWeight: 700, fontFamily: "monospace", color: "#e0f0e0" }}>{firstEntry[valueField]} {unit}</span>
                            <span style={{ minWidth: 48 }} />
                          </div>
                        )}
                      <div onClick={() => toggleKey(g.key)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 8px", background: "#0b1a0d", borderRadius: 7, borderBottom: isLastInParent ? "none" : "1px solid #1a3a1f", marginBottom: 2, cursor: "pointer" }}>
                        <div style={{ fontSize: 12, color: "#4ade80", fontWeight: 700 }}>{g.label} <span style={{ fontSize: 10, color: "#2d5a3a" }}>{expanded ? "▲" : "▼"}</span></div>
                        <span style={{ fontSize: 14, fontWeight: 700, fontFamily: "monospace", color: "#e0f0e0" }}>{g.monthAvg} {unit}</span>
                        <span style={{ fontSize: 12, fontFamily: "monospace", minWidth: 48, textAlign: "left", color: trendColor(trend) }}>{trendArrow(trend)} {Math.abs(trend)}</span>
                      </div>
                    </div>
                  );
                };

                return yearGroups.map((yg, yi) => {
                  if (yg.isCurrent) {
                    return yg.monthGroups.map((g, gi) => renderMonthGroup(g, gi === yg.monthGroups.length - 1 && yi === yearGroups.length - 1));
                  }
                  const entryPrevWeekAvg = prevWeekAvg;
                  const monthNodes = yg.monthGroups.map((g, gi) => renderMonthGroup(g, gi === yg.monthGroups.length - 1));
                  const expandedYear = !!expandedKeys[yg.key];
                  const firstEntry = yg.monthGroups[0].entries[0];
                  const yearTrend = entryPrevWeekAvg !== null && yg.yearAvg !== null
                    ? +(yg.yearAvg - entryPrevWeekAvg).toFixed(2)
                    : +(yg.yearAvg - firstEntry[valueField]).toFixed(2);
                  return (
                    <div key={yg.key} style={{ marginBottom: 8 }}>
                      {expandedYear
                        ? monthNodes
                        : (
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: "1px solid #0f2a12" }}>
                            <div style={{ fontSize: 12, color: "#c8e8c8" }}>{firstEntry.date}</div>
                            <span style={{ fontSize: 14, fontWeight: 700, fontFamily: "monospace", color: "#e0f0e0" }}>{firstEntry[valueField]} {unit}</span>
                            <span style={{ minWidth: 48 }} />
                          </div>
                        )}
                      <div onClick={() => toggleKey(yg.key)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 8px", background: "#0f2a14", borderRadius: 7, border: "1px solid #1e4a2e", marginBottom: 2, cursor: "pointer" }}>
                        <div style={{ fontSize: 13, color: "#4ade80", fontWeight: 700 }}>📅 {yg.label} <span style={{ fontSize: 10, color: "#2d5a3a" }}>{expandedYear ? "▲" : "▼"}</span></div>
                        <span style={{ fontSize: 14, fontWeight: 700, fontFamily: "monospace", color: "#e0f0e0" }}>{yg.yearAvg} {unit}</span>
                        <span style={{ fontSize: 12, fontFamily: "monospace", minWidth: 48, textAlign: "left", color: trendColor(yearTrend) }}>{trendArrow(yearTrend)} {Math.abs(yearTrend)}</span>
                      </div>
                    </div>
                  );
                });
              })()}
            </div>
          )}
        </>
      );
    }

    function WeightTab() {
      const [entriesRaw, setEntries] = usePersist("weight_entries", [{ week: 0, kg: START_W, label: "התחלה" }]);
      const entries = asArray(entriesRaw);
      const [waistEntriesRaw, setWaistEntries] = usePersist("waist_entries", []);
      const waistEntries = asArray(waistEntriesRaw);
      const [neckEntriesRaw, setNeckEntries] = usePersist("neck_entries", []);
      const neckEntries = asArray(neckEntriesRaw);
      const [customMeals] = usePersist("custom_meals_v1", {});
      const [checked] = usePersist("plan_checked_v3", {});
      const todayStr = toDateStr(new Date());
      const [dayType, setDayType] = useState("rest");
      const [selectedIdx, setSelectedIdx] = useState(null);

      const last = entries[entries.length - 1].kg;
      const lost = +(START_W - last).toFixed(1);
      const remaining = +(last - GOAL_W).toFixed(1);
      const pct = Math.min((lost / (START_W - GOAL_W)) * 100, 100);
      const weeksLeft = Math.round(remaining / 0.5);
      const monthsLeft = Math.round(remaining / 2.5);

      const shortDate = (e) => {
        if (e.date) {
          const parts = e.date.split(".");
          if (parts.length >= 2) return parts[0] + "/" + parts[1];
        }
        return e.label;
      };

      const addWeightEntry = (kg, date) => {
        const w = entries[entries.length - 1].week + 1;
        const label = date.split(".").slice(0, 2).join("/");
        setEntries(p => [...asArray(p), { week: w, kg, label, date }]);
      };
      const addWaistEntry = (cm, date) => setWaistEntries(p => [...asArray(p), { cm, date }]);
      const addNeckEntry = (cm, date) => setNeckEntries(p => [...asArray(p), { cm, date }]);

      const today = new Date();
      const curMonth = today.getMonth(), curYear = today.getFullYear();
      const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
      const daysRemaining = daysInMonth - today.getDate();
      const monthEntries = entries.filter(e => { const d = parseDMYDate(e); return d && d.getMonth() === curMonth && d.getFullYear() === curYear; });
      const prevEntries = entries.filter(e => { const d = parseDMYDate(e); return d && (d.getFullYear() < curYear || (d.getFullYear() === curYear && d.getMonth() < curMonth)); });
      const monthStart = monthEntries.length > 0 ? monthEntries[0] : (prevEntries.length > 0 ? prevEntries[prevEntries.length - 1] : null);
      const monthEnd = entries[entries.length - 1];
      let monthStat = null;
      if (monthStart && monthEnd && monthStart !== monthEnd) {
        const startDate = parseDMYDate(monthStart) || today;
        const daysElapsed = Math.max(1, Math.round((today - startDate) / 86400000));
        const monthLost = +(monthStart.kg - monthEnd.kg).toFixed(2);
        const projected = +(( monthLost / daysElapsed) * daysInMonth).toFixed(1);
        const pctOfMax = Math.min((monthLost / 2.5) * 100, 105);
        let status, statusColor;
        if (daysElapsed < 5) { status = "🔍 מוקדם להעריך"; statusColor = "#4a7a54"; }

    // ─── PlanTab ─────────────────────────────────────────────────────────────────
    let GEMINI_API_KEY = "";
    db.ref("nutrition/_admin/geminiKey").once("value", snap => { if (snap.val()) GEMINI_API_KEY = snap.val(); });

    const getWeekDays = (offset = 0) => {
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i - offset * 7);
        days.push({ dateStr: toDateStr(d), dayName: DAY_NAMES[d.getDay()], display: d.toLocaleDateString("he-IL", { day: "2-digit", month: "2-digit" }) });

      return days;
    };

    const getShiftWeekDates = (offset = 0) => {
      const today = new Date();
      const sunday = new Date(today);
      sunday.setDate(today.getDate() - today.getDay() + offset * 7);
      return Array.from({length: 7}, (_, i) => {
        const d = new Date(sunday);
        d.setDate(sunday.getDate() + i);
        return toDateStr(d);
      });
    };
    const SHIFT_ICONS  = { morning: "☀️", evening: "🌙", off: "🏠" };
    const SHIFT_COLORS = { morning: "#fbbf24", evening: "#818cf8", off: "#4a7a54" };

    function PlanTab() {
      const [now, setNow] = useState(new Date());
      useEffect(() => { const t = setInterval(() => setNow(new Date()), 60000); return () => clearInterval(t); }, []);

      const todayStr = toDateStr(now);
      const [weekOffset, setWeekOffset] = useState(0);
      const days = getWeekDays(weekOffset);
      const [activeDateStr, setActiveDateStr] = useState(todayStr);
      const [open, setOpen] = useState(null);
      const [checked, setChecked] = usePersist("plan_checked_v3", {});
      const [customMeals, setCustomMeals] = usePersist("custom_meals_v1", {});
      const [altMeals, setAltMeals] = usePersist("alt_meals_v1", {});
      const [altForm, setAltForm] = useState({ name: "", cal: "", protein: "" });
      const [editingMeal, setEditingMeal] = useState(null);
      const [editInput, setEditInput] = useState("");
      const [editMode, setEditMode] = useState("auto"); // "auto" | "manual" | "alt"
      const [manualCal, setManualCal] = useState("");
      const [aiLoading, setAiLoading] = useState(false);
      const [aiError, setAiError] = useState("");
      const [aiBreakdown, setAiBreakdown] = useState(null);
      const [aiQuestions, setAiQuestions] = useState(null);
      const [aiAnswers, setAiAnswers] = useState("");

      const isViewingToday = activeDateStr === todayStr;
      const activeMealId = isViewingToday ? getActiveMealId(now) : null;

      const getCustom = (mealId) => customMeals[activeDateStr]?.[mealId] || null;
      const getActualCal = (meal) => getCustom(meal.id)?.calories ?? meal.cal;

      const totalCal = MEALS.reduce((s, m) => s + getActualCal(m), 0);
      const planCal  = MEALS.reduce((s, m) => s + m.cal, 0);
      const doneCal  = MEALS.filter(m => checked[activeDateStr + "-" + m.id] || getCustom(m.id)).reduce((s, m) => s + getActualCal(m), 0);
      const doneCount = MEALS.filter(m => checked[activeDateStr + "-" + m.id] || getCustom(m.id)).length;
      const pct = Math.min((doneCal / totalCal) * 100, 100);
      const toggle = id => setChecked(p => ({ ...p, [activeDateStr + "-" + id]: !p[activeDateStr + "-" + id] }));

      const TARGET_CAL = 2061;
      const calGap = doneCal - TARGET_CAL;

      const callGemini = async (prompt) => {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
        const errMsg = data?.error?.message || "";
        if (!text && errMsg) throw new Error(errMsg);
        const jsonMatch = text.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error("תגובה לא תקינה מה-AI");
        return JSON.parse(jsonMatch[0]);
      };

      const analyzeNutrition = async (mealId) => {
        if (!editInput.trim()) return;
        setAiLoading(true); setAiError(""); setAiBreakdown(null); setAiQuestions(null);
        try {
          const prompt = `You are a nutrition expert. The user described a meal: "${editInput.trim()}"

If the description is vague and asking 1-2 short clarifying questions would significantly improve accuracy (e.g. drink size, side dish, sauce), return:
{"questions":["question in the same language as the input"]}

Otherwise, estimate calories per item and return:

    // ─── AdminPinScreen ───────────────────────────────────────────────────────────
    function AdminPinScreen({ onSuccess, onBack }) {
      const [pin, setPin] = useState("");

      const [error, setError] = useState(false);
      const ref = React.useRef(null);

      useEffect(() => {
        ref.current?.focus();
        db.ref("nutrition/_admin/adminPin").once("value", snap => {
          setAdminPin(snap.exists() ? snap.val() : "0000");
        });
      }, []);

      const check = p => {
        const correct = adminPin || "0000";
        if (p === correct) { onSuccess(); }
        else if (p.length === 4) { setError(true); setTimeout(() => { setError(false); setPin(""); }, 800); }
      };
      const press = d => { const next = pin + d; setPin(next); if (next.length === 4 && adminPin !== null) check(next); };
      const handleKey = e => {
        if (e.key >= "0" && e.key <= "9") press(e.key);
        else if (e.key === "Backspace") setPin(p => p.slice(0, -1));
        else if (e.key === "Escape") onBack();
      };

      return (
        <div onKeyDown={handleKey} tabIndex={0} ref={ref} style={{ minHeight: "100vh", background: "linear-gradient(160deg,#080f0a 0%,#0a1520 60%,#080f0a 100%)", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 28, fontFamily: "'Segoe UI',Tahoma,sans-serif", outline: "none" }}>

          setLoading(false);

        db.ref("nutrition/_admin/users").once("value", snap => {
          if (snap.exists()) {
            setManagedUsers(snap.val());
          } else {
            setManagedUsers({ matan: { pin: null }, guest: { pin: null } });
          }
        });
      }, []);

      const savePin = async (type) => {
        const val = type === "matan" ? newMatanPin : newAdminPin;
        if (val.length !== 4 || isNaN(val)) return;
        const path = type === "matan" ? "nutrition/_admin/matanPin" : "nutrition/_admin/adminPin";
        await db.ref(path).set(val);
        setSaved(type === "matan" ? "PIN של מתן עודכן ✓" : "PIN מנהל עודכן ✓");
        setTimeout(() => setSaved(""), 2500);
        if (type === "matan") setNewMatanPin(""); else setNewAdminPin("");
      };

      const requireAdminPin = (label, action) => {
        setConfirmAction({ label, onConfirm: () => { setConfirmAction(null); action(); } });
      };

      const addUser = async () => {
        const uname = newUsername.trim().toLowerCase().replace(/\s+/g,"_");
        if (!uname) return;
        const pinVal = newUserPin.length === 4 ? newUserPin : null;
        const updated = { ...(managedUsers || {}), [uname]: { pin: pinVal } };
        await db.ref("nutrition/_admin/users").set(updated);
        setManagedUsers(updated);
        setNewUsername(""); setNewUserPin("");
        setSaved(`משתמש "${uname}" נוסף ✓`);
        setTimeout(() => setSaved(""), 2500);
      };

      const deleteUser = async (uname) => {
        const updated = { ...(managedUsers || {}) };
        delete updated[uname];
        await db.ref("nutrition/_admin/users").set(updated);
        setManagedUsers(updated);
        setSaved(`משתמש "${uname}" נמחק ✓`);
        setTimeout(() => setSaved(""), 2500);
      };

      const exportBackup = async () => {
        const snap = await db.ref("nutrition").once("value");
        const data = snap.val() || {};
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `nutrition-backup-${toDateStr(new Date())}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportFile = (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          let parsed;
          try {
            parsed = JSON.parse(reader.result);
          } catch (err) {
            setSaved("קובץ לא תקין ✗");
            setTimeout(() => setSaved(""), 2500);
            return;
          }
          requireAdminPin("לשחזר גיבוי? זה ידרוס את כל הנתונים הקיימים של כל המשתמשים!", async () => {
            await db.ref("nutrition").set(parsed);
            setSaved("הגיבוי שוחזר ✓");
            setTimeout(() => setSaved(""), 2500);
          });
        };
        reader.readAsText(file);

        if (!copyFrom || !copyTo || copyFrom === copyTo) return;
        requireAdminPin(`להעתיק את נתוני "${copyFrom}" אל "${copyTo}"? זה ידרוס את הנתונים הקיימים של "${copyTo}"!`, async () => {

      const inputRef = React.useRef(null);

      const check = (p) => {
        if (correctPin === null) return;
        if (p === correctPin) {
          localStorage.setItem("matan_pin_ok", "1");
          onSuccess();
        } else if (p.length === 4) {
          setError(true);
          setTimeout(() => { setError(false); setPin(""); }, 800);
        }

      const press = (d) => {
        const next = pin + d;
        setPin(next);
        if (next.length === 4 && correctPin !== null) check(next);
      };

      const handleKey = (e) => {
        if (e.key >= "0" && e.key <= "9") press(e.key);
        else if (e.key === "Backspace") setPin(p => p.slice(0, -1));
        else if (e.key === "Escape") onBack();

    function RoutineTab() {
      const todayIdx = new Date().getDay();
      const [activeDay, setActiveDay] = useState(todayIdx < 7 ? todayIdx : 0);
      const [shiftOffset, setShiftOffset] = useState(0);
      const [checked, setChecked] = usePersist("checklist_checked", {});
      const [shifts, setShifts] = usePersist("shifts_v1", {});
      const [dayTypes, setDayTypes] = usePersist("workout_day_types_v1", {});
      const [exChecked, setExChecked] = usePersist("workout_exercises_v2", {});
      const shiftWeekDates = getShiftWeekDates(shiftOffset);
      const activeDateStr = shiftWeekDates[activeDay];
      const activeShift = shifts[activeDateStr] || null;
      const dow = new Date(activeDateStr + "T12:00:00").getDay();

      // tasks (checklist)
      const dayPlan = WEEK_PLAN[activeDay];
      const doneTasks = dayPlan.tasks.filter(t => checked[activeDateStr + "-" + t.id]).length;
      const totalTasks = dayPlan.tasks.length;
      const pctTasks = Math.round((doneTasks / totalTasks) * 100);
      const toggleTask = (id) => setChecked(p => {
        const key = activeDateStr + "-" + id;
        if (p[key]) return { ...p, [key]: null };
        const now = new Date();
        const ts = now.toLocaleDateString("he-IL", { day: "2-digit", month: "2-digit" }) + " " +
          now.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
        return { ...p, [key]: ts };
      });

      const walkDays = [0, 2, 4];
      const weekLabel = shiftOffset === 0 ? "שבוע זה" : shiftOffset === 1 ? "שבוע הבא" : shiftOffset === -1 ? "שבוע שעבר" : (shiftOffset > 0 ? "+" : "") + shiftOffset + " שבועות";

      const [imgLoading, setImgLoading] = useState(false);
      const [imgMsg, setImgMsg]         = useState("");

      const readShiftImage = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setImgLoading(true); setImgMsg("");
        try {
          const base64 = await new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(r.result.split(",")[1]);
            r.onerror = rej;
            r.readAsDataURL(file);
          });
          const prompt = `This is a Hebrew work schedule table. Columns are days with dates in DD.MM format at the top (e.g. "21.06"). Rows split into בוקר (morning) and ערב (evening) sections. Each cell has worker names.
Find every date where "מתן" appears and which section.
Return ONLY valid JSON, no extra text:
{"21.06":"morning","22.06":"evening"}
Use exact DD.MM keys from the image. Skip dates where מתן doesn't appear.`;
          const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [
              { inlineData: { mimeType: file.type || "image/jpeg", data: base64 } },
              { text: prompt }
            ]}]})
          });
          const data = await resp.json();
          const text = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
          const errMsg = data?.error?.message || "";
          if (!text && errMsg) throw new Error(errMsg);
          const match = text.match(/\{[\s\S]*\}/);
          if (!match) throw new Error("לא זיהיתי סידור בתמונה");
          const parsed = JSON.parse(match[0]);
          const yr = new Date().getFullYear();
          const newShifts = {};
          for (const [k, v] of Object.entries(parsed)) {
            const parts = k.split(".");
            if (parts.length === 2 && (v === "morning" || v === "evening")) {
              newShifts[`${yr}-${parts[1].padStart(2,"0")}-${parts[0].padStart(2,"0")}`] = v;
            }
          }
          if (!Object.keys(newShifts).length) throw new Error("לא נמצאו משמרות למתן");
          setShifts(p => ({ ...p, ...newShifts }));
          setImgMsg(`✅ זוהו ${Object.keys(newShifts).length} משמרות`);
        } catch(err) { setImgMsg("❌ " + err.message); }
        setImgLoading(false);
        e.target.value = "";
      };

      // workout
      const selectedTypes = dayTypes[activeDateStr] || [];
      const toggleType = (key) => setDayTypes(p => {
        const cur = p[activeDateStr] || [];
        const next = cur.includes(key) ? cur.filter(k => k !== key) : [...cur, key];
        return { ...p, [activeDateStr]: next };
      });

      const activeExSections = selectedTypes
        .filter(t => t === "strength" || t === "physio")
        .map(t => ({ type: t, color: DAY_ACT_TYPES.find(a => a.key === t).color, exercises: getTypeEx(t, dow) }));

      const allExercises = activeExSections.flatMap(s => s.exercises);
      const doneEx = allExercises.filter(e => !!exChecked[activeDateStr + "-" + e.id]).length;
      const totalEx = allExercises.length;
      const pctEx = totalEx > 0 ? Math.round((doneEx / totalEx) * 100) : 0;
      const allExDone = totalEx > 0 && doneEx === totalEx;
      const toggleEx = (exId) => setExChecked(p => ({ ...p, [activeDateStr + "-" + exId]: !p[activeDateStr + "-" + exId] }));

      return (
        <div style={{ padding: "14px 14px 0" }}>
          <div style={{ fontSize: 16, fontWeight: 800, color: "#e0f0e0", marginBottom: 12 }}>🗓️ שגרה יומית</div>

          {/* week navigator */}
          <div style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 4 }}>
            <button onClick={() => setShiftOffset(o => o - 1)} style={{ background: "#0d1f10", border: "1px solid #1a3a1f", borderRadius: 6, color: "#4a7a54", fontSize: 14, cursor: "pointer", padding: "2px 7px", fontFamily: "inherit" }}>‹</button>
            <div style={{ flex: 1, textAlign: "center", fontSize: 11, color: "#4a7a54", fontWeight: 700 }}>{weekLabel}</div>
            <button onClick={() => setShiftOffset(o => o + 1)} style={{ background: "#0d1f10", border: "1px solid #1a3a1f", borderRadius: 6, color: "#4a7a54", fontSize: 14, cursor: "pointer", padding: "2px 7px", fontFamily: "inherit" }}>›</button>
          </div>

          {/* combined day strip: shift + task progress + workout icons */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 3, marginBottom: 10 }}>
            {WEEK_PLAN.map((d, i) => {
              const dateStr = shiftWeekDates[i];
              const dayDoneTasks = d.tasks.filter(t => checked[dateStr + "-" + t.id]).length;
              const dayPctTasks = Math.round((dayDoneTasks / d.tasks.length) * 100);
              const isActive = i === activeDay;
              const isToday = shiftOffset === 0 && i === todayIdx;
              const sh = shifts[dateStr] || null;
              const types = dayTypes[dateStr] || [];
              const workoutIcons = types.map(k => ({ walk: "🚶", strength: "💪", physio: "🧘", rest: "🛋" }[k])).join("");
              return (
                <button key={i} onClick={() => setActiveDay(i)} style={{
                  background: isActive ? "#166534" : "#0d1f10",
                  border: isToday ? "1px solid #4ade80" : "1px solid #1a3a1f",
                  borderRadius: 8, padding: "5px 2px", cursor: "pointer",
                  textAlign: "center", transition: "all 0.2s",
                }}>
                  <div style={{ fontSize: 9, color: isActive ? "#4ade80" : "#4a7a54", fontWeight: isToday ? 700 : 400 }}>{d.day.slice(0,3)}</div>
                  <div style={{ fontSize: 8, color: isActive ? "#a8d8a8" : "#3a5a3a", marginTop: 1 }}>{dateStr.slice(8,10)}/{dateStr.slice(5,7)}</div>
                  <div style={{ fontSize: 9, color: sh ? SHIFT_COLORS[sh] : "#2a3a2a", marginTop: 1 }}>{sh ? SHIFT_ICONS[sh] : "·"}</div>
                  <div style={{ fontSize: 10, fontWeight: 700, color: dayPctTasks === 100 ? "#4ade80" : isActive ? "#e0f0e0" : "#4a7a54", marginTop: 1 }}>
                    {dayPctTasks === 100 ? "✓" : dayDoneTasks > 0 ? dayDoneTasks + "/" + d.tasks.length : "—"}
                  </div>
                  <div style={{ fontSize: 9, marginTop: 1, minHeight: 11 }}>{workoutIcons}</div>
                </button>
              );
            })}
          </div>

          {/* shift picker + shift-image upload */}
          <div style={{ background: "#0d1f10", borderRadius: 12, border: "1px solid #1a3a1f", padding: 12, marginBottom: 12 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div style={{ fontSize: 11, color: "#4a7a54", fontWeight: 700 }}>
                {dayPlan.day} — {activeDateStr.slice(8,10)}/{activeDateStr.slice(5,7)}
                {walkDays.includes(activeDay) && <span style={{ color: "#60a5fa", marginRight: 8 }}>🚶 יום הליכה</span>}
                {activeDay === 5 && <span style={{ color: "#fbbf24", marginRight: 8 }}>🍕 יום חופשי</span>}
                {activeDay === 6 && <span style={{ color: "#4ade80", marginRight: 8 }}>⚖️ יום שקילה</span>}
              </div>
              <label style={{ display: "flex", alignItems: "center", gap: 5, background: "#0b1a0d", border: "1px solid #1a3a1f", borderRadius: 7, padding: "4px 10px", cursor: "pointer", fontSize: 11, color: imgLoading ? "#4a7a54" : "#4ade80", fontWeight: 700, fontFamily: "inherit" }}>
                <input type="file" accept="image/*" style={{ display: "none" }} onChange={readShiftImage} disabled={imgLoading} />
                {imgLoading ? "⏳ קורא..." : "📷 סידור עבודה"}
              </label>
            </div>
            {imgMsg && <div style={{ fontSize: 11, color: imgMsg.startsWith("✅") ? "#4ade80" : "#f87171", marginBottom: 8, textAlign: "center" }}>{imgMsg}</div>}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6 }}>
              {[["morning","☀️","בוקר"],["evening","🌙","ערב"],["off","🏠","חופש"]].map(([key,icon,label]) => {
                const on = activeShift === key;
                return (
                  <button key={key} onClick={() => setShifts(p => ({ ...p, [activeDateStr]: on ? null : key }))}
                    style={{ padding: "8px 4px", borderRadius: 8, border: `1px solid ${on ? SHIFT_COLORS[key] : "#1a3a1f"}`, cursor: "pointer", fontSize: 12, fontWeight: 700, fontFamily: "inherit", background: on ? SHIFT_COLORS[key] + "22" : "#0b1a0d", color: on ? SHIFT_COLORS[key] : "#4a7a54", transition: "all 0.15s" }}>
                    {icon} {label}
                  </button>
                );
              })}
            </div>
          </div>

          {/* ── Section: תפריט המשימות ── */}
          <div style={{ background: "#0d1f10", borderRadius: 12, border: "1px solid #1a3a1f", padding: 14, marginBottom: 12 }}>
            <SectionHead icon="✅" title="משימות היום" done={doneTasks} total={totalTasks} color="#4ade80" />
            <div style={{ height: 6, background: "#1a3a1f", borderRadius: 3, overflow: "hidden", marginBottom: 12 }}>
              <div style={{ height: "100%", width: pctTasks + "%", borderRadius: 3, background: pctTasks === 100 ? "#4ade80" : "linear-gradient(90deg,#166534,#4ade80)", transition: "width 0.4s" }} />
            </div>
            {dayPlan.tasks.map(task => {
              const isDone = !!checked[activeDateStr + "-" + task.id];
              const color = CAT_COLORS[task.cat] || "#4ade80";
              return (
                <div key={task.id} onClick={() => toggleTask(task.id)} style={{
                  marginBottom: 8, borderRadius: 11,
                  border: "1px solid " + (isDone ? color + "55" : "#1a3a1f"),
                  background: isDone ? color + "0f" : "#0b1a0d",
                  padding: "13px 14px", cursor: "pointer",
                  display: "flex", alignItems: "center", gap: 12,
                  opacity: isDone ? 0.7 : 1, transition: "all 0.2s",
                }}>
                  <div style={{
                    width: 24, height: 24, borderRadius: 7, flexShrink: 0,
                    border: "2px solid " + (isDone ? color : "#2d5a3a"),
                    background: isDone ? color + "33" : "transparent",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: 14, color: color, fontWeight: 700, transition: "all 0.15s",
                  }}>{isDone ? "✓" : ""}</div>
                  <span style={{ fontSize: 16 }}>{task.cat}</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13, color: isDone ? "#4a7a54" : "#c8e8c8", textDecoration: isDone ? "line-through" : "none", lineHeight: 1.4 }}>{task.text}</div>
                    {isDone && typeof checked[activeDateStr + "-" + task.id] === "string" && (
                      <div style={{ fontSize: 10, color: "#3a6a44", marginTop: 2 }}>✓ {checked[activeDateStr + "-" + task.id]}</div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {/* ── Section: אימון ── */}
          <div style={{ background: "#0d1f10", borderRadius: 12, border: "1px solid #1a3a1f", padding: 14, marginBottom: 12 }}>
            <SectionHead icon="💪" title="אימון היום" done={doneEx} total={totalEx} color="#f87171" />
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 6, marginBottom: totalEx > 0 ? 10 : 0 }}>
              {DAY_ACT_TYPES.map(at => {
                const on = selectedTypes.includes(at.key);
                return (
                  <button key={at.key} onClick={() => toggleType(at.key)} style={{
                    padding: "7px 2px", borderRadius: 8, border: `1px solid ${on ? at.color : "#1a3a1f"}`,
                    cursor: "pointer", fontSize: 11, fontWeight: 700, fontFamily: "inherit",
                    background: on ? at.color + "22" : "#0b1a0d", color: on ? at.color : "#4a7a54", transition: "all 0.15s",
                  }}>{at.label}</button>
                );
              })}
            </div>
            {totalEx > 0 && (
              <div style={{ height: 5, background: "#1a3a1f", borderRadius: 3, overflow: "hidden", marginBottom: 12 }}>
                <div style={{ height: "100%", width: pctEx + "%", borderRadius: 3, background: allExDone ? "#4ade80" : "linear-gradient(90deg,#f87171aa,#f87171)", transition: "width 0.4s" }} />
              </div>
            )}

            {activeExSections.map(section => (
              <div key={section.type}>
                <div style={{ fontSize: 11, color: section.color, fontWeight: 700, marginBottom: 6, marginTop: 4 }}>
                  {DAY_ACT_TYPES.find(a => a.key === section.type).label}
                </div>
                {section.exercises.map(ex => {
                  const isDone = !!exChecked[activeDateStr + "-" + ex.id];
                  return (
                    <div key={ex.id} onClick={() => toggleEx(ex.id)} style={{
                      marginBottom: 8, borderRadius: 11,
                      border: `1px solid ${isDone ? section.color + "55" : "#1a3a1f"}`,
                      background: isDone ? section.color + "0f" : "#0b1a0d",
                      padding: "12px 14px", cursor: "pointer",
                      display: "flex", alignItems: "center", gap: 12,
                      opacity: isDone ? 0.7 : 1, transition: "all 0.2s",
                    }}>
                      <div style={{
                        width: 24, height: 24, borderRadius: 7, flexShrink: 0,
                        border: `2px solid ${isDone ? section.color : "#2d5a3a"}`,
                        background: isDone ? section.color + "33" : "transparent",
                        display: "flex", alignItems: "center", justifyContent: "center",
                        fontSize: 13, color: section.color, fontWeight: 700,
                      }}>{isDone ? "✓" : ""}</div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 14, fontWeight: 600, color: isDone ? "#4a7a54" : "#e0f0e0", textDecoration: isDone ? "line-through" : "none" }}>{ex.name}</div>
                        {ex.sets ? <div style={{ fontSize: 11, color: section.color, marginTop: 2, fontWeight: 700 }}>{ex.sets}</div> : null}
                        {ex.cat  ? <div style={{ fontSize: 10, color: "#4a7a54", marginTop: 1 }}>{ex.cat}</div> : null}
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}

            {selectedTypes.includes("walk") && !selectedTypes.includes("strength") && !selectedTypes.includes("physio") && (
              <div style={{ background: "#0a1a2e", borderRadius: 11, border: "1px solid #1a3a5a", padding: "12px 14px", color: "#60a5fa", fontSize: 13 }}>
                🚶 יום הליכה — מתיחות בסוף, אין צורך לסמן תרגילים
              </div>
            )}
            {selectedTypes.includes("rest") && selectedTypes.length === 1 && (
              <div style={{ background: "#0b1a0d", borderRadius: 11, border: "1px solid #1a3a1f", padding: "12px 14px", color: "#4a7a54", fontSize: 13 }}>
                🛋 יום מנוחה — הגוף מתאושש ומתחזק
              </div>
            )}
            {selectedTypes.length === 0 && (
              <div style={{ textAlign: "center", color: "#2d5a3a", fontSize: 13, padding: "16px 0" }}>בחר סוג פעילות למעלה</div>
            )}

            {allExDone && (
              <div style={{ background: "#0d2e18", borderRadius: 12, border: "1px solid #1e4a2e", padding: 16, textAlign: "center", marginTop: 8 }}>
                <div style={{ fontSize: 24, marginBottom: 6 }}>🎉</div>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#4ade80" }}>אימון הושלם!</div>
                <div style={{ fontSize: 12, color: "#4a7a54", marginTop: 4 }}>כל הכבוד — תן לגוף לנוח ולהתאושש</div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─── App ──────────────────────────────────────────────────────────────────────
    function NutritionApp() {
      const [tab, setTab] = useState("plan");
      const [activeUser, setActiveUser] = useState(localStorage.getItem("active_user") || null);
      const [pinOk, setPinOk] = useState(localStorage.getItem("matan_pin_ok") === "1");
      const [adminMode, setAdminMode] = useState(false);
      const [adminAuthed, setAdminAuthed] = useState(false);
      const [liveVersion, setLiveVersion] = useState(null);

      // Fetches the actual latest commit touching index.html on main, straight from
      // GitHub — so the label always reflects what's really deployed, never a
      // hand-typed string someone forgot to update.
      useEffect(() => {
        fetch("https://api.github.com/repos/Matankashi/nutrition-plan-/commits?path=index.html&sha=main&per_page=1")
          .then(r => r.ok ? r.json() : Promise.reject())
          .then(data => {
            const commit = Array.isArray(data) && data[0];
            if (!commit) return;
            const sha = commit.sha.slice(0, 7);
            const date = new Date(commit.commit.author.date).toLocaleDateString("he-IL", { day: "2-digit", month: "2-digit" });
            setLiveVersion(`${sha} · ${date}`);
          })
          .catch(() => {});
      }, []);

      const selectUser = (u) => {
        localStorage.setItem("active_user", u);
        setActiveUser(u);
      };

      const logout = () => {
        localStorage.removeItem("active_user");
        localStorage.removeItem("matan_pin_ok");
        setActiveUser(null);
        setPinOk(false);
      };

      if (adminMode && !adminAuthed) return <AdminPinScreen onSuccess={() => setAdminAuthed(true)} onBack={() => setAdminMode(false)} />;
      if (adminMode && adminAuthed) return <AdminPanel onBack={() => { setAdminMode(false); setAdminAuthed(false); }} />;
      if (!activeUser) return <UserSelect onSelect={selectUser} onAdmin={() => setAdminMode(true)} />;
      if (activeUser === "matan" && !pinOk) return <PinScreen onSuccess={() => setPinOk(true)} onBack={() => { localStorage.removeItem("active_user"); setActiveUser(null); }} />;
      CURRENT_USER = activeUser;
      const todayStr = new Date().toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "long" });
      return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(180deg,#060d07 0%,#08130a 100%)", fontFamily: "'Segoe UI',Tahoma,sans-serif", direction: "rtl", color: "#f0fdf4", paddingBottom: "calc(80px + env(safe-area-inset-bottom, 8px))" }}>

          {/* ── Header ── */}
          <div style={{ padding: "16px 18px 14px", background: "rgba(6,13,7,0.88)", backdropFilter: "blur(20px)", borderBottom: "1px solid rgba(34,197,94,0.1)", position: "sticky", top: 0, zIndex: 20 }}>
            <div style={{ maxWidth: 520, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style={{ fontSize: 17, fontWeight: 800, color: "#f0fdf4", letterSpacing: -0.3 }}>
                  {activeUser === "matan" ? "שלום מתן 👋" : "שלום אורח"}
                </div>
                <div style={{ fontSize: 11, color: "#4ade80", marginTop: 2, opacity: 0.75 }}>{todayStr}</div>
              </div>
              <button onClick={logout} style={{ background: "rgba(248,113,113,0.08)", border: "1px solid rgba(248,113,113,0.18)", borderRadius: 10, color: "#f87171", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", padding: "7px 13px" }}>יציאה</button>
            </div>
          </div>

          {/* ── Content ── */}
          <div style={{ maxWidth: 520, margin: "0 auto" }}>
            {tab === "plan" ? <PlanTab /> : tab === "routine" ? <RoutineTab /> : <WeightTab />}
            <div style={{ textAlign: "center", padding: "6px 14px 10px", fontSize: 10, color: "#1a3320" }}>⚠️ יש להתייעץ עם דיאטנית/רופא לפני שינויים תזונתיים משמעותיים</div>
          </div>

          {/* ── Bottom Navigation ── */}
          <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 30, background: "rgba(6,13,7,0.97)", backdropFilter: "blur(24px)", borderTop: "1px solid rgba(34,197,94,0.1)" }}>
            <div style={{ maxWidth: 520, margin: "0 auto", display: "grid", gridTemplateColumns: "1fr 1fr 1fr", padding: "6px 6px 8px" }} className="safe-bottom">
              {[["plan","תפריט","🍽️"],["routine","שגרה","🗓️"],["weight","משקל","⚖️"]].map(([k,l,e]) => {
                const on = tab === k;
                return (
                  <button key={k} onClick={() => setTab(k)} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "7px 4px", borderRadius: 12, fontFamily: "inherit", transition: "all 0.15s" }}>
                    <div style={{ fontSize: 22, opacity: on ? 1 : 0.3, transform: on ? "scale(1.08)" : "scale(1)", transition: "all 0.2s" }}>{e}</div>
                    <div style={{ fontSize: 10, fontWeight: on ? 700 : 400, color: on ? "#22c55e" : "#3a5a3a", transition: "color 0.2s" }}>{l}</div>
                    <div style={{ width: on ? 16 : 0, height: 2, borderRadius: 1, background: "#22c55e", transition: "width 0.25s", marginTop: 1 }} />
                  </button>
                );
              })}
            </div>
          </div>

          <div style={{ position: "fixed", bottom: 4, left: 6, zIndex: 31, fontSize: 9, color: "#2d5a3a", fontFamily: "monospace", pointerEvents: "none" }}>{liveVersion || APP_VERSION}</div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<NutritionApp />);
  </script>
</body>
</html>
