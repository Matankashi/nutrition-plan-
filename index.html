<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ─── helpers ────────────────────────────────────────────────────────────────
    const db = firebase.database();
    const DB_ROOT = "nutrition";
    let CURRENT_USER = "guest";

    function usePersist(key, initial) {
      const [val, setVal] = useState(initial);
      const [error, setError] = useState(null);

      useEffect(() => {
        const path = DB_ROOT + '/' + CURRENT_USER + '/' + key;
        db.ref(path).on('value', snap => {
          if (snap.exists()) setVal(snap.val());
        }, err => {
          console.error(`[Firebase] read failed for ${path}:`, err);
          setError(err.message);
        });
        return () => db.ref(path).off();
      }, [key]);

      const update = (newVal) => {
        setVal(prev => {
          const resolved = typeof newVal === 'function' ? newVal(prev) : newVal;
          db.ref(DB_ROOT + '/' + CURRENT_USER + '/' + key).set(resolved);
          return resolved;
        });
      };

      return [val, update, error];
    }

    function DataError({ message }) {
      return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(160deg,#060d07 0%,#09151f 55%,#060d07 100%)", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 10, fontFamily: "'Segoe UI',Tahoma,sans-serif", direction: "rtl", padding: "40px 32px", textAlign: "center" }}>
          <div style={{ fontSize: 36 }}>⚠️</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: "#f87171" }}>שגיאה בטעינת הנתונים</div>
          <div style={{ fontSize: 13, color: "#4a7a54" }}>נסה לרענן את הדף</div>
          {message && <div style={{ fontSize: 11, color: "#3a5a3a", marginTop: 8, direction: "ltr" }}>{message}</div>}
        </div>
      );
    }

    // ─── data ────────────────────────────────────────────────────────────────────
    const DAY_NAMES = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];

    // קלוריות מאומתות מול מסדי נתונים (USDA + ישראליים), אוגוסט 2026.
    // לחם שיפון מלא מאפייה ~210 קק״ל/100g, פרוסה 45g. טחינה מדוללת ~50 קק״ל/כף.
    // חזה עוף מבושל 165 קק״ל/100g. גבינה לבנה 5% ~78 קק״ל/100g.
    const DEFAULT_MEALS = [
      { id: 1, time: "08:00–09:00", name: "ארוחת בוקר", emoji: "🌅", cal: 438, pro: 30,
        items: ["2 פרוסות לחם שיפון מלא (45 גרם כל אחת)", "2 ביצים", "גבינה לבנה 5% — 80–85 גרם", "ירקות חתוכים", "כפית טחינה מדוללת"],
        tip: "טווח 410–470 קק״ל. מים לפני הארוחה — הביצים והגבינה נותנות בסיס חלבון של 30 גרם לפתיחת היום." },
      { id: 2, time: "12:00", name: "ביניים", emoji: "🥗", cal: 197, pro: 27,
        items: ["סלט ירקות (שליש ממנה גדולה)", "שליש כפית שמן זית", "קופסת טונה במים 98 גרם מסונן", "כף טחינה מדוללת"],
        tip: "טווח 180–215 קק״ל. הטונה לבדה נותנת 24 גרם חלבון — קופסה שלמה, לא חצי." },
      { id: 3, time: "14:00", name: "ארוחת צהריים", emoji: "🍽️", cal: 549, pro: 56,
        items: ["150 גרם חזה עוף אחרי בישול", "100 גרם קינואה מבושלת", "חצי בטטה (110 גרם)", "ירקות מבושלים (קישוא/סלק)", "כף טחינה מדוללת"],
        tip: "טווח 510–590 קק״ל. הארוחה הגדולה של היום — 56 גרם חלבון. קינואה במקום אורז: יותר חלבון וסיבים." },
      { id: 4, time: "17:00–18:00", name: "שייק חלבון", emoji: "🥤", cal: 489, pro: 34,
        items: ["30 גרם אבקת חלבון אפונה", "בננה בינונית-גדולה (130 גרם)", "30 גרם שיבולת שועל", "5 גרם צ׳יה", "5 גרם שיפון", "3 אגוזי מלך שלמים או כף חמאת בוטנים", "קינמון"],
        tip: "טווח 455–520 קק״ל. ביום הליכה — חמאת בוטנים. ביום מנוחה — אגוזי מלך (אומגה-3)." },
      { id: 5, time: "20:00–21:00", name: "ארוחת ערב", emoji: "🌙", cal: 253, pro: 20,
        items: ["ביצה אחת", "גבינה לבנה 5% — 80 גרם", "ירקות חתוכים", "פרוסת לחם שיפון מלא אחת"],
        tip: "טווח 235–275 קק״ל. ארוחה קלה לסיום. אם רעב אחרי — יוגורט יווני בלבד, לא מתוק." },
    ];

    const EC = { "⚡":"#fbbf24","🌅":"#fb923c","🥗":"#4ade80","🍽️":"#60a5fa","🥤":"#a78bfa","🍫":"#d4a857","🌙":"#818cf8","🍌":"#facc15","🌃":"#c084fc" };
    const START_W = 86, GOAL_W = 75;
    const HEIGHT_CM = 175;
    const BIRTHDAY = new Date(1991, 5, 5);
    const APP_VERSION = "Version 2";

    // תיוג יום: מה נכנס (אכילה) ומה יצא (פעילות).
    // משמש לימים שלא נרשמו בהם ארוחות — רישום בפועל תמיד גובר על התג.
    const EAT_TYPES = [
      { key: "plan",  label: "✅ תפריט",       cal: null, color: "#4ade80" },
      { key: "light", label: "⚠️ חריגה קלה",  cal: 2300, color: "#fbbf24" },
      { key: "big",   label: "🔴 חריגה גדולה", cal: 3200, color: "#f87171" },
    ];
    const ACT_TYPES = [
      { key: "rest", label: "🛋 מנוחה",   mult: 1.35, color: "#4a7a54" },
      { key: "work", label: "☕ עבודה",   mult: 1.55, color: "#fbbf24" },
      { key: "gym",  label: "💪 אימון",   mult: 1.60, color: "#f87171" },
      { key: "both", label: "☕💪 שניהם", mult: 1.75, color: "#a78bfa" },
    ];

    // Katch-McArdle משתמש במסה רזה ולכן מדויק יותר כשידוע אחוז שומן;
    // בלי מדידות היקף נופלים חזרה ל-Mifflin-St Jeor.
    const calcAge = (ref) => {
      let a = ref.getFullYear() - BIRTHDAY.getFullYear();
      if (ref < new Date(ref.getFullYear(), BIRTHDAY.getMonth(), BIRTHDAY.getDate())) a--;
      return a;
    };
    const calcBodyFat = (waist, neck) =>
      (waist !== null && neck !== null && waist > neck)
        ? +(86.010 * Math.log10(waist - neck) - 70.041 * Math.log10(HEIGHT_CM) + 30.30).toFixed(1)
        : null;
    const calcBMR = (kg, bodyFat, ref) => {
      if (bodyFat !== null) return Math.round(370 + 21.6 * (kg * (1 - bodyFat / 100)));
      return Math.round(10 * kg + 6.25 * HEIGHT_CM - 5 * calcAge(ref) + 5);
    };

    // קו יעד היברידי: 0.8%/שבוע בחודש הראשון (ירידת מים וגליקוגן),
    // 0.45%/שבוע אחריו. אחוזי ולא קבוע — מתעגל מעצמו ככל שהמשקל יורד.
    // Closed-form (not iterative) so the curve is continuous at the
    // week-4 phase boundary — no kink at fractional weeks.
    const PHASE1_WEEKS = 4;
    const PHASE1_RATE  = 0.992;   // -0.8%/week
    const PHASE2_RATE  = 0.9955;  // -0.45%/week
    const idealWeightAt = (startKg, weeks) => {
      const w = Math.max(0, weeks);
      if (w <= PHASE1_WEEKS) return startKg * Math.pow(PHASE1_RATE, w);
      return startKg
        * Math.pow(PHASE1_RATE, PHASE1_WEEKS)
        * Math.pow(PHASE2_RATE, w - PHASE1_WEEKS);
    };

    const MEAL_WINDOWS = { 1: [8*60, 11*60+59], 2: [12*60, 13*60+59], 3: [14*60, 16*60+59], 4: [17*60, 19*60+59], 5: [20*60, 23*60+59] };

    const toDateStr = (d) => {
      const p = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    };

    const getActiveMealId = (now) => {
      const mins = now.getHours() * 60 + now.getMinutes();
      for (const [id, [start, end]] of Object.entries(MEAL_WINDOWS)) {
        if (mins >= start && mins <= end) return Number(id);
      }
      for (const [id, [start]] of Object.entries(MEAL_WINDOWS)) {
        if (mins < start) return Number(id);
      }
      return null;
    };

    const asArray = (v) => Array.isArray(v) ? v : Object.values(v || {});
    const HE_MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
    const EN_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    const parseDMYDate = (e) => {
      if (!e.date) return null;
      const parts = e.date.split(".");
      if (parts.length < 3) return null;
      return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
    };

    // Reusable add-entry + grouped-history widget (year → month → week → entry),
    // shared by weight, waist and neck tracking.
    function MeasurementCard({ entries, onAdd, valueField, unit, min, max, addLabel, addPlaceholder, addHint, historyLabel, sectionTitle }) {
      const [input, setInput] = useState("");
      const [expandedKeys, setExpandedKeys] = useState({});
      const toggleKey = key => setExpandedKeys(p => ({ ...p, [key]: !p[key] }));
      const [historyOpen, setHistoryOpen] = useState(false);

      const handleAdd = () => {
        const val = parseFloat(input.replace(",", "."));
        if (isNaN(val) || val < min || val > max) return;
        const now = new Date();
        const date = now.toLocaleDateString("he-IL", { day: "2-digit", month: "2-digit", year: "numeric" });
        onAdd(val, date);
        setInput("");
      };

      const today = new Date();
      const curMonth = today.getMonth(), curYear = today.getFullYear();

      const monthGroups = [];
      entries.forEach((e, i) => {
        const d = parseDMYDate(e);
        const key = d ? `${d.getFullYear()}-${d.getMonth()}` : `x-${i}`;
        const isCur = d ? (d.getMonth() === curMonth && d.getFullYear() === curYear) : false;
        const mLabel = d ? `${HE_MONTHS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}` : "";
        let g = monthGroups.find(g => g.key === key);
        if (!g) { g = { key, year: d ? d.getFullYear() : null, label: mLabel, isCurrent: isCur, entries: [], weekGroups: [] }; monthGroups.push(g); }
        g.entries.push({ ...e, origIdx: i });
        if (d) {
          const weekNum = Math.ceil(d.getDate() / 7);
          const wKey = `${key}-w${weekNum}`;
          const wLabel = `${EN_MONTHS[d.getMonth()]} ${String(d.getFullYear()).slice(2)} Week ${weekNum}`;
          let wg = g.weekGroups.find(w => w.key === wKey);
          if (!wg) { wg = { key: wKey, label: wLabel, weekNum, entries: [] }; g.weekGroups.push(wg); }
          wg.entries.push({ ...e, origIdx: i });
        }
      });
      monthGroups.forEach(g => {
        g.weekGroups.forEach(wg => {
          wg.avg = +(wg.entries.reduce((s, e) => s + e[valueField], 0) / wg.entries.length).toFixed(2);
        });
        g.monthAvg = g.weekGroups.length > 0
          ? +(g.weekGroups.reduce((s, wg) => s + wg.avg, 0) / g.weekGroups.length).toFixed(2)
          : (g.entries.length > 0 ? g.entries[g.entries.length - 1][valueField] : null);
      });

      const yearGroups = [];
      monthGroups.forEach(g => {
        const yKey = g.year !== null ? String(g.year) : `x-${g.key}`;
        let yg = yearGroups.find(y => y.key === yKey);
        if (!yg) { yg = { key: yKey, label: g.year !== null ? String(g.year) : "", isCurrent: g.year === curYear, monthGroups: [] }; yearGroups.push(yg); }
        yg.monthGroups.push(g);
      });
      yearGroups.forEach(yg => {
        const avgs = yg.monthGroups.map(g => g.monthAvg).filter(v => v !== null);
        yg.yearAvg = avgs.length > 0 ? +(avgs.reduce((s, v) => s + v, 0) / avgs.length).toFixed(2) : null;
      });

      const trendColor = t => (t < 0 ? "#4ade80" : t > 0 ? "#f87171" : "#4a7a54");
      const trendArrow = t => (t < 0 ? "▼" : t > 0 ? "▲" : "=");

      return (
        <>
          {sectionTitle && <div style={{ fontSize: 13, color: "#4ade80", fontWeight: 700, margin: "4px 2px 8px" }}>{sectionTitle}</div>}

          <div style={{ background: "#0d1f10", borderRadius: 12, border: "1px solid #1a3a1f", padding: 14, marginBottom: 12 }}>
            <div style={{ fontSize: 12, color: "#4ade80", fontWeight: 700, marginBottom: 10 }}>{addLabel}</div>
            <div style={{ display: "flex", gap: 8 }}>
              <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && handleAdd()}
                placeholder={addPlaceholder} inputMode="decimal"
                style={{ flex: 1, background: "#0b1a0d", border: "1px solid #2d5a3a", borderRadius: 8, padding: "9px 12px", color: "#e0f0e0", fontSize: 14, fontFamily: "inherit", direction: "ltr", outline: "none" }} />
              <button onClick={handleAdd} style={{ background: "#166534", border: "none", borderRadius: 8, padding: "9px 18px", color: "#fff", fontWeight: 700, cursor: "pointer", fontSize: 13, fontFamily: "inherit" }}>שמור</button>
            </div>
            <div style={{ fontSize: 11, color: "#4a7a54", marginTop: 8 }}>{addHint}</div>
          </div>

          {entries.length > 0 && (
            <div style={{ background: "#0d1f10", borderRadius: 12, border: "1px solid #1a3a1f", padding: 14, marginBottom: 20 }}>
              <div onClick={() => setHistoryOpen(o => !o)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", marginBottom: historyOpen ? 10 : 0 }}>
                <div style={{ fontSize: 12, color: "#4ade80", fontWeight: 700 }}>{historyLabel}</div>
                <span style={{ fontSize: 10, color: "#4a7a54" }}>{historyOpen ? "▲" : "▼"}</span>
              </div>
              {historyOpen && (() => {
                let prevWeekAvg = null;

                const renderWeekRow = (wg, diff) => {
                  const expanded = !!expandedKeys[wg.key];
                  const first = wg.entries[0];
                  const last = wg.entries[wg.entries.length - 1];
                  const trend = diff !== null ? diff : +(last[valueField] - first[valueField]).toFixed(2);
                  return (
                    <div key={wg.key} style={{ marginBottom: 4 }}>
                      {expanded
                        ? wg.entries.map((e, ei) => {
                            const d = ei === 0 ? null : +(e[valueField] - wg.entries[ei - 1][valueField]).toFixed(1);
                            return (
                              <div key={e.origIdx} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: "1px solid #0f2a12" }}>
                                <div style={{ fontSize: 12, color: "#c8e8c8" }}>{e.date}</div>
                                <span style={{ fontSize: 14, fontWeight: 700, fontFamily: "monospace", color: "#e0f0e0" }}>{e[valueField]} {unit}</span>
                                {d !== null
                                  ? <span style={{ fontSize: 12, fontFamily: "monospace", minWidth: 48, textAlign: "left", color: trendColor(d) }}>{trendArrow(d)} {Math.abs(d)}</span>
                                  : <span style={{ minWidth: 48 }} />}
                              </div>
                            );
                          })
                        : (
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: "1px solid #0f2a12" }}>
                            <div style={{ fontSize: 12, color: "#c8e8c8" }}>{first.date}</div>
                            <span style={{ fontSize: 14, fontWeight: 700, fontFamily: "monospace", color: "#e0f0e0" }}>{first[valueField]} {unit}</span>
                            <span style={{ minWidth: 48 }} />
                          </div>
                        )}
                      <div onClick={() => toggleKey(wg.key)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 8px", background: "#0b1a0d", borderRadius: 7, marginBottom: 2, cursor: "pointer" }}>
                        <div style={{ fontSize: 12, color: "#4ade80", fontWeight: 700 }}>{wg.label} <span style={{ fontSize: 10, color: "#4a7a54" }}>{expanded ? "▲" : "▼"}</span></div>
                        <span style={{ fontSize: 14, fontWeight: 700, fontFamily: "monospace", color: "#e0f0e0" }}>{wg.avg} {unit}</span>
                        <span style={{ fontSize: 12, fontFamily: "monospace", minWidth: 48, textAlign: "left", color: trendColor(trend) }}>{trendArrow(trend)} {Math.abs(trend)}</span>
                      </div>
                    </div>
                  );
                };

                const renderMonthGroup = (g, isLastInParent) => {
                  if (g.isCurrent) {
                    return g.weekGroups.map(wg => {
                      const diff = prevWeekAvg !== null ? +(wg.avg - prevWeekAvg).toFixed(2) : null;
                      prevWeekAvg = wg.avg;
                      return renderWeekRow(wg, diff);
                    });
                  }
                  const lastWeekAvg = g.weekGroups.length > 0 ? g.weekGroups[g.weekGroups.length - 1].avg : null;
                  const monthDiff = prevWeekAvg !== null && g.monthAvg !== null ? +(g.monthAvg - prevWeekAvg).toFixed(2) : null;
                  prevWeekAvg = lastWeekAvg;
                  const expanded = !!expandedKeys[g.key];
                  const firstEntry = g.entries[0];
                  const trend = monthDiff !== null ? monthDiff : +(g.monthAvg - firstEntry[valueField]).toFixed(2);
                  return (
                    <div key={g.key} style={{ marginBottom: 6 }}>
                      {expanded
                        ? g.weekGroups.map((wg, wi) => {
                            const d = wi === 0 ? null : +(wg.avg - g.weekGroups[wi - 1].avg).toFixed(2);
                            return renderWeekRow(wg, d);
                          })
                        : (
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: "1px solid #0f2a12" }}>
                            <div style={{ fontSize: 12, color: "#c8e8c8" }}>{firstEntry.date}</div>
                            <span style={{ fontSize: 14, fontWeight: 700, fontFamily: "monospace", color: "#e0f0e0" }}>{firstEntry[valueField]} {unit}</span>
                            <span style={{ minWidth: 48 }} />
                          </div>
                        )}
                      <div onClick={() => toggleKey(g.key)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 8px", background: "#0b1a0d", borderRadius: 7, borderBottom: isLastInParent ? "none" : "1px solid #1a3a1f", marginBottom: 2, cursor: "pointer" }}>
                        <div style={{ fontSize: 12, color: "#4ade80", fontWeight: 700 }}>{g.label} <span style={{ fontSize: 10, color: "#2d5a3a" }}>{expanded ? "▲" : "▼"}</span></div>
                        <span style={{ fontSize: 14, fontWeight: 700, fontFamily: "monospace", color: "#e0f0e0" }}>{g.monthAvg} {unit}</span>
                        <span style={{ fontSize: 12, fontFamily: "monospace", minWidth: 48, textAlign: "left", color: trendColor(trend) }}>{trendArrow(trend)} {Math.abs(trend)}</span>
                      </div>
                    </div>
                  );
                };

                return yearGroups.map((yg, yi) => {
                  if (yg.isCurrent) {
                    return yg.monthGroups.map((g, gi) => renderMonthGroup(g, gi === yg.monthGroups.length - 1 && yi === yearGroups.length - 1));
                  }
                  const entryPrevWeekAvg = prevWeekAvg;
                  const monthNodes = yg.monthGroups.map((g, gi) => renderMonthGroup(g, gi === yg.monthGroups.length - 1));
                  const expandedYear = !!expandedKeys[yg.key];
                  const firstEntry = yg.monthGroups[0].entries[0];
                  const yearTrend = entryPrevWeekAvg !== null && yg.yearAvg !== null
                    ? +(yg.yearAvg - entryPrevWeekAvg).toFixed(2)
                    : +(yg.yearAvg - firstEntry[valueField]).toFixed(2);
                  return (
                    <div key={yg.key} style={{ marginBottom: 8 }}>
                      {expandedYear
                        ? monthNodes
                        : (
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: "1px solid #0f2a12" }}>
                            <div style={{ fontSize: 12, color: "#c8e8c8" }}>{firstEntry.date}</div>
                            <span style={{ fontSize: 14, fontWeight: 700, fontFamily: "monospace", color: "#e0f0e0" }}>{firstEntry[valueField]} {unit}</span>
                            <span style={{ minWidth: 48 }} />
                          </div>
                        )}
                      <div onClick={() => toggleKey(yg.key)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 8px", background: "#0f2a14", borderRadius: 7, border: "1px solid #1e4a2e", marginBottom: 2, cursor: "pointer" }}>
                        <div style={{ fontSize: 13, color: "#4ade80", fontWeight: 700 }}>📅 {yg.label} <span style={{ fontSize: 10, color: "#2d5a3a" }}>{expandedYear ? "▲" : "▼"}</span></div>
                        <span style={{ fontSize: 14, fontWeight: 700, fontFamily: "monospace", color: "#e0f0e0" }}>{yg.yearAvg} {unit}</span>
                        <span style={{ fontSize: 12, fontFamily: "monospace", minWidth: 48, textAlign: "left", color: trendColor(yearTrend) }}>{trendArrow(yearTrend)} {Math.abs(yearTrend)}</span>
                      </div>
                    </div>
                  );
                });
              })()}
            </div>
          )}
        </>
      );
    }

    // גרף קו כללי לכל מדד — משמש למשקל ולהיקף בטן.
    function TrendGraph({ entries, valueField, unit, goal, color, idealFn, showIdeal }) {
      const [selectedIdx, setSelectedIdx] = useState(null);
      if (entries.length === 0) return <div style={{ fontSize: 12, color: "#4a7a54", textAlign: "center", padding: "20px 0" }}>אין עדיין מדידות</div>;

      const GW = 440, GH = 150, PL = 38, PR = 8, PT = 10, PB = 28;
      const iW = GW - PL - PR, iH = GH - PT - PB;
      const vals = entries.map(e => e[valueField]);
      const mn = Math.min(...vals, goal !== null ? goal : Infinity) - 1.5;
      const mx = Math.max(...vals) + 1;

      // X is proportional to elapsed time (entries aren't evenly spaced —
      // e.g. 11-day gaps next to same-day entries), falling back to even
      // index spacing when dates are missing/unusable.
      const dates = entries.map(e => parseDMYDate(e));
      const t0 = dates.find(Boolean);
      const tN = [...dates].reverse().find(Boolean);
      const spanMs = (t0 && tN && tN > t0) ? (tN - t0) : null;
      const toX = i => {
        if (!spanMs || !dates[i]) {
          return PL + (entries.length > 1 ? (i / (entries.length - 1)) * iW : iW / 2);
        }
        return PL + ((dates[i] - t0) / spanMs) * iW;
      };
      const toY = v => PT + iH - ((v - mn) / (mx - mn)) * iH;
      const pts = entries.map((e, i) => toX(i).toFixed(1) + "," + toY(e[valueField]).toFixed(1)).join(" ");
      const goalY = goal !== null ? toY(goal) : null;

      const shortDate = (e) => {
        if (e.date) { const p = e.date.split("."); if (p.length >= 2) return p[0] + "/" + p[1]; }
        return e.label || "";
      };

      // Sampled densely (not just at entry positions) so the target
      // line renders as a smooth curve instead of following the same
      // (possibly sparse/irregular) x-positions as the actual entries.
      const idealPts = (showIdeal && t0 && spanMs && idealFn)
        ? Array.from({ length: 60 }, (_, k) => {
            const frac = k / 59;
            const wk = (spanMs * frac) / (7 * 86400000);
            const v = Math.max(idealFn(entries[0][valueField], wk), goal !== null ? goal : -Infinity);
            return (PL + frac * iW).toFixed(1) + "," + toY(v).toFixed(1);
          }).join(" ")
        : null;

      const maxLabels = 6;
      const labelStep = Math.max(1, Math.ceil(entries.length / maxLabels));

      return (
        <>
          <svg viewBox={`0 0 ${GW} ${GH}`} width={GW} height={GH} style={{ display: "block", width: "100%", height: "auto", maxWidth: GW }}>
            {[0, 0.33, 0.67, 1].map(f => {
              const y = PT + f * iH;
              const v = (mx - f * (mx - mn)).toFixed(1);
              return (
                <g key={f}>
                  <line x1={PL} y1={y} x2={GW - PR} y2={y} stroke="#1a3a1f" strokeWidth={1} />
                  <text x={PL - 3} y={y + 4} textAnchor="end" fontSize={8} fill="#4a7a54">{v}</text>
                </g>
              );
            })}
            {goalY !== null && <>
              <line x1={PL} y1={goalY} x2={GW - PR} y2={goalY} stroke={color + "55"} strokeWidth={1.5} strokeDasharray="4,3" />
              <text x={GW - PR - 2} y={goalY - 4} textAnchor="end" fontSize={8} fill={color}>יעד {goal}</text>
            </>}
            {idealPts && <polyline points={idealPts} fill="none" stroke="#fbbf2470" strokeWidth={1.5} strokeDasharray="3,3" />}
            {entries.length > 1 && <polyline points={pts} fill="none" stroke={color} strokeWidth={2} strokeLinejoin="round" />}
            {entries.map((e, i) => {
              const showLabel = i % labelStep === 0 || i === entries.length - 1;
              const isSel = selectedIdx === i;
              return (
                <g key={i} onClick={() => setSelectedIdx(isSel ? null : i)} style={{ cursor: "pointer" }}>
                  <circle cx={toX(i).toFixed(1)} cy={toY(e[valueField]).toFixed(1)} r={11} fill="transparent" />
                  <circle cx={toX(i).toFixed(1)} cy={toY(e[valueField]).toFixed(1)} r={isSel ? 5.5 : 4} fill={color} stroke="#0d1f10" strokeWidth={1.5} />
                  {showLabel && <text x={toX(i).toFixed(1)} y={GH - PB + 14} textAnchor="middle" fontSize={9} fill="#4a7a54">{shortDate(e)}</text>}
                </g>
              );
            })}
            {selectedIdx !== null && (() => {
              const e = entries[selectedIdx];
              const px = toX(selectedIdx), py = toY(e[valueField]);
              const boxW = 66, boxH = 30;
              const bx = Math.min(Math.max(px - boxW / 2, PL), GW - PR - boxW);
              const above = py - boxH - 10 >= PT;
              const by = above ? py - boxH - 8 : py + 8;
              return (
                <g style={{ pointerEvents: "none" }}>
                  <rect x={bx.toFixed(1)} y={by.toFixed(1)} width={boxW} height={boxH} rx={6} fill="#0d2e18" stroke={color} strokeWidth={1} />
                  <text x={(bx + boxW / 2).toFixed(1)} y={(by + 13).toFixed(1)} textAnchor="middle" fontSize={10} fontWeight="700" fill="#e0f0e0">{e[valueField]} {unit}</text>
                  <text x={(bx + boxW / 2).toFixed(1)} y={(by + 24).toFixed(1)} textAnchor="middle" fontSize={8} fill="#4a7a54">{shortDate(e)}</text>
                </g>
              );
            })()}
          </svg>
          <div style={{ fontSize: 10, color: "#4a7a54", marginTop: 4 }}>
            {showIdeal && <><span style={{ color: "#fbbf24" }}>── </span>קצב יעד &nbsp;</>}
            <span style={{ color }}>── </span>בפועל &nbsp;
            {goal !== null && <><span style={{ color: color + "55" }}>- - </span>יעד</>}
          </div>
        </>
      );
    }

    function WeightTab() {
      const [entriesRaw, setEntries, entriesErr] = usePersist("weight_entries", [{ week: 0, kg: START_W, label: "התחלה" }]);
      const entries = asArray(entriesRaw);
      const [waistEntriesRaw, setWaistEntries, waistErr] = usePersist("waist_entries", []);
      const waistEntries = asArray(waistEntriesRaw);
      const [neckEntriesRaw, setNeckEntries, neckErr] = usePersist("neck_entries", []);
      const neckEntries = asArray(neckEntriesRaw);
      const [customMeals, , customMealsErr] = usePersist("custom_meals_v1", {});
      const [checked, , checkedErr] = usePersist("plan_checked_v3", {});
      const [eatTypes, , eatTypesErr] = usePersist("day_eat_type_v1", {});
      const [actTypes, , actTypesErr] = usePersist("day_act_type_v1", {});
      const [menuOverrides, , menuOverridesErr] = usePersist("menu_override_v1", {});
      const MEALS = DEFAULT_MEALS.map(m => ({ ...m, ...(menuOverrides[m.id] || {}) }));
      const PLAN_CAL = MEALS.reduce((s, m) => s + m.cal, 0);
      const PLAN_PRO = MEALS.reduce((s, m) => s + m.pro, 0);

      const today = new Date();
      const todayStr = toDateStr(today);
      const curMonth = today.getMonth(), curYear = today.getFullYear();

      const last = entries[entries.length - 1].kg;
      const startKg = entries[0].kg;
      const lost = +(startKg - last).toFixed(1);
      const remaining = +(last - GOAL_W).toFixed(1);
      const pct = Math.min((lost / (startKg - GOAL_W)) * 100, 100);

      const addWeightEntry = (kg, date) => {
        const w = entries[entries.length - 1].week + 1;
        const label = date.split(".").slice(0, 2).join("/");
        setEntries(p => [...asArray(p), { week: w, kg, label, date }]);
      };
      const addWaistEntry = (cm, date) => setWaistEntries(p => [...asArray(p), { cm, date }]);
      const addNeckEntry  = (cm, date) => setNeckEntries(p => [...asArray(p), { cm, date }]);

      // ── body composition ──
      const lastWaist = waistEntries.length > 0 ? waistEntries[waistEntries.length - 1].cm : null;
      const lastNeck  = neckEntries.length  > 0 ? neckEntries[neckEntries.length - 1].cm  : null;
      const bodyFat = calcBodyFat(lastWaist, lastNeck);
      const fatMass  = bodyFat !== null ? +(last * bodyFat / 100).toFixed(1) : null;
      const leanMass = bodyFat !== null ? +(last - fatMass).toFixed(1) : null;
      const bmr = calcBMR(last, bodyFat, today);
      const bmi = +(last / Math.pow(HEIGHT_CM / 100, 2)).toFixed(1);
      const age = calcAge(today);
      const nextBday = new Date(curYear, BIRTHDAY.getMonth(), BIRTHDAY.getDate());
      if (nextBday <= today) nextBday.setFullYear(curYear + 1);
      const daysToNextBday = Math.ceil((nextBday - today) / 86400000);

      // כמה מהירידה הייתה שומן וכמה מסה רזה — רק אם יש שתי מדידות היקף
      let compTrend = null;
      if (waistEntries.length > 1 && neckEntries.length > 0) {
        const firstWaist = waistEntries[0].cm;
        const firstNeckE = neckEntries[0].cm;
        const firstBF = calcBodyFat(firstWaist, firstNeckE);
        const wDate = parseDMYDate(waistEntries[0]);
        const nearest = entries.reduce((best, e) => {
          const d = parseDMYDate(e);
          if (!d || !wDate) return best;
          const diff = Math.abs(d - wDate);
          return (!best || diff < best.diff) ? { kg: e.kg, diff } : best;
        }, null);
        if (firstBF !== null && nearest) {
          const f0 = nearest.kg * firstBF / 100, l0 = nearest.kg - f0;
          compTrend = { fatDelta: +(fatMass - f0).toFixed(1), leanDelta: +(leanMass - l0).toFixed(1) };
        }
      }

      // ── ממוצע 7 ימים ──
      const dayCalories = (dateStr) => {
        const logged = MEALS.filter(m => checked[dateStr + "-" + m.id] || customMeals[dateStr]?.[m.id]);
        if (logged.length > 0) {
          return logged.reduce((s, m) => s + (customMeals[dateStr]?.[m.id]?.calories ?? m.cal), 0);
        }
        const tag = eatTypes[dateStr];
        if (!tag) return null;
        const t = EAT_TYPES.find(x => x.key === tag);
        return t ? (t.cal ?? PLAN_CAL) : null;
      };
      const dayTDEE = (dateStr) => {
        const tag = actTypes[dateStr] || "rest";
        const a = ACT_TYPES.find(x => x.key === tag) || ACT_TYPES[0];
        return Math.round(bmr * a.mult);
      };

      const weekDays = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today); d.setDate(today.getDate() - i);
        const ds = toDateStr(d);
        weekDays.push({ dateStr: ds, name: DAY_NAMES[d.getDay()].slice(0,1), cal: dayCalories(ds), tdee: dayTDEE(ds) });
      }
      const tracked = weekDays.filter(d => d.cal !== null);
      const weekStat = tracked.length > 0 ? (() => {
        const avgCal  = Math.round(tracked.reduce((s,d) => s + d.cal, 0) / tracked.length);
        const avgTDEE = Math.round(tracked.reduce((s,d) => s + d.tdee, 0) / tracked.length);
        const deficit = avgTDEE - avgCal;
        return { avgCal, avgTDEE, deficit, kgWeek: +(deficit * 7 / 7700).toFixed(2),
                 pctWeek: +((deficit * 7 / 7700) / last * 100).toFixed(2), n: tracked.length };
      })() : null;

      // ── יעד חודשי ──
      const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
      const daysRemaining = daysInMonth - today.getDate();
      const monthEntries = entries.filter(e => { const d = parseDMYDate(e); return d && d.getMonth() === curMonth && d.getFullYear() === curYear; });
      const prevEntries  = entries.filter(e => { const d = parseDMYDate(e); return d && (d.getFullYear() < curYear || (d.getFullYear() === curYear && d.getMonth() < curMonth)); });
      const monthStart = monthEntries.length > 0 ? monthEntries[0] : (prevEntries.length > 0 ? prevEntries[prevEntries.length - 1] : null);
      const monthEnd = entries[entries.length - 1];
      // יעד חודשי נגזר מקו 0.45%/שבוע: ~1.9% בחודש
      const monthTargetMin = +(last * 0.014).toFixed(1);
      const monthTargetMax = +(last * 0.026).toFixed(1);
      let monthStat = null;
      if (monthStart && monthEnd && monthStart !== monthEnd) {
        const startDate = parseDMYDate(monthStart) || today;
        const daysElapsed = Math.max(1, Math.round((today - startDate) / 86400000));
        const monthLost = +(monthStart.kg - monthEnd.kg).toFixed(2);
        const projected = +((monthLost / daysElapsed) * daysInMonth).toFixed(1);
        const pctOfMax = Math.min((monthLost / monthTargetMax) * 100, 105);
        let status, statusColor;
        if (daysElapsed < 5) { status = "🔍 מוקדם להעריך"; statusColor = "#4a7a54"; }
        else if (projected > monthTargetMax) { status = "⚡ קצב גבוה — שים לב"; statusColor = "#fb923c"; }
        else if (projected >= monthTargetMin) { status = "✅ בקצב טוב"; statusColor = "#4ade80"; }
        else if (projected >= monthTargetMin * 0.5) { status = "⚠️ קצת מאחור"; statusColor = "#fbbf24"; }
        else { status = "🔴 מאחור מהיעד"; statusColor = "#f87171"; }
        monthStat = { monthLost, projected, daysRemaining, pctOfMax, status, statusColor };
      }

      // ── צפי הגעה ליעד לפי קו היעד ──
      const weeksToGoal = (() => {
        let w = last, n = 0;
        const firstDate = parseDMYDate(entries[0]);
        const lastDate  = parseDMYDate(entries[entries.length - 1]) || today;
        let elapsed = firstDate ? (lastDate - firstDate) / (7 * 86400000) : 0;
        while (w > GOAL_W && n < 200) { w *= (elapsed + n < 4 ? 0.992 : 0.9955); n++; }
        return n;
      })();

      const Stat = ({ label, value, color, sub }) => (
        <div style={{ flex: 1, background: "#0d1f10", borderRadius: 10, border: "1px solid #1a3a1f", padding: "10px 6px", textAlign: "center" }}>
          <div style={{ fontSize: 17, fontWeight: 700, color, fontFamily: "monospace" }}>{value}</div>
          <div style={{ fontSize: 10, color: "#4a7a54", marginTop: 2 }}>{label}</div>
          {sub ? <div style={{ fontSize: 9, color: "#4a7a54", marginTop: 2 }}>{sub}</div> : null}
        </div>
      );

      const dataError = entriesErr || waistErr || neckErr || customMealsErr || checkedErr || eatTypesErr || actTypesErr || menuOverridesErr;
      if (dataError) return <DataError message={dataError} />;

      return (
        <div style={{ padding: "14px 14px 0" }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
            <Stat label="משקל נוכחי" value={last + " ק״ג"} color="#4ade80" />
            <Stat label="ירדת" value={lost + " ק״ג"} color="#60a5fa" />
            <Stat label="נותר" value={remaining + " ק״ג"} color="#f87171" />
          </div>

          <div style={{ background: "#0d1f10", borderRadius: 12, border: "1px solid #1a3a1f", padding: 14, marginBottom: 12 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 8 }}>
              <span style={{ color: "#4ade80", fontWeight: 700 }}>🎯 יעד: {GOAL_W} ק״ג</span>
              <span style={{ color: "#4a7a54" }}>~{weeksToGoal} שבועות בקצב היעד</span>
            </div>
            <div style={{ height: 10, background: "#1a3a1f", borderRadius: 5, overflow: "hidden" }}>
              <div style={{ height: "100%", width: pct + "%", borderRadius: 5, background: "linear-gradient(90deg,#166534,#4ade80)", transition: "width 0.5s" }} />
            </div>
            <div style={{ textAlign: "center", fontSize: 11, color: "#4a7a54", marginTop: 5 }}>{pct.toFixed(1)}% מהדרך</div>
          </div>

          {/* ── ממוצע 7 ימים ── */}
          {weekStat && (
            <div style={{ background: "#0d1f10", borderRadius: 12, border: "1px solid #1a3a1f", padding: 14, marginBottom: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <span style={{ fontSize: 12, color: "#4ade80", fontWeight: 700 }}>📊 ממוצע 7 ימים</span>
                <span style={{ fontSize: 10, color: "#4a7a54" }}>{weekStat.n}/7 ימים עם נתונים</span>
              </div>
              {[["נאכל בממוצע", weekStat.avgCal.toLocaleString() + " קל׳", "#e0f0e0"],
                ["הוצאה בממוצע", weekStat.avgTDEE.toLocaleString() + " קל׳", "#60a5fa"]].map(([l,v,c]) => (
                <div key={l} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#0b1a0d", borderRadius: 8, padding: "9px 12px", marginBottom: 6 }}>
                  <span style={{ fontSize: 11, color: "#4a7a54" }}>{l}</span>
                  <span style={{ fontSize: 13, fontWeight: 700, color: c, fontFamily: "monospace" }}>{v}</span>
                </div>
              ))}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: weekStat.deficit > 0 ? "#0d2e18" : "#2e0d0d", border: `1px solid ${weekStat.deficit > 0 ? "#1e4a2e" : "#4a1e1e"}`, borderRadius: 8, padding: "10px 12px", marginBottom: 6 }}>
                <span style={{ fontSize: 12, color: weekStat.deficit > 0 ? "#4ade80" : "#f87171", fontWeight: 700 }}>{weekStat.deficit > 0 ? "גירעון יומי ממוצע" : "עודף יומי ממוצע"}</span>
                <span style={{ fontSize: 15, fontWeight: 700, color: weekStat.deficit > 0 ? "#4ade80" : "#f87171", fontFamily: "monospace" }}>{weekStat.deficit > 0 ? "▼" : "▲"} {Math.abs(weekStat.deficit).toLocaleString()} קל׳</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#0b1a0d", borderRadius: 8, padding: "9px 12px" }}>
                <span style={{ fontSize: 11, color: "#4a7a54" }}>צפי ירידה שבועי</span>
                <span style={{ fontSize: 13, fontWeight: 700, color: "#a78bfa", fontFamily: "monospace" }}>{weekStat.kgWeek} ק״ג · {weekStat.pctWeek}%</span>
              </div>
              {weekStat.deficit > 900 && <div style={{ fontSize: 10, color: "#fbbf24", marginTop: 8 }}>⚠️ גירעון מעל 900 קל׳ — מעל הסף שהמחקר ממליץ עליו לשמירת מסת שריר</div>}
              <div style={{ display: "flex", gap: 3, marginTop: 10 }}>
                {weekDays.map(d => {
                  const h = d.cal === null ? 0 : Math.min(Math.round(d.cal / 3500 * 40), 44);
                  const col = d.cal === null ? "#1a3a1f" : d.cal > d.tdee ? "#f87171" : d.cal > PLAN_CAL * 1.15 ? "#fbbf24" : "#4ade80";
                  return (
                    <div key={d.dateStr} style={{ flex: 1, textAlign: "center" }}>
                      <div style={{ height: 44, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
                        <div style={{ width: "100%", height: Math.max(h, 3), background: col + "44", border: `1px solid ${col}`, borderRadius: 3 }} />
                      </div>
                      <div style={{ fontSize: 8, color: "#4a7a54", marginTop: 3 }}>{d.name}</div>
                      <div style={{ fontSize: 8, color: col, fontFamily: "monospace" }}>{d.cal === null ? "—" : d.cal}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* ── פרטים אישיים ── */}
          <div style={{ background: "#0d1f10", borderRadius: 12, border: "1px solid #1a3a1f", padding: 14, marginBottom: 12 }}>
            <div style={{ fontSize: 12, color: "#4ade80", fontWeight: 700, marginBottom: 10 }}>📊 פרטים אישיים</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
              {[
                ["🎂 גיל", `${age}`, `עוד ${daysToNextBday} ימים ל-${age + 1}`],
                ["📏 גובה", `${(HEIGHT_CM/100).toFixed(2)} מ׳`, ""],
                ["📐 BMI", `${bmi}`, bmi < 18.5 ? "תת משקל" : bmi < 25 ? "תקין" : bmi < 30 ? "עודף קל" : "עודף"],
                ["🔥 אחוז שומן", bodyFat !== null ? `${bodyFat}%` : "—", bodyFat !== null ? "נוסחת חיל הים" : "הוסף מדידות היקף"],
              ].map(([l, v, sub]) => (
                <div key={l} style={{ background: "#0b1a0d", borderRadius: 8, border: "1px solid #1a3a1f", padding: "8px 10px" }}>
                  <div style={{ fontSize: 10, color: "#4a7a54", marginBottom: 2 }}>{l}</div>
                  <div style={{ fontSize: 15, fontWeight: 700, color: "#e0f0e0", fontFamily: "monospace" }}>{v}</div>
                  {sub ? <div style={{ fontSize: 9, color: "#4a7a54", marginTop: 2 }}>{sub}</div> : null}
                </div>
              ))}
            </div>

            {bodyFat !== null && (
              <>
                <div style={{ fontSize: 11, color: "#a78bfa", fontWeight: 700, marginBottom: 6 }}>⚖️ הרכב גוף</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
                  <div style={{ background: "#0b1a0d", borderRadius: 8, border: "1px solid #1a3a1f", padding: "8px 10px" }}>
                    <div style={{ fontSize: 10, color: "#4a7a54", marginBottom: 2 }}>🔥 מסת שומן</div>
                    <div style={{ fontSize: 16, fontWeight: 700, color: "#f87171", fontFamily: "monospace" }}>{fatMass} ק״ג</div>
                    {compTrend && <div style={{ fontSize: 9, color: compTrend.fatDelta < 0 ? "#4ade80" : "#f87171", marginTop: 2 }}>{compTrend.fatDelta < 0 ? "▼" : "▲"} {Math.abs(compTrend.fatDelta)} מאז המדידה הראשונה</div>}
                  </div>
                  <div style={{ background: "#0b1a0d", borderRadius: 8, border: "1px solid #1a3a1f", padding: "8px 10px" }}>
                    <div style={{ fontSize: 10, color: "#4a7a54", marginBottom: 2 }}>💪 מסה רזה</div>
                    <div style={{ fontSize: 16, fontWeight: 700, color: "#4ade80", fontFamily: "monospace" }}>{leanMass} ק״ג</div>
                    {compTrend && <div style={{ fontSize: 9, color: compTrend.leanDelta >= 0 ? "#4ade80" : "#fbbf24", marginTop: 2 }}>{compTrend.leanDelta >= 0 ? "▲" : "▼"} {Math.abs(compTrend.leanDelta)} {compTrend.leanDelta >= 0 ? "— שריר נשמר ✓" : "— שים לב"}</div>}
                  </div>
                </div>
              </>
            )}

            <div style={{ fontSize: 11, color: "#4ade80", fontWeight: 700, marginBottom: 6 }}>🔥 קלוריות</div>
            <div style={{ fontSize: 11, color: "#c8e8c8", lineHeight: 2 }}>
              BMR ({bodyFat !== null ? "Katch-McArdle" : "Mifflin-St Jeor"}): <span style={{ color: "#4ade80", fontWeight: 700 }}>{bmr.toLocaleString()} קל׳</span><br/>
              {ACT_TYPES.map(a => (
                <span key={a.key}>{a.label}: <span style={{ color: "#60a5fa", fontWeight: 700 }}>{Math.round(bmr * a.mult).toLocaleString()} קל׳</span><br/></span>
              ))}
            </div>
            <div style={{ marginTop: 8, background: "#0b1a0d", borderRadius: 8, border: "1px solid #1e4a2e", padding: "8px 10px" }}>
              <div style={{ fontSize: 11, color: "#fbbf24", fontWeight: 700, marginBottom: 4 }}>⚡ גירעון בתפריט מלא ({PLAN_CAL.toLocaleString()} קל׳)</div>
              <div style={{ fontSize: 11, color: "#c8e8c8", lineHeight: 1.9 }}>
                {ACT_TYPES.map(a => {
                  const def = Math.round(bmr * a.mult) - PLAN_CAL;
                  return <span key={a.key}>{a.label}: <span style={{ color: def > 900 ? "#fbbf24" : "#4ade80", fontWeight: 700 }}>{def > 0 ? "▼" : "▲"} {Math.abs(def)} קל׳</span><br/></span>;
                })}
              </div>
            </div>
            <div style={{ fontSize: 10, color: "#4a7a54", marginTop: 8, lineHeight: 1.6 }}>
              חלבון בתפריט: {PLAN_PRO}g = {(PLAN_PRO/last).toFixed(2)} g/ק״ג משקל{leanMass ? ` · ${(PLAN_PRO/leanMass).toFixed(2)} g/ק״ג מסה רזה` : ""}. מומלץ בגירעון עם אימוני כוח: 1.6–2.2 g/ק״ג.
            </div>
          </div>

          {monthStat && (
            <div style={{ background: "#0d1f10", borderRadius: 12, border: "1px solid #1a3a1f", padding: 14, marginBottom: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, marginBottom: 10 }}>
                <span style={{ color: "#4ade80", fontWeight: 700 }}>📅 יעד חודשי: {monthTargetMin}–{monthTargetMax} ק״ג</span>
                <span style={{ color: monthStat.statusColor, fontWeight: 700, fontSize: 11 }}>{monthStat.status}</span>
              </div>
              <div style={{ position: "relative", height: 10, background: "#1a3a1f", borderRadius: 5, marginBottom: 8 }}>
                <div style={{ position: "absolute", top: 0, right: 0, height: "100%", width: monthStat.pctOfMax + "%", borderRadius: 5, background: "linear-gradient(90deg,#fbbf24,#4ade80)", transition: "width 0.5s" }} />
                {[monthTargetMin, monthTargetMax].map(t => (
                  <div key={t} style={{ position: "absolute", top: -3, right: (t/monthTargetMax*100) + "%", width: 2, height: 16, background: "#4a7a54", borderRadius: 1 }} />
                ))}
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#4a7a54" }}>
                <span>ירדת החודש: <span style={{ color: "#e0f0e0", fontWeight: 700 }}>{monthStat.monthLost} ק״ג</span></span>
                <span>תחזית: <span style={{ color: "#60a5fa", fontWeight: 700 }}>{monthStat.projected} ק״ג</span></span>
                <span>{monthStat.daysRemaining} ימים נותרו</span>
              </div>
            </div>
          )}

          <div style={{ background: "#0d1f10", borderRadius: 12, border: "1px solid #1a3a1f", padding: 14, marginBottom: 12, overflowX: "auto" }}>
            <div style={{ fontSize: 12, color: "#4ade80", fontWeight: 700, marginBottom: 8 }}>📈 גרף משקל</div>
            <TrendGraph entries={entries} valueField="kg" unit="ק״ג" goal={GOAL_W} color="#4ade80" idealFn={idealWeightAt} showIdeal={true} />
            <div style={{ fontSize: 10, color: "#4a7a54", marginTop: 6, lineHeight: 1.6 }}>
              קו היעד: 0.8% ממשקל הגוף בשבוע בחודש הראשון, 0.45% אחריו — מבוסס על מחקרים שמצאו שקצב זה משמר מסת שריר.
            </div>
          </div>

          <MeasurementCard
            entries={entries} onAdd={addWeightEntry} valueField="kg" unit="ק״ג" min={50} max={130}
            addLabel="➕ הוסף שקילה" addPlaceholder="למשל: 79.5"
            addHint="💡 בוקר, בצום, אותה שעה ואותם בגדים" historyLabel="📋 היסטוריית שקילות" />

          <div style={{ background: "#0d1f10", borderRadius: 12, border: "1px solid #1a3a1f", padding: 14, marginBottom: 12, overflowX: "auto" }}>
            <div style={{ fontSize: 12, color: "#60a5fa", fontWeight: 700, marginBottom: 8 }}>📏 גרף היקף בטן</div>
            <TrendGraph entries={waistEntries} valueField="cm" unit="ס״מ" goal={null} color="#60a5fa" idealFn={null} showIdeal={false} />
            <div style={{ fontSize: 10, color: "#4a7a54", marginTop: 6, lineHeight: 1.6 }}>
              היקף הבטן מודד שומן ויסרלי ישירות — הוא ממשיך לרדת גם כשהמשקל עומד במקום בגלל שריר או מים.
            </div>
          </div>

          <MeasurementCard
            entries={waistEntries} onAdd={addWaistEntry} valueField="cm" unit="ס״מ" min={40} max={200}
            sectionTitle="📏 היקף בטן" addLabel="➕ הוסף מדידה" addPlaceholder="היקף בטן, למשל: 90"
            addHint="💡 בגובה הטבור, בבוקר, בנשיפה רגילה" historyLabel="📋 היסטוריית מדידות" />

          <MeasurementCard
            entries={neckEntries} onAdd={addNeckEntry} valueField="cm" unit="ס״מ" min={20} max={60}
            sectionTitle="📏 היקף צוואר" addLabel="➕ הוסף מדידה" addPlaceholder="היקף צוואר, למשל: 40"
            addHint="💡 מתחת לגרוגרת, בבוקר ובאותם תנאים" historyLabel="📋 היסטוריית מדידות" />
        </div>
      );
    }

    // ─── PlanTab ─────────────────────────────────────────────────────────────────
    let GEMINI_API_KEY = "";

    const getWeekDays = (offset = 0) => {
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i - offset * 7);
        days.push({ dateStr: toDateStr(d), dayName: DAY_NAMES[d.getDay()], display: d.toLocaleDateString("he-IL", { day: "2-digit", month: "2-digit" }) });
      }
      return days;
    };

    const getShiftWeekDates = (offset = 0) => {
      const today = new Date();
      const sunday = new Date(today);
      sunday.setDate(today.getDate() - today.getDay() + offset * 7);
      return Array.from({length: 7}, (_, i) => {
        const d = new Date(sunday);
        d.setDate(sunday.getDate() + i);
        return toDateStr(d);
      });
    };
    const SHIFT_ICONS  = { morning: "☀️", evening: "🌙", off: "🏠" };
    const SHIFT_COLORS = { morning: "#fbbf24", evening: "#818cf8", off: "#4a7a54" };

    function PlanTab({ geminiReady }) {
      const [now, setNow] = useState(new Date());
      useEffect(() => { const t = setInterval(() => setNow(new Date()), 60000); return () => clearInterval(t); }, []);

      const todayStr = toDateStr(now);
      const [weekOffset, setWeekOffset] = useState(0);
      const days = getWeekDays(weekOffset);
      const [activeDateStr, setActiveDateStr] = useState(todayStr);
      const [open, setOpen] = useState(null);
      const [checked, setChecked, checkedErr] = usePersist("plan_checked_v3", {});
      const [customMeals, setCustomMeals, customMealsErr] = usePersist("custom_meals_v1", {});
      const [altMeals, setAltMeals, altMealsErr] = usePersist("alt_meals_v1", {});
      const [eatTypes, setEatTypes, eatTypesErr] = usePersist("day_eat_type_v1", {});
      const [actTypes, setActTypes, actTypesErr] = usePersist("day_act_type_v1", {});
      const [menuOverrides, setMenuOverrides, menuOverridesErr] = usePersist("menu_override_v1", {});
      const MEALS = DEFAULT_MEALS.map(m => ({ ...m, ...(menuOverrides[m.id] || {}) }));
      const PLAN_CAL = MEALS.reduce((s, m) => s + m.cal, 0);
      const PLAN_PRO = MEALS.reduce((s, m) => s + m.pro, 0);
      const [permForm, setPermForm] = useState({ name: "", time: "", emoji: "", cal: "", pro: "", items: "", tip: "" });
      const [weightEntriesRaw, , weightEntriesErr] = usePersist("weight_entries", [{ week: 0, kg: START_W, label: "התחלה" }]);
      const [waistRaw, , waistErr] = usePersist("waist_entries", []);
      const [neckRaw, , neckErr] = usePersist("neck_entries", []);
      const [altForm, setAltForm] = useState({ name: "", cal: "", protein: "" });
      const [editingMeal, setEditingMeal] = useState(null);
      const [editScope, setEditScope] = useState("today");
      const [editInput, setEditInput] = useState("");
      const [editMode, setEditMode] = useState("auto");
      const [manualCal, setManualCal] = useState("");
      const [aiLoading, setAiLoading] = useState(false);
      const [aiError, setAiError] = useState("");
      const [aiBreakdown, setAiBreakdown] = useState(null);
      const [aiQuestions, setAiQuestions] = useState(null);
      const [aiAnswers, setAiAnswers] = useState("");
      const [itemChecks, setItemChecks] = useState({});
      const [itemAmounts, setItemAmounts] = useState({});
      const [extraItems, setExtraItems] = useState([]);
      const [newExtraItem, setNewExtraItem] = useState("");
      const [itemsCal, setItemsCal] = useState("");

      const wEntries = asArray(weightEntriesRaw);
      const curKg = wEntries[wEntries.length - 1].kg;
      const wa = asArray(waistRaw), ne = asArray(neckRaw);
      const bodyFat = calcBodyFat(wa.length ? wa[wa.length-1].cm : null, ne.length ? ne[ne.length-1].cm : null);
      const bmr = calcBMR(curKg, bodyFat, now);

      const isViewingToday = activeDateStr === todayStr;
      const activeMealId = isViewingToday ? getActiveMealId(now) : null;

      const getCustom = (mealId) => customMeals[activeDateStr]?.[mealId] || null;
      const getActualCal = (meal) => getCustom(meal.id)?.calories ?? meal.cal;

      const totalCal = MEALS.reduce((s, m) => s + getActualCal(m), 0);
      const doneMeals = MEALS.filter(m => checked[activeDateStr + "-" + m.id] || getCustom(m.id));
      const doneCal  = doneMeals.reduce((s, m) => s + getActualCal(m), 0);
      const doneCount = doneMeals.length;
      const pct = Math.min((doneCal / totalCal) * 100, 100);
      const toggle = id => setChecked(p => ({ ...p, [activeDateStr + "-" + id]: !p[activeDateStr + "-" + id] }));

      // התג משמש רק אם לא נרשמו ארוחות בפועל
      const eatTag = eatTypes[activeDateStr] || "plan";
      const actTag = actTypes[activeDateStr] || "rest";
      const eatObj = EAT_TYPES.find(e => e.key === eatTag) || EAT_TYPES[0];
      const actObj = ACT_TYPES.find(a => a.key === actTag) || ACT_TYPES[0];
      const estimatedCal = doneCount > 0 ? doneCal : (eatObj.cal ?? PLAN_CAL);
      const estimatedTDEE = Math.round(bmr * actObj.mult);
      const balance = estimatedTDEE - estimatedCal;

      const setEat = k => setEatTypes(p => ({ ...p, [activeDateStr]: k }));
      const setAct = k => setActTypes(p => ({ ...p, [activeDateStr]: k }));

      const callGemini = async (prompt) => {
        if (!GEMINI_API_KEY) throw new Error(geminiReady ? "תכונת ה-AI לא מוגדרת (חסר מפתח)" : "מפתח ה-AI עדיין נטען, נסה שוב בעוד רגע");
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
        const errMsg = data?.error?.message || "";
        if (!text && errMsg) throw new Error(errMsg);
        const jsonMatch = text.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error("תגובה לא תקינה מה-AI");
        return JSON.parse(jsonMatch[0]);
      };

      const analyzeNutrition = async (mealId) => {
        if (!editInput.trim()) return;
        setAiLoading(true); setAiError(""); setAiBreakdown(null); setAiQuestions(null);
        try {
          const prompt = `You are a nutrition expert. The user described a meal: "${editInput.trim()}"

If the description is vague and asking 1-2 short clarifying questions would significantly improve accuracy (e.g. drink size, side dish, sauce), return:
{"questions":["question in the same language as the input"]}

Otherwise, estimate calories per item and return:
{"items":[{"name":"item name in the original language","calories":123}],"total":456}

Return ONLY valid JSON, no markdown, no extra text.`;
          const parsed = await callGemini(prompt);
          if (parsed.questions && parsed.questions.length > 0) setAiQuestions({ questions: parsed.questions, mealId });
          else if (parsed.total) setAiBreakdown({ items: parsed.items || [], total: parsed.total, mealId });
          else setAiError("לא הצלחתי לחשב. נסה לתאר בצורה יותר ברורה.");
        } catch(e) { setAiError(`שגיאה: ${e.message}`); }
        setAiLoading(false);
      };

      const submitAnswers = async () => {
        if (!aiQuestions) return;
        setAiLoading(true); setAiError(""); setAiQuestions(null);
        try {
          const prompt = `You are a nutrition expert. Estimate calories for this meal.
Original description: "${editInput.trim()}"
Additional details from user: "${aiAnswers}"

Return ONLY valid JSON, no markdown:
{"items":[{"name":"item name in the original language","calories":123}],"total":456}`;
          const parsed = await callGemini(prompt);
          if (parsed.total) setAiBreakdown({ items: parsed.items || [], total: parsed.total, mealId: aiQuestions.mealId });
          else setAiError("לא הצלחתי לחשב. נסה שוב.");
        } catch(e) { setAiError(`שגיאה: ${e.message}`); }
        setAiAnswers(""); setAiLoading(false);
      };

      const confirmBreakdown = () => {
        if (!aiBreakdown) return;
        const desc = editInput.trim();
        setCustomMeals(prev => ({ ...prev, [activeDateStr]: { ...(prev[activeDateStr] || {}), [aiBreakdown.mealId]: { description: desc, calories: aiBreakdown.total } } }));
        rememberAltMeal(aiBreakdown.mealId, desc, aiBreakdown.total);
        setEditingMeal(null); setEditInput(""); setAiBreakdown(null); setAiError(""); setAiQuestions(null); setAiAnswers("");
      };

      const saveManual = (mealId) => {
        const calories = parseInt(manualCal);
        if (!calories || calories < 1) return;
        const desc = editInput.trim() || "ארוחה מותאמת";
        setCustomMeals(prev => ({ ...prev, [activeDateStr]: { ...(prev[activeDateStr] || {}), [mealId]: { description: desc, calories } } }));
        rememberAltMeal(mealId, desc, calories);
        setEditingMeal(null); setEditInput(""); setManualCal(""); setAiError("");
      };

      const saveItemsLog = (mealId) => {
        const calories = parseInt(itemsCal);
        if (!calories || calories < 1) return;
        const kept = (MEALS.find(m => m.id === mealId)?.items || [])
          .map((_, i) => (itemChecks[i] ? (itemAmounts[i] || "").trim() : null))
          .filter(Boolean);
        const desc = [...kept, ...extraItems].join(", ") || "ארוחה מותאמת";
        setCustomMeals(prev => ({ ...prev, [activeDateStr]: { ...(prev[activeDateStr] || {}), [mealId]: { description: desc, calories } } }));
        rememberAltMeal(mealId, desc, calories);
        setEditingMeal(null); setItemsCal("");
      };

      const parseCalRange = (str) => {
        const nums = (str.match(/\d+(\.\d+)?/g) || []).map(Number);
        if (nums.length === 0) return null;
        return { calMin: Math.min(...nums), calMax: Math.max(...nums) };
      };

      const addAltMeal = (mealId) => {
        const name = altForm.name.trim();
        const range = parseCalRange(altForm.cal);
        if (!name || !range) return;
        setAltMeals(prev => ({ ...prev, [mealId]: [...(prev[mealId] || []), { name, calMin: range.calMin, calMax: range.calMax, protein: altForm.protein.trim() }] }));
        setAltForm({ name: "", cal: "", protein: "" });
      };

      const rememberAltMeal = (mealId, description, calories) => {
        const name = description.trim();
        if (!name) return;
        setAltMeals(prev => {
          const list = prev[mealId] || [];
          if (list.some(a => a.name.trim().toLowerCase() === name.toLowerCase())) return prev;
          return { ...prev, [mealId]: [...list, { name, calMin: calories, calMax: calories, protein: "" }] };
        });
      };

      const deleteAltMeal = (mealId, idx, alt) => {
        setAltMeals(prev => ({ ...prev, [mealId]: (prev[mealId] || []).filter((_, i) => i !== idx) }));
        const custom = getCustom(mealId);
        if (custom && alt && custom.description === alt.name) clearCustom(mealId);
      };

      const pickAltMeal = (mealId, alt) => {
        const calories = Math.round((alt.calMin + alt.calMax) / 2);
        setCustomMeals(prev => ({ ...prev, [activeDateStr]: { ...(prev[activeDateStr] || {}), [mealId]: { description: alt.name, calories } } }));
        setEditingMeal(null); setEditInput(""); setManualCal(""); setAiError("");
      };

      const clearCustom = (mealId) => {
        setCustomMeals(prev => {
          const d = { ...(prev[activeDateStr] || {}) };
          delete d[mealId];
          return { ...prev, [activeDateStr]: d };
        });
      };

      const savePermanent = (mealId) => {
        const cal = parseInt(permForm.cal), pro = parseInt(permForm.pro);
        const items = permForm.items.split("\n").map(s => s.trim()).filter(Boolean);
        if (!permForm.name.trim() || !cal || cal < 1 || !pro || pro < 0 || items.length === 0) return;
        setMenuOverrides(prev => ({ ...prev, [mealId]: {
          name: permForm.name.trim(), time: permForm.time.trim(), emoji: permForm.emoji.trim() || "🍽️",
          cal, pro, items, tip: permForm.tip.trim()
        } }));
        setEditingMeal(null);
      };

      const resetPermanent = (mealId) => {
        setMenuOverrides(prev => {
          const n = { ...prev };
          delete n[mealId];
          return n;
        });
      };

      const activeDay = days.find(d => d.dateStr === activeDateStr) || { dayName: "", display: activeDateStr };

      const dataError = checkedErr || customMealsErr || altMealsErr || eatTypesErr || actTypesErr || menuOverridesErr || weightEntriesErr || waistErr || neckErr;
      if (dataError) return <DataError message={dataError} />;

      return (
        <>
          <div style={{ padding: "10px 14px 0" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
              <button onClick={() => { setWeekOffset(w => w + 1); setOpen(null); }} style={{ background: "#0d1f10", border: "1px solid #1a3a1f", borderRadius: 6, color: "#4a7a54", fontSize: 14, cursor: "pointer", padding: "2px 8px", fontFamily: "inherit" }}>‹</button>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 3, flex: 1 }}>
                {days.map(day => {
                  const dayDone = MEALS.filter(m => checked[day.dateStr + "-" + m.id] || customMeals[day.dateStr]?.[m.id]).length;
                  const isActive = day.dateStr === activeDateStr;
                  const isToday = day.dateStr === todayStr;
                  const tag = eatTypes[day.dateStr];
                  const tagObj = tag ? EAT_TYPES.find(e => e.key === tag) : null;
                  return (
                    <button key={day.dateStr} onClick={() => { setActiveDateStr(day.dateStr); setOpen(null); }} style={{
                      background: isActive ? "#166534" : "#0d1f10", border: isToday ? "1px solid #4ade80" : "1px solid #1a3a1f",
                      borderRadius: 8, padding: "6px 2px", cursor: "pointer", textAlign: "center", transition: "all 0.2s",
                    }}>
                      <div style={{ fontSize: 9, color: isActive ? "#4ade80" : "#4a7a54", fontWeight: isToday ? 700 : 400 }}>{day.dayName.slice(0,3)}</div>
                      <div style={{ fontSize: 9, color: isActive ? "#a8d8a8" : "#3a5a3a", marginTop: 1 }}>{day.display}</div>
                      <div style={{ fontSize: 11, fontWeight: 700, color: dayDone === MEALS.length ? "#4ade80" : isActive ? "#e0f0e0" : "#4a7a54", marginTop: 2 }}>
                        {dayDone === MEALS.length ? "✓" : dayDone > 0 ? dayDone + "/" + MEALS.length : "—"}
                      </div>
                      <div style={{ fontSize: 7, marginTop: 1, minHeight: 9, color: tagObj ? tagObj.color : "transparent" }}>{tagObj && tagObj.key !== "plan" ? "●" : ""}</div>
                    </button>
                  );
                })}
              </div>
              {weekOffset > 0 && <button onClick={() => { setWeekOffset(w => w - 1); setOpen(null); }} style={{ background: "#0d1f10", border: "1px solid #1a3a1f", borderRadius: 6, color: "#4a7a54", fontSize: 14, cursor: "pointer", padding: "2px 8px", fontFamily: "inherit" }}>›</button>}
              {weekOffset === 0 && <div style={{ width: 28 }} />}
            </div>

{"21.06":"morning","22.06":"evening"}
Use exact DD.MM keys from the image. Skip dates where מתן doesn't appear.`;
          const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [
              { inlineData: { mimeType: file.type || "image/jpeg", data: base64 } },
              { text: prompt }
            ]}]})
          });
          const data = await resp.json();
          const text = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
          const errMsg = data?.error?.message || "";
          if (!text && errMsg) throw new Error(errMsg);
          const match = text.match(/\{[\s\S]*\}/);
          if (!match) throw new Error("לא זיהיתי סידור בתמונה");
          const parsed = JSON.parse(match[0]);
          const yr = new Date().getFullYear();
          const newShifts = {};
          for (const [k, v] of Object.entries(parsed)) {
            const parts = k.split(".");
            if (parts.length === 2 && (v === "morning" || v === "evening")) {
              newShifts[`${yr}-${parts[1].padStart(2,"0")}-${parts[0].padStart(2,"0")}`] = v;
            }
          }
          if (!Object.keys(newShifts).length) throw new Error("לא נמצאו משמרות למתן");
          setShifts(p => ({ ...p, ...newShifts }));
          setImgMsg(`✅ זוהו ${Object.keys(newShifts).length} משמרות`);
        } catch(err) { setImgMsg("❌ " + err.message); }
        setImgLoading(false);
        e.target.value = "";
      };

      const selectedTypes = dayTypes[activeDateStr] || [];
      const toggleType = (key) => setDayTypes(p => {
        const cur = p[activeDateStr] || [];

    // ─── PIN pads ─────────────────────────────────────────────────────────────────
    function AdminPinScreen({ onSuccess, onBack }) {
      const [pin, setPin] = useState("");
      const [adminPin, setAdminPin] = useState(null);
      const [error, setError] = useState(false);
      const ref = React.useRef(null);

      useEffect(() => {
        ref.current?.focus();
        db.ref(`${DB_ROOT}/_admin/adminPin`).once("value", snap => setAdminPin(snap.exists() ? snap.val() : "0000"), err => console.error("[Firebase] read failed for _admin/adminPin:", err));
      }, []);

      const check = p => {
        const correct = adminPin || "0000";
        if (p === correct) onSuccess();
        else if (p.length === 4) { setError(true); setTimeout(() => { setError(false); setPin(""); }, 800); }
      };
      const press = d => { const next = pin + d; setPin(next); if (next.length === 4 && adminPin !== null) check(next); };
      const handleKey = e => {
        if (e.key >= "0" && e.key <= "9") press(e.key);
        else if (e.key === "Backspace") setPin(p => p.slice(0, -1));
        else if (e.key === "Escape") onBack();
      };

      return (
        <div onKeyDown={handleKey} tabIndex={0} ref={ref} style={{ minHeight: "100vh", background: "linear-gradient(160deg,#080f0a 0%,#0a1520 60%,#080f0a 100%)", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 28, fontFamily: "'Segoe UI',Tahoma,sans-serif", outline: "none" }}>
          <div style={{ fontSize: 22, fontWeight: 700, color: "#4a7a54" }}>🔧 כניסת מנהל</div>
          <div style={{ display: "flex", gap: 12, marginBottom: 4 }}>
            {[0,1,2,3].map(i => (
              <div key={i} style={{ width: 16, height: 16, borderRadius: "50%", background: pin.length > i ? (error ? "#f87171" : "#4ade80") : "#1a3a1f", border: `2px solid ${error ? "#f87171" : "#2d5a3a"}`, transition: "all 0.15s" }} />
            ))}
          </div>
          {error && <div style={{ color: "#f87171", fontSize: 13, marginTop: -16 }}>קוד שגוי</div>}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 70px)", gap: 10, direction: "ltr" }}>
            {[7,8,9,4,5,6,1,2,3,"",0,"⌫"].map((d, i) => (
              <button key={i} onClick={() => { if (d === "⌫") setPin(p => p.slice(0,-1)); else if (d !== "") press(String(d)); }}
                style={{ height: 70, borderRadius: 14, border: "1px solid #1a3a1f", background: d === "" ? "transparent" : "#0d1f10", color: d === "⌫" ? "#f87171" : "#e0f0e0", fontSize: d === "⌫" ? 20 : 24, fontWeight: 600, cursor: d === "" ? "default" : "pointer", fontFamily: "inherit" }}>
                {d}
              </button>
            ))}
          </div>
          <button onClick={onBack} style={{ background: "transparent", border: "none", color: "#4a7a54", fontSize: 13, cursor: "pointer", fontFamily: "inherit" }}>← חזור</button>
        </div>
      );
    }
