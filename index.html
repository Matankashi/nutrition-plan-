          { id: "pa2", name: "מוביליות כתפיים",          sets: "",                  cat: "מוביליות" },
          { id: "pa3", name: "סקוואט איטי קל",           sets: "1×8–10",            cat: "רגליים"   },
          { id: "pa4", name: "פתיחת ירכיים / קרסוליים",  sets: "",                  cat: "מוביליות" },
          { id: "pa5", name: "מתיחות בסוף",              sets: "",                  cat: ""         },
        ],
        B: [
          { id: "pb1", name: "תרגילי שכמות קלים", sets: "",                    cat: "כתפיים"   },
          { id: "pb2", name: "תלייה קלה",          sets: "אם הכתפיים בסדר",    cat: "כתפיים"   },
          { id: "pb3", name: "מוביליות ירכיים",    sets: "",                    cat: "מוביליות" },
          { id: "pb4", name: "מתיחות בסוף",        sets: "",                    cat: ""         },
        ],
      },
    };

    const getTypeEx = (typeKey, dow) => {
      if (typeKey === "strength") return TYPE_EX.strength[dow === 2 ? "B" : "A"];
      if (typeKey === "physio")   return TYPE_EX.physio[dow === 3 ? "B" : "A"];
      return [];
    };

    function KoachTab() {
      const [now] = useState(new Date());
      const todayStr = toDateStr(now);
      const [weekOffset, setWeekOffset] = useState(0);
      const days = getWeekDays(weekOffset);
      const [activeDateStr, setActiveDateStr] = useState(todayStr);
      const [dayTypes, setDayTypes]   = usePersist("workout_day_types_v1", {});
      const [exChecked, setExChecked] = usePersist("workout_exercises_v2", {});
      const [shifts] = usePersist("shifts_v1", {});

      const activeDay = days.find(d => d.dateStr === activeDateStr) || { dayName: "", display: activeDateStr };
      const dow = new Date(activeDateStr + "T12:00:00").getDay();

      const selectedTypes = dayTypes[activeDateStr] || [];
      const toggleType = (key) => setDayTypes(p => {
        const cur = p[activeDateStr] || [];
        const next = cur.includes(key) ? cur.filter(k => k !== key) : [...cur, key];
        return { ...p, [activeDateStr]: next };
      });

      // build exercise list for selected types (strength/physio only have exercises)
      const activeExSections = selectedTypes
        .filter(t => t === "strength" || t === "physio")
        .map(t => ({ type: t, color: DAY_ACT_TYPES.find(a => a.key === t).color, exercises: getTypeEx(t, dow) }));

      const allExercises = activeExSections.flatMap(s => s.exercises);
      const doneCount = allExercises.filter(e => !!exChecked[activeDateStr + "-" + e.id]).length;
      const total = allExercises.length;
      const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
      const allDone = total > 0 && doneCount === total;
      const toggle = (exId) => setExChecked(p => ({ ...p, [activeDateStr + "-" + exId]: !p[activeDateStr + "-" + exId] }));

      const weeklyCount = (typeKey) => days.filter(d => (dayTypes[d.dateStr] || []).includes(typeKey)).length;

      return (
        <>
          <div style={{ padding: "10px 14px 0" }}>
            {/* week navigator */}
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10 }}>
              <button onClick={() => setWeekOffset(w => w + 1)} style={{ background: "#0d1f10", border: "1px solid #1a3a1f", borderRadius: 6, color: "#4a7a54", fontSize: 14, cursor: "pointer", padding: "2px 8px", fontFamily: "inherit" }}>‹</button>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 3, flex: 1 }}>
                {days.map(day => {
                  const isActive = day.dateStr === activeDateStr;
                  const isToday  = day.dateStr === todayStr;
                  const types    = dayTypes[day.dateStr] || [];
                  const icons    = types.map(k => ({ walk:"🚶", strength:"💪", physio:"🧘", rest:"🛋" }[k])).join("");
                  const sh = shifts[day.dateStr] || null;
                  return (
                    <button key={day.dateStr} onClick={() => setActiveDateStr(day.dateStr)} style={{
                      background: isActive ? "#166534" : "#0d1f10", border: isToday ? "1px solid #4ade80" : (sh ? `1px solid ${SHIFT_COLORS[sh]}55` : "1px solid #1a3a1f"),
                      borderRadius: 8, padding: "5px 2px", cursor: "pointer", textAlign: "center", transition: "all 0.2s",
                    }}>
                      <div style={{ fontSize: 9, color: isActive ? "#4ade80" : "#4a7a54", fontWeight: isToday ? 700 : 400 }}>{day.dayName.slice(0,3)}</div>
                      <div style={{ fontSize: 8, color: isActive ? "#a8d8a8" : "#3a5a3a", marginTop: 1 }}>{sh ? SHIFT_ICONS[sh] : day.display}</div>
                      <div style={{ fontSize: 9, marginTop: 1 }}>{icons || "—"}</div>
                    </button>
                  );
                })}
              </div>
              {weekOffset > 0
                ? <button onClick={() => setWeekOffset(w => w - 1)} style={{ background: "#0d1f10", border: "1px solid #1a3a1f", borderRadius: 6, color: "#4a7a54", fontSize: 14, cursor: "pointer", padding: "2px 8px", fontFamily: "inherit" }}>›</button>
                : <div style={{ width: 28 }} />}
            </div>

            {/* shift banner */}
            {shifts[activeDateStr] && (
              <div style={{ background: "#0b1a0d", borderRadius: 8, border: `1px solid ${SHIFT_COLORS[shifts[activeDateStr]]}44`, padding: "8px 12px", marginBottom: 8, display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 14 }}>{SHIFT_ICONS[shifts[activeDateStr]]}</span>
                <span style={{ fontSize: 11, color: SHIFT_COLORS[shifts[activeDateStr]], fontWeight: 700 }}>
                  {shifts[activeDateStr] === "morning" ? "משמרת בוקר — אימון מתוכנן" : shifts[activeDateStr] === "evening" ? "משמרת ערב — יום מנוחה" : "יום חופש — אימון מתוכנן"}
                </span>
              </div>
            )}

            {/* day header */}
            <div style={{ background: "#0d1f10", borderRadius: 12, border: "1px solid #1a3a1f", padding: 14, marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <span style={{ fontSize: 15, fontWeight: 700, color: "#e0f0e0" }}>{activeDay.dayName} {activeDay.display}</span>
                {total > 0 && <span style={{ fontSize: 12, color: allDone ? "#4ade80" : "#4a7a54", fontWeight: 700 }}>{doneCount}/{total}{allDone ? " ✅" : ""}</span>}
              </div>
              {/* multi-select type picker */}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 6 }}>
                {DAY_ACT_TYPES.map(at => {
                  const on = selectedTypes.includes(at.key);
                  return (
                    <button key={at.key} onClick={() => toggleType(at.key)} style={{
                      padding: "7px 2px", borderRadius: 8, border: `1px solid ${on ? at.color : "#1a3a1f"}`,
                      cursor: "pointer", fontSize: 11, fontWeight: 700, fontFamily: "inherit",
                      background: on ? at.color + "22" : "#0b1a0d", color: on ? at.color : "#4a7a54", transition: "all 0.15s",
                    }}>{at.label}</button>
                  );
                })}
              </div>
              {total > 0 && (
                <div style={{ height: 5, background: "#1a3a1f", borderRadius: 3, overflow: "hidden", marginTop: 10 }}>
                  <div style={{ height: "100%", width: pct + "%", borderRadius: 3, background: allDone ? "#4ade80" : "linear-gradient(90deg,#f87171aa,#f87171)", transition: "width 0.4s" }} />
                </div>
              )}
            </div>
          </div>

          <div style={{ padding: "0 14px" }}>
            {activeExSections.map(section => (
              <div key={section.type}>
                <div style={{ fontSize: 11, color: section.color, fontWeight: 700, marginBottom: 6, marginTop: 4 }}>
                  {DAY_ACT_TYPES.find(a => a.key === section.type).label}
                </div>
                {section.exercises.map(ex => {
                  const isDone = !!exChecked[activeDateStr + "-" + ex.id];
                  return (
                    <div key={ex.id} onClick={() => toggle(ex.id)} style={{
                      marginBottom: 8, borderRadius: 11,
                      border: `1px solid ${isDone ? section.color + "55" : "#1a3a1f"}`,
                      background: isDone ? section.color + "0f" : "#0d1f10",
                      padding: "12px 14px", cursor: "pointer",
                      display: "flex", alignItems: "center", gap: 12,
                      opacity: isDone ? 0.7 : 1, transition: "all 0.2s",
                    }}>
                      <div style={{
                        width: 24, height: 24, borderRadius: 7, flexShrink: 0,
                        border: `2px solid ${isDone ? section.color : "#2d5a3a"}`,
                        background: isDone ? section.color + "33" : "transparent",
                        display: "flex", alignItems: "center", justifyContent: "center",
                        fontSize: 13, color: section.color, fontWeight: 700,
                      }}>{isDone ? "✓" : ""}</div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 14, fontWeight: 600, color: isDone ? "#4a7a54" : "#e0f0e0", textDecoration: isDone ? "line-through" : "none" }}>{ex.name}</div>
                        {ex.sets ? <div style={{ fontSize: 11, color: section.color, marginTop: 2, fontWeight: 700 }}>{ex.sets}</div> : null}
                        {ex.cat  ? <div style={{ fontSize: 10, color: "#4a7a54", marginTop: 1 }}>{ex.cat}</div> : null}
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}

            {selectedTypes.includes("walk") && !selectedTypes.includes("strength") && !selectedTypes.includes("physio") && (
              <div style={{ background: "#0a1a2e", borderRadius: 11, border: "1px solid #1a3a5a", padding: "12px 14px", marginBottom: 8, color: "#60a5fa", fontSize: 13 }}>
                🚶 יום הליכה — מתיחות בסוף, אין צורך לסמן תרגילים
              </div>
            )}
            {selectedTypes.includes("rest") && selectedTypes.length === 1 && (
              <div style={{ background: "#0b1a0d", borderRadius: 11, border: "1px solid #1a3a1f", padding: "12px 14px", marginBottom: 8, color: "#4a7a54", fontSize: 13 }}>
                🛋 יום מנוחה — הגוף מתאושש ומתחזק
              </div>
            )}
            {selectedTypes.length === 0 && (
              <div style={{ textAlign: "center", color: "#2d5a3a", fontSize: 13, padding: "20px 0" }}>בחר סוג פעילות למעלה</div>
            )}

            {allDone && (
              <div style={{ background: "#0d2e18", borderRadius: 12, border: "1px solid #1e4a2e", padding: 16, textAlign: "center", marginBottom: 12 }}>
                <div style={{ fontSize: 24, marginBottom: 6 }}>🎉</div>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#4ade80" }}>אימון הושלם!</div>
                <div style={{ fontSize: 12, color: "#4a7a54", marginTop: 4 }}>כל הכבוד — תן לגוף לנוח ולהתאושש</div>
              </div>
            )}

            <div style={{ background: "#0d1f10", borderRadius: 12, border: "1px solid #1a3a1f", padding: 14, marginTop: 4, marginBottom: 20 }}>
              <div style={{ fontSize: 12, color: "#4ade80", fontWeight: 700, marginBottom: 10 }}>📋 סיכום שבוע נוכחי</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 6 }}>
                {DAY_ACT_TYPES.map(at => (
                  <div key={at.key} style={{ background: "#0b1a0d", borderRadius: 8, border: "1px solid #1a3a1f", padding: "8px 4px", textAlign: "center" }}>
                    <div style={{ fontSize: 15, fontWeight: 700, color: at.color, fontFamily: "monospace" }}>{weeklyCount(at.key)}</div>
                    <div style={{ fontSize: 9, color: "#4a7a54", marginTop: 2 }}>{at.label}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </>
      );
    }

    // ─── App ──────────────────────────────────────────────────────────────────────
    function NutritionApp() {
      const [tab, setTab] = useState("plan");
      const [activeUser, setActiveUser] = useState(localStorage.getItem("active_user") || null);
      const [pinOk, setPinOk] = useState(localStorage.getItem("matan_pin_ok") === "1");
      const [adminMode, setAdminMode] = useState(false);
      const [adminAuthed, setAdminAuthed] = useState(false);

      const selectUser = (u) => {
        localStorage.setItem("active_user", u);
        setActiveUser(u);
      };

      const logout = () => {
        localStorage.removeItem("active_user");
        localStorage.removeItem("matan_pin_ok");
        setActiveUser(null);
        setPinOk(false);
      };

      if (adminMode && !adminAuthed) return <AdminPinScreen onSuccess={() => setAdminAuthed(true)} onBack={() => setAdminMode(false)} />;
      if (adminMode && adminAuthed) return <AdminPanel onBack={() => { setAdminMode(false); setAdminAuthed(false); }} />;
      if (!activeUser) return <UserSelect onSelect={selectUser} onAdmin={() => setAdminMode(true)} />;
      if (activeUser === "matan" && !pinOk) return <PinScreen onSuccess={() => setPinOk(true)} onBack={() => { localStorage.removeItem("active_user"); setActiveUser(null); }} />;
      CURRENT_USER = activeUser;
      const todayStr = new Date().toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "long" });
      return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(180deg,#060d07 0%,#08130a 100%)", fontFamily: "'Segoe UI',Tahoma,sans-serif", direction: "rtl", color: "#f0fdf4", paddingBottom: "calc(80px + env(safe-area-inset-bottom, 8px))" }}>

          {/* ── Header ── */}
          <div style={{ padding: "16px 18px 14px", background: "rgba(6,13,7,0.88)", backdropFilter: "blur(20px)", borderBottom: "1px solid rgba(34,197,94,0.1)", position: "sticky", top: 0, zIndex: 20 }}>
            <div style={{ maxWidth: 520, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style={{ fontSize: 17, fontWeight: 800, color: "#f0fdf4", letterSpacing: -0.3 }}>
                  {activeUser === "matan" ? "שלום מתן 👋" : "שלום אורח"}
                </div>
                <div style={{ fontSize: 11, color: "#4ade80", marginTop: 2, opacity: 0.75 }}>{todayStr}</div>
              </div>
              <button onClick={logout} style={{ background: "rgba(248,113,113,0.08)", border: "1px solid rgba(248,113,113,0.18)", borderRadius: 10, color: "#f87171", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", padding: "7px 13px" }}>יציאה</button>
            </div>
          </div>

          {/* ── Content ── */}
          <div style={{ maxWidth: 520, margin: "0 auto" }}>
            {tab === "plan" ? <PlanTab /> : tab === "checklist" ? <ChecklistTab /> : tab === "koach" ? <KoachTab /> : <WeightTab />}
            <div style={{ textAlign: "center", padding: "6px 14px 10px", fontSize: 10, color: "#1a3320" }}>⚠️ יש להתייעץ עם דיאטנית/רופא לפני שינויים תזונתיים משמעותיים</div>
          </div>

          {/* ── Bottom Navigation ── */}
          <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 30, background: "rgba(6,13,7,0.97)", backdropFilter: "blur(24px)", borderTop: "1px solid rgba(34,197,94,0.1)" }}>
            <div style={{ maxWidth: 520, margin: "0 auto", display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", padding: "6px 6px 8px" }} className="safe-bottom">
              {[["plan","תפריט","🍽️"],["checklist","צ׳קליסט","✅"],["koach","כוח","💪"],["weight","משקל","⚖️"]].map(([k,l,e]) => {
                const on = tab === k;
                return (
                  <button key={k} onClick={() => setTab(k)} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "7px 4px", borderRadius: 12, fontFamily: "inherit", transition: "all 0.15s" }}>
                    <div style={{ fontSize: 22, opacity: on ? 1 : 0.3, transform: on ? "scale(1.08)" : "scale(1)", transition: "all 0.2s" }}>{e}</div>
                    <div style={{ fontSize: 10, fontWeight: on ? 700 : 400, color: on ? "#22c55e" : "#3a5a3a", transition: "color 0.2s" }}>{l}</div>
                    <div style={{ width: on ? 16 : 0, height: 2, borderRadius: 1, background: "#22c55e", transition: "width 0.25s", marginTop: 1 }} />
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<NutritionApp />);
  </script>
</body>
</html>
